name: release-please

# Tags carry an mxl- prefix, so they cannot collide with a version stream
# upstream starts. The image workflow publishes a version tag on
# refs/tags/mxl-v*, so the tag this cuts is what gives a released image its
# version.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please

jobs:
  release-please:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    runs-on: ubuntu-latest
    steps:
      # A tag pushed by the default GITHUB_TOKEN starts no workflow, so the
      # image build would never see the release.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
