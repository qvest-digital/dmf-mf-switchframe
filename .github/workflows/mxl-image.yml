name: MXL image

# Builds the MXL images from Dockerfile.mxl and runs the tests that need
# libmxl, which the upstream workflows skip. Pull requests build and test
# without publishing; main and mxl-v* tags publish.

on:
  push:
    branches:
      - main
    tags:
      - "mxl-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/qvest-digital/dmf-mf-switchframe

jobs:
  test-mxl:
    # A repository rename leaves this string behind, and a mismatch skips the
    # job silently rather than failing it.
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The build stage carries libmxl and the FFmpeg headers the cgo
      # packages need, so the tests run in exactly what the image compiles in.
      - name: Build the test environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: build-base
          load: true
          tags: switchframe-build:test
          cache-from: type=gha,scope=build-base
          cache-to: type=gha,scope=build-base,mode=max
      - name: Test with the mxl build tag
        run: |
          docker run --rm switchframe-build:test \
            go test -tags mxl -race -count=1 ./mxl/... ./output/...

  # The sidecar's own tests build without CEF; nothing upstream runs them.
  test-cef-sidecar:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ThreadSanitizer, which one of the tests runs under, cannot map its
      # shadow memory at the runner kernel's default ASLR entropy.
      - name: Lower mmap randomisation for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Test the CEF sidecar
        run: make -C cef-sidecar test

  # Builds both images into the GHA cache. Nothing is pushed here: the push
  # job waits for the smoke test, so neither image is published unless the
  # CPU image ran an HTML5 graphic.
  image:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    needs: [test-mxl, test-cef-sidecar]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: ${{ matrix.target }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # The sidecar has to start, connect, render a template and deliver frames to
  # the compositor in the image as shipped: with no display, no extra
  # capabilities and the default seccomp profile. The CUDA image cannot start
  # without a driver; its sidecar comes from the same stage.
  smoke:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: cpu
          platforms: linux/amd64
          load: true
          tags: switchframe-mxl:smoke
          cache-from: type=gha,scope=cpu
      - name: Smoke test HTML5 graphics
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect switchframe-mxl:smoke --format 'image size: {{.Size}} bytes'
          docker run -d --name sf-smoke -p 8081:8081 -p 9090:9090 switchframe-mxl:smoke \
            --http-fallback --api-token smoke --html5-graphics=true
          trap 'docker logs sf-smoke 2>&1 | grep -E "htmlgfx|sidecar" || true; docker rm -f sf-smoke >/dev/null' EXIT
          api() { curl -fsS --max-time 10 -H 'Authorization: Bearer smoke' "$@"; }
          frames() {
            curl -fsS --max-time 10 http://localhost:9090/metrics \
              | awk '$1 == "switchframe_htmlgfx_frames_delivered_total" { print int($2) }'
          }
          wait_log() {
            for _ in $(seq 60); do
              if docker logs sf-smoke 2>&1 | grep -qF "$1"; then return 0; fi
              sleep 1
            done
            echo "not logged within 60s: $1"; docker logs sf-smoke 2>&1 | tail -50; return 1
          }
          # Waits for the frame counter to pass $1.
          wait_frames() {
            for _ in $(seq 30); do
              n=$(frames)
              if (( ${n:-0} > $1 )); then echo "$n"; return 0; fi
              sleep 1
            done
            echo "frames delivered stayed at ${n:-none}, want more than $1" >&2; return 1
          }
          wait_log 'htmlgfx: sidecar connected'
          templates=$(api http://localhost:8081/api/graphics/html5/templates)
          echo "$templates" | jq -e 'length > 0' >/dev/null
          url=$(echo "$templates" | jq -er '.[] | select(.id == "ograf-lower-third") | .url')
          layer=$(api -X POST http://localhost:8081/api/graphics | jq -er .id)
          api -X POST -H 'Content-Type: application/json' -d "{\"url\":\"$url\"}" \
            "http://localhost:8081/api/graphics/$layer/html5" >/dev/null
          wait_log 'Format detected: slot=0 format=ograf'
          loaded=$(wait_frames 0)
          echo "frames delivered after load: $loaded"
          api -X POST "http://localhost:8081/api/graphics/$layer/html5/play" >/dev/null
          played=$(wait_frames "$loaded")
          echo "frames delivered after play: $played"

  push:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe' && github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cpu
            suffix: ""
          - target: cuda
            suffix: "-cuda"
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Derive image tags
        id: tags
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/mxl-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mxl-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}${{ matrix.suffix }}
            ${{ steps.tags.outputs.version && format('{0}:{1}{2}', env.IMAGE, steps.tags.outputs.version, matrix.suffix) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
