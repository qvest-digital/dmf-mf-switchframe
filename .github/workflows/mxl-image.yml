name: MXL image

# Builds the MXL images from Dockerfile.mxl and runs the tests that need
# libmxl, which the upstream workflows skip. Pull requests build and test
# without publishing; main, mxl-v* tags and manual runs publish.

on:
  push:
    branches:
      - main
    tags:
      - "mxl-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/qvest-digital/dmf-mf-switchframe

jobs:
  test-mxl:
    # A repository rename leaves this string behind, and a mismatch skips the
    # job silently rather than failing it.
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The build stage carries libmxl and the FFmpeg headers the cgo
      # packages need, so the tests run in exactly what the image compiles in.
      - name: Build the test environment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: build-base
          load: true
          tags: switchframe-build:test
          cache-from: type=gha,scope=build-base
          cache-to: type=gha,scope=build-base,mode=max
      - name: Test with the mxl build tag
        run: |
          docker run --rm switchframe-build:test \
            go test -tags mxl -race -count=1 ./mxl/... ./output/...

  # The sidecar's own tests build without CEF; nothing upstream runs them.
  test-cef-sidecar:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ThreadSanitizer, which one of the tests runs under, cannot map its
      # shadow memory at the runner kernel's default ASLR entropy.
      - name: Lower mmap randomisation for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Test the CEF sidecar
        run: make -C cef-sidecar test

  # Builds both images. Outside pull requests each is pushed by digest
  # alone, with no tag: the smoke test runs that digest and the push job tags
  # it, so a tag names exactly the image that was tested. A pull request
  # pushes nothing, and the smoke test rebuilds its image from the cache.
  image:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    needs: [test-mxl, test-cef-sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - name: Record the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest pushed: '$DIGEST'"; exit 1; }
          echo "$DIGEST" > "digest-$TARGET"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.target }}
          path: digest-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The sidecar has to start, connect, render a template and deliver frames to
  # the compositor in the image as shipped: with no display, no extra
  # capabilities and the default seccomp profile. The CUDA image cannot start
  # without a driver; its sidecar comes from the same stage. The template is
  # the sidecar's test fixture, which loads nothing from the network, so a
  # CDN outage cannot hold back a push.
  smoke:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Load the CPU image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mxl
          target: cpu
          platforms: linux/amd64
          load: true
          tags: switchframe-mxl:smoke
          cache-from: type=gha,scope=cpu
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-cpu
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the pushed CPU image
        if: github.event_name != 'pull_request'
        run: |
          ref="$IMAGE@$(cat digest-cpu)"
          docker pull "$ref"
          docker tag "$ref" switchframe-mxl:smoke
      # The refusal probe's https page needs a certificate Chromium trusts
      # without a flag the engine never passes: a CA in the NSS database
      # Chromium reads from $HOME, which the smoke run mounts.
      - name: Prepare the refusal probe
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libnss3-tools python3-pil >/dev/null
          d="$RUNNER_TEMP/probe"
          mkdir -p "$d/nssdb"
          cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 1 \
            -subj "/CN=refusal probe CA" \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out leaf.pem -days 1 -extfile leaf.ext
          certutil -N -d "sql:$d/nssdb" --empty-password
          certutil -A -d "sql:$d/nssdb" -n refusal-probe-ca -t C,, -i ca.pem
      - name: Smoke test HTML5 graphics
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/probe"
          docker image inspect switchframe-mxl:smoke --format 'image size: {{.Size}} bytes'
          docker run -d --name sf-smoke -p 8081:8081 -p 9090:9090 \
            -v "$PWD/cef-sidecar/test-templates:/smoke-templates:ro" \
            -v "$probe/nssdb:/root/.pki/nssdb" switchframe-mxl:smoke \
            --http-fallback --api-token smoke --html5-graphics=true --cef-templates-dir /smoke-templates
          trap 'docker logs sf-smoke 2>&1 | grep -E "htmlgfx|sidecar|policy|probe-" || true; docker rm -f sf-smoke >/dev/null; sudo kill "${server:-}" 2>/dev/null || true' EXIT
          # The run above overrides --cef-templates-dir, so check that the
          # image ships the demo templates at the engine's default path.
          docker exec sf-smoke test -f /opt/switchframe-cef/demo-templates/ograf-lower-third/index.html
          api() { curl -fsS --max-time 10 -H 'Authorization: Bearer smoke' "$@"; }
          frames() {
            curl -fsS --max-time 10 http://localhost:9090/metrics \
              | awk '$1 == "switchframe_htmlgfx_frames_delivered_total" { print int($2) }'
          }
          wait_log() {
            for _ in $(seq 60); do
              if docker logs sf-smoke 2>&1 | grep -qF "$1"; then return 0; fi
              sleep 1
            done
            echo "not logged within 60s: $1"; docker logs sf-smoke 2>&1 | tail -50; return 1
          }
          # Waits for the frame counter to pass $1.
          wait_frames() {
            for _ in $(seq 30); do
              n=$(frames)
              if (( ${n:-0} > $1 )); then echo "$n"; return 0; fi
              sleep 1
            done
            echo "frames delivered stayed at ${n:-none}, want more than $1" >&2; return 1
          }
          wait_log 'htmlgfx: sidecar connected'
          templates=$(api http://localhost:8081/api/graphics/html5/templates)
          echo "$templates" | jq -e 'length > 0' >/dev/null
          url=$(echo "$templates" | jq -er '.[] | select(.id == "ograf-lower-third") | .url')
          layer=$(api -X POST http://localhost:8081/api/graphics | jq -er .id)
          api -X POST -H 'Content-Type: application/json' -d "{\"url\":\"$url\"}" \
            "http://localhost:8081/api/graphics/$layer/html5" >/dev/null
          wait_log 'Format detected: slot=0 format=ograf'
          loaded=$(wait_frames 0)
          echo "frames delivered after load: $loaded"
          api -X POST "http://localhost:8081/api/graphics/$layer/html5/play" >/dev/null
          played=$(wait_frames "$loaded")
          echo "frames delivered after play: $played"
          api -X DELETE "http://localhost:8081/api/graphics/$layer/html5" >/dev/null

          # Refusal probe: test-templates/refusal-probe aims every way a page
          # can reach a file outside the templates directory, plain http or
          # ws at a listener on the engine's loopback. It must be refused
          # each time, the listener must see no request, and program must
          # show the probe's green page and nothing a probe received.
          [[ "$(docker exec sf-smoke sh -c 'echo $HOME')" == /root ]]
          : > "$probe/hits"
          : > "$probe/server.log"
          sudo nsenter -t "$(docker inspect -f '{{.State.Pid}}' sf-smoke)" -n \
            python3 cef-sidecar/scripts/refusal-probe-server.py \
            cef-sidecar/test-templates "$probe/leaf.pem" "$probe/leaf.key" "$probe/hits" \
            > "$probe/server.log" 2>&1 &
          server=$!
          for _ in $(seq 10); do grep -q serving "$probe/server.log" && break; sleep 1; done
          grep -q serving "$probe/server.log" || { cat "$probe/server.log"; exit 1; }
          api -X POST -H 'Content-Type: application/json' -d '{"source":"source:black"}' \
            http://localhost:8081/api/switch/cut >/dev/null
          # Waits for a program thumbnail in which every pixel is the probe
          # page's green.
          wait_green() {
            for _ in $(seq 30); do
              if curl -fsS --max-time 10 -o "$probe/thumb.jpg" -w '%{http_code}' \
                  http://localhost:8081/api/output/confidence | grep -qx 200 &&
                python3 -c '
          import sys
          from PIL import Image
          px = list(Image.open(sys.argv[1]).convert("RGB").getdata())
          off = sum(1 for r, g, b in px if not (r < 64 and g > 192 and b < 64))
          print(f"program thumbnail: {off} of {len(px)} pixels not green")
          sys.exit(off != 0)' "$probe/thumb.jpg"; then return 0; fi
              sleep 1
            done
            echo "program never showed only the probe page"; return 1
          }
          probe_page() {
            local page=$1 url=$2 result id
            id=$(api -X POST http://localhost:8081/api/graphics | jq -er .id)
            api -X POST -H 'Content-Type: application/json' -d "{\"url\":\"$url\"}" \
              "http://localhost:8081/api/graphics/$id/html5" >/dev/null
            # A layer takes "on" only once the sidecar's first frame for it
            # has arrived.
            for _ in $(seq 30); do
              api -X POST "http://localhost:8081/api/graphics/$id/on" >/dev/null 2>&1 && break
              sleep 1
            done
            api -X POST "http://localhost:8081/api/graphics/$id/on" >/dev/null
            wait_log "probe-result:{\"page\":\"$page\""
            result=$(docker logs sf-smoke 2>&1 | grep -o "probe-result:{\"page\":\"$page\".*" | tail -1)
            result=${result#probe-result:}
            echo "$page: $result"
            echo "$result" | jq -e 'del(.page) | length > 0 and all(.[]; . == "refused")' >/dev/null
            wait_green
            api -X POST "http://localhost:8081/api/graphics/$id/off" >/dev/null
            api -X DELETE "http://localhost:8081/api/graphics/$id/html5" >/dev/null
          }
          probe_url=$(echo "$templates" | jq -er '.[] | select(.id == "refusal-probe") | .url')
          before=$(frames)
          probe_page file "$probe_url"
          probe_page https https://localhost:8443/refusal-probe/net.html
          wait_frames "$before" >/dev/null
          # Each request the URL policy holds is logged with the handler
          # that held it: a service worker's go to the request context's.
          for line in \
            'refused navigation: file:///etc/passwd' \
            'refused load (browser): http://127.0.0.1:18081/from-file-page' \
            'refused load (browser): http://127.0.0.1:18081/from-https-page' \
            'refused load (browser): http://127.0.0.1:18081/worker-fetch' \
            'refused load (browser): http://127.0.0.1:18081/worker-import.js' \
            'refused load (browser): http://127.0.0.1:18081/module-import.js' \
            'refused load (context): http://127.0.0.1:18081/shared-fetch' \
            'refused load (context): http://127.0.0.1:18081/sw-import.js' \
            'refused load (context): http://127.0.0.1:18081/sw-install-fetch' \
            'refused load (context): http://127.0.0.1:18081/sw-fetch'; do
            docker logs sf-smoke 2>&1 | grep -qF "[policy] $line" || { echo "not logged: $line"; exit 1; }
          done
          if [[ -s "$probe/hits" ]]; then
            echo "requests reached the listener:"; cat "$probe/hits"; exit 1
          fi
          echo "refusal probe: every probe refused, no request reached the listener"

  # Tags the digests the image job pushed; nothing is built here.
  push:
    if: github.repository == 'qvest-digital/dmf-mf-switchframe' && github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: mxl-push-${{ github.sha }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            suffix: ""
          - target: cuda
            suffix: "-cuda"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.target }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag the tested image
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          digest=$(cat "digest-$TARGET")
          tags=("$IMAGE:${GITHUB_SHA::7}$SUFFIX")
          if [[ "$GITHUB_REF" == refs/tags/mxl-v* ]]; then
            tags+=("$IMAGE:${GITHUB_REF_NAME#mxl-v}$SUFFIX")
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$digest"
          for tag in "${tags[@]}"; do
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [[ "$got" != "$digest" ]]; then
              echo "$tag is $got, want the tested $digest"; exit 1
            fi
            echo "$tag -> $digest"
          done
