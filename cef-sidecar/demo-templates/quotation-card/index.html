<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ---------- Full-screen overlay ---------- */
#overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
}

#bg-gradient {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg,
        rgba(6, 4, 15, 0.88) 0%,
        rgba(12, 8, 24, 0.85) 40%,
        rgba(8, 6, 20, 0.87) 70%,
        rgba(6, 4, 15, 0.88) 100%);
}

/* ---------- Breathing gradient overlay ---------- */
#bg-breathe {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
}

@keyframes breatheShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ---------- Vignette ---------- */
#vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center,
        transparent 40%,
        rgba(0, 0, 0, 0.35) 100%);
    pointer-events: none;
    opacity: 0;
}

/* ---------- Content container ---------- */
#content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 140px 220px;
    box-sizing: border-box;
}

/* ---------- Decorative quote marks ---------- */
.quote-mark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 360px;
    line-height: 1;
    color: var(--accent-color, #c9a96e);
    opacity: 0;
    position: absolute;
    user-select: none;
    pointer-events: none;
    filter: blur(0.5px);
}

#quote-mark-open {
    top: 80px;
    left: 100px;
    transform: translateY(30px);
}

#quote-mark-close {
    bottom: 40px;
    right: 100px;
    transform: translateY(-30px) scaleX(-1);
}

/* ---------- Thin decorative lines flanking quote ---------- */
.ornament-line {
    position: absolute;
    width: 1px;
    height: 0;
    opacity: 0;
}

#ornament-left {
    left: 180px;
    top: 50%;
    transform: translateY(-50%);
}

#ornament-right {
    right: 180px;
    top: 50%;
    transform: translateY(-50%);
}

/* ---------- Quote text ---------- */
#quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    color: #ffffff;
    line-height: 1.5;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    max-width: 1100px;
    position: relative;
    z-index: 1;
}

#quote-text.size-small  { font-size: 54px; }
#quote-text.size-medium { font-size: 72px; }
#quote-text.size-large  { font-size: 86px; }

/* ---------- Divider ornament ---------- */
#divider {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 48px auto 40px;
    opacity: 0;
    position: relative;
    z-index: 1;
}

#divider-line-left, #divider-line-right {
    height: 1px;
    width: 0;
    opacity: 0.4;
}

#divider-diamond {
    width: 8px;
    height: 8px;
    transform: rotate(45deg) scale(0);
    flex-shrink: 0;
}

/* ---------- Attribution ---------- */
#attribution {
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 44px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--accent-color, #c9a96e);
    text-align: center;
    opacity: 0;
    transform: translateY(14px);
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-glow, rgba(201, 169, 110, 0.3));
}

/* ---------- Source ---------- */
#source {
    font-family: 'Manrope', sans-serif;
    font-weight: 400;
    font-size: 40px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
    margin-top: 14px;
    opacity: 0;
    transform: translateY(10px);
    position: relative;
    z-index: 1;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* ---------- Word spans for animation ---------- */
#quote-text .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    filter: blur(4px);
    margin-right: 0.3em;
}

#quote-text .line-group {
    display: block;
    opacity: 0;
    transform: translateY(20px);
    filter: blur(2px);
}
</style>
</head>
<body>

<div id="overlay">
    <div id="bg-gradient"></div>
    <div id="bg-breathe"></div>
    <div id="vignette"></div>
    <div id="ornament-left" class="ornament-line"></div>
    <div id="ornament-right" class="ornament-line"></div>
    <div id="content">
        <div id="quote-mark-open" class="quote-mark">&ldquo;</div>
        <div id="quote-text" class="size-medium"></div>
        <div id="divider">
            <div id="divider-line-left"></div>
            <div id="divider-diamond"></div>
            <div id="divider-line-right"></div>
        </div>
        <div id="attribution"></div>
        <div id="source"></div>
        <div id="quote-mark-close" class="quote-mark">&rdquo;</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    /* ---------- Element cache ---------- */
    var els = {
        overlay:        document.getElementById('overlay'),
        bgGradient:     document.getElementById('bg-gradient'),
        bgBreathe:      document.getElementById('bg-breathe'),
        vignette:       document.getElementById('vignette'),
        content:        document.getElementById('content'),
        quoteMarkOpen:  document.getElementById('quote-mark-open'),
        quoteMarkClose: document.getElementById('quote-mark-close'),
        quoteText:      document.getElementById('quote-text'),
        divider:        document.getElementById('divider'),
        divLineL:       document.getElementById('divider-line-left'),
        divLineR:       document.getElementById('divider-line-right'),
        divDiamond:     document.getElementById('divider-diamond'),
        attribution:    document.getElementById('attribution'),
        source:         document.getElementById('source'),
        ornamentL:      document.getElementById('ornament-left'),
        ornamentR:      document.getElementById('ornament-right')
    };

    /* ---------- State ---------- */
    var isVisible = false;
    var playTL    = null;
    var stopTL    = null;
    var breatheTween = null;

    var data = {
        quote: 'The only way to do great work is to love what you do.',
        attribution: 'Steve Jobs',
        source: 'Stanford Commencement, 2005',
        accentColor: '#c9a96e',
        fontSize: 'medium',
        overlayOpacity: 0.85,
        textAlign: 'center',
        showQuoteMarks: true,
        animationStyle: 'word',
        gradientAngle: 135
    };

    gsap.defaults({ overwrite: 'auto' });

    /* ---------- Helpers ---------- */
    function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function applyAccent(color) {
        data.accentColor = color;
        els.overlay.style.setProperty('--accent-color', color);
        els.overlay.style.setProperty('--accent-glow', hexToRgba(color, 0.3));
        els.divLineL.style.background = 'linear-gradient(90deg, transparent, ' + color + ')';
        els.divLineR.style.background = 'linear-gradient(90deg, ' + color + ', transparent)';
        els.divDiamond.style.background = color;
        els.ornamentL.style.background = 'linear-gradient(180deg, transparent, ' + hexToRgba(color, 0.15) + ', transparent)';
        els.ornamentR.style.background = 'linear-gradient(180deg, transparent, ' + hexToRgba(color, 0.15) + ', transparent)';
    }

    function applyFontSize(size) {
        els.quoteText.className = 'size-' + (size || 'medium');
    }

    function applyGradient() {
        var angle = data.gradientAngle || 135;
        var op = data.overlayOpacity != null ? data.overlayOpacity : 0.85;
        var r1 = op;
        var r2 = Math.max(0, op - 0.03);
        var r3 = Math.max(0, op - 0.01);
        els.bgGradient.style.background =
            'linear-gradient(' + angle + 'deg, rgba(6,4,15,' + r1 + ') 0%, rgba(12,8,24,' + r2 + ') 40%, rgba(8,6,20,' + r3 + ') 70%, rgba(6,4,15,' + r1 + ') 100%)';
    }

    function applyBreathe() {
        var color = data.accentColor;
        els.bgBreathe.style.background =
            'linear-gradient(270deg, ' +
            hexToRgba(color, 0.03) + ' 0%, ' +
            'transparent 30%, ' +
            hexToRgba(color, 0.04) + ' 50%, ' +
            'transparent 70%, ' +
            hexToRgba(color, 0.03) + ' 100%)';
        els.bgBreathe.style.backgroundSize = '200% 200%';
        els.bgBreathe.style.animation = 'breatheShift 8s ease-in-out infinite';
    }

    function buildQuoteHTML(text, style) {
        if (style === 'line') {
            var lines = text.split(/(?<=[.!?\n])\s+/);
            return lines.map(function(line) {
                return '<span class="line-group">' + escapeHtml(line) + '</span>';
            }).join(' ');
        } else if (style === 'word') {
            var words = text.split(/\s+/);
            return words.map(function(word) {
                return '<span class="word">' + escapeHtml(word) + '</span>';
            }).join('');
        } else {
            return '<span class="word" style="margin-right:0">' + escapeHtml(text) + '</span>';
        }
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function applyData() {
        els.quoteText.innerHTML = buildQuoteHTML(data.quote, data.animationStyle);
        els.attribution.textContent = data.attribution || '';
        els.source.textContent = data.source || '';
        els.quoteText.style.textAlign = data.textAlign || 'center';
        applyAccent(data.accentColor);
        applyFontSize(data.fontSize);
        applyGradient();
        applyBreathe();

        els.quoteMarkOpen.style.display = data.showQuoteMarks ? 'block' : 'none';
        els.quoteMarkClose.style.display = data.showQuoteMarks ? 'block' : 'none';
    }

    applyData();

    /* ---------- Reset ---------- */
    function resetToHidden() {
        gsap.set(els.overlay, { opacity: 0 });
        gsap.set(els.bgBreathe, { opacity: 0 });
        gsap.set(els.vignette, { opacity: 0 });
        gsap.set(els.quoteMarkOpen, { opacity: 0, y: 30 });
        gsap.set(els.quoteMarkClose, { opacity: 0, y: -30 });
        gsap.set(els.divider, { opacity: 0 });
        gsap.set(els.divLineL, { width: 0 });
        gsap.set(els.divLineR, { width: 0 });
        gsap.set(els.divDiamond, { transform: 'rotate(45deg) scale(0)' });
        gsap.set(els.attribution, { opacity: 0, y: 14 });
        gsap.set(els.source, { opacity: 0, y: 10 });
        gsap.set(els.ornamentL, { height: 0, opacity: 0 });
        gsap.set(els.ornamentR, { height: 0, opacity: 0 });

        var spans = els.quoteText.querySelectorAll('.word, .line-group');
        if (spans.length) {
            gsap.set(spans, { opacity: 0, y: 18, scale: 0.96, filter: 'blur(4px)' });
        }
    }

    resetToHidden();

    /* ===================================================================
       CasparCG Lifecycle
       =================================================================== */

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyData();
        resetToHidden();

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Overlay background fades in slowly
        playTL.to(els.overlay, {
            opacity: 1,
            duration: 1.0,
            ease: 'power2.out'
        });

        // 2. Vignette
        playTL.to(els.vignette, {
            opacity: 1,
            duration: 0.8,
            ease: 'power1.out'
        }, '-=0.8');

        // 3. Breathing gradient starts
        playTL.to(els.bgBreathe, {
            opacity: 1,
            duration: 0.6,
            ease: 'power1.out'
        }, '-=0.6');

        // 4. Ornament lines grow
        playTL.to([els.ornamentL, els.ornamentR], {
            height: 200,
            opacity: 1,
            duration: 0.8,
            ease: 'power2.out'
        }, '-=0.5');

        // 5. Decorative quote marks drift in -- ethereal
        if (data.showQuoteMarks) {
            playTL.to(els.quoteMarkOpen, {
                opacity: 0.06,
                y: 0,
                duration: 1.0,
                ease: 'power2.out'
            }, '-=0.7');

            playTL.to(els.quoteMarkClose, {
                opacity: 0.06,
                y: 0,
                duration: 1.0,
                ease: 'power2.out'
            }, '-=0.9');
        }

        // 6. Quote text -- word-by-word with blur-deblur (the signature moment)
        var spans = els.quoteText.querySelectorAll('.word, .line-group');
        if (spans.length > 0) {
            var isWord = data.animationStyle === 'word';
            var isLine = data.animationStyle === 'line';
            var staggerDelay = isLine ? 0.3 : isWord ? 0.07 : 0;
            var dur = isWord ? 0.45 : isLine ? 0.5 : 0.8;

            playTL.to(spans, {
                opacity: 1,
                y: 0,
                scale: 1,
                filter: 'blur(0px)',
                duration: dur,
                ease: 'power2.out',
                stagger: staggerDelay
            }, '-=0.5');
        }

        // 7. Divider diamond and lines draw
        playTL.to(els.divider, {
            opacity: 1,
            duration: 0.1
        }, '-=0.3');

        playTL.to(els.divDiamond, {
            transform: 'rotate(45deg) scale(1)',
            duration: 0.3,
            ease: 'back.out(2)'
        }, '-=0.2');

        playTL.to(els.divLineL, {
            width: 60,
            duration: 0.5,
            ease: 'power2.out'
        }, '-=0.15');

        playTL.to(els.divLineR, {
            width: 60,
            duration: 0.5,
            ease: 'power2.out'
        }, '-=0.45');

        // 8. Attribution with glow
        playTL.to(els.attribution, {
            opacity: 1,
            y: 0,
            duration: 0.5,
            ease: 'power2.out'
        }, '-=0.3');

        // 9. Source
        playTL.to(els.source, {
            opacity: 1,
            y: 0,
            duration: 0.4,
            ease: 'power2.out'
        }, '-=0.25');
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetToHidden();
            }
        });

        // 1. Source + attribution fade
        stopTL.to(els.source, { opacity: 0, y: 10, duration: 0.25, ease: 'power2.in' });
        stopTL.to(els.attribution, { opacity: 0, y: 14, duration: 0.25, ease: 'power2.in' }, '-=0.2');

        // 2. Divider retracts
        stopTL.to([els.divLineL, els.divLineR], { width: 0, duration: 0.3, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.divDiamond, { transform: 'rotate(45deg) scale(0)', duration: 0.2, ease: 'power2.in' }, '-=0.25');
        stopTL.to(els.divider, { opacity: 0, duration: 0.1 }, '-=0.05');

        // 3. Text blurs away
        var spans = els.quoteText.querySelectorAll('.word, .line-group');
        if (spans.length > 0) {
            stopTL.to(spans, {
                opacity: 0, y: -10, filter: 'blur(4px)',
                duration: 0.4,
                ease: 'power2.in',
                stagger: 0.015
            }, '-=0.2');
        }

        // 4. Quote marks
        stopTL.to(els.quoteMarkOpen, { opacity: 0, y: 30, duration: 0.4, ease: 'power2.in' }, '-=0.3');
        stopTL.to(els.quoteMarkClose, { opacity: 0, y: -30, duration: 0.4, ease: 'power2.in' }, '-=0.35');

        // 5. Ornaments
        stopTL.to([els.ornamentL, els.ornamentR], { height: 0, opacity: 0, duration: 0.3, ease: 'power2.in' }, '-=0.2');

        // 6. Overlay
        stopTL.to([els.vignette, els.bgBreathe], { opacity: 0, duration: 0.4, ease: 'power1.in' }, '-=0.2');
        stopTL.to(els.overlay, { opacity: 0, duration: 0.6, ease: 'power2.in' }, '-=0.3');
    };

    window.update = function(input) {
        var d = (typeof input === 'string') ? JSON.parse(input) : input;
        if (!d) return;

        var needsRebuild = false;

        if (d.quote != null && d.quote !== data.quote) {
            data.quote = d.quote;
            needsRebuild = true;
        }
        if (d.attribution != null)    { data.attribution = d.attribution; els.attribution.textContent = d.attribution; }
        if (d.source != null)         { data.source = d.source; els.source.textContent = d.source; }
        if (d.accentColor != null)    { applyAccent(d.accentColor); applyBreathe(); }
        if (d.fontSize != null)       { data.fontSize = d.fontSize; applyFontSize(d.fontSize); }
        if (d.overlayOpacity != null) { data.overlayOpacity = d.overlayOpacity; applyGradient(); }
        if (d.textAlign != null)      { data.textAlign = d.textAlign; els.quoteText.style.textAlign = d.textAlign; }
        if (d.showQuoteMarks != null) {
            data.showQuoteMarks = d.showQuoteMarks;
            els.quoteMarkOpen.style.display = d.showQuoteMarks ? 'block' : 'none';
            els.quoteMarkClose.style.display = d.showQuoteMarks ? 'block' : 'none';
        }
        if (d.animationStyle != null) { data.animationStyle = d.animationStyle; needsRebuild = true; }
        if (d.gradientAngle != null)  { data.gradientAngle = d.gradientAngle; applyGradient(); }

        if (needsRebuild && isVisible) {
            var tl = gsap.timeline();

            var oldSpans = els.quoteText.querySelectorAll('.word, .line-group');
            if (oldSpans.length) {
                tl.to(oldSpans, { opacity: 0, y: -8, filter: 'blur(3px)', duration: 0.3, ease: 'power2.in', stagger: 0.01 });
            }

            tl.call(function() {
                els.quoteText.innerHTML = buildQuoteHTML(data.quote, data.animationStyle);
                var newSpans = els.quoteText.querySelectorAll('.word, .line-group');
                gsap.set(newSpans, { opacity: 0, y: 18, scale: 0.96, filter: 'blur(4px)' });
            });

            tl.call(function() {
                var newSpans = els.quoteText.querySelectorAll('.word, .line-group');
                var stagger = data.animationStyle === 'line' ? 0.25 :
                              data.animationStyle === 'fade' ? 0 : 0.05;
                gsap.to(newSpans, {
                    opacity: 1, y: 0, scale: 1, filter: 'blur(0px)',
                    duration: 0.35,
                    ease: 'power2.out',
                    stagger: stagger
                });
            }, null, null, '+=0.05');
        } else if (needsRebuild) {
            els.quoteText.innerHTML = buildQuoteHTML(data.quote, data.animationStyle);
        }
    };

    window.next = function() {};

})();
</script>
</body>
</html>
