<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>News Ticker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

#ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: stretch;
    transform: translateY(100%);
    border-top: 2px solid rgba(255, 255, 255, 0.3);
    will-change: transform;
}

#label-badge {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    background: rgba(0, 0, 0, 0.25);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    z-index: 2;
    position: relative;
}

/* Subtle right edge on the label */
#label-badge::after {
    content: '';
    position: absolute;
    right: 0;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: rgba(255, 255, 255, 0.25);
}

#scroll-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    /* Gradient fade masks on left and right edges */
    -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 4%,
        black 96%,
        transparent 100%
    );
    mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 4%,
        black 96%,
        transparent 100%
    );
}

#scroll-track {
    display: flex;
    align-items: center;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    will-change: transform;
}

.scroll-text {
    color: #ffffff;
    font-size: 22px;
    font-weight: 400;
    line-height: 48px;
    white-space: nowrap;
    padding: 0;
}

/* Bullet separator styling */
.scroll-separator {
    color: rgba(255, 255, 255, 0.6);
    font-size: 22px;
    line-height: 48px;
    padding: 0 16px;
    white-space: nowrap;
}
</style>
</head>
<body>

<div id="ticker-bar">
    <div id="label-badge">BREAKING</div>
    <div id="scroll-area">
        <div id="scroll-track"></div>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    var DEFAULT_HEADLINES = [
        'SwitchFrame HTML5 Graphics Engine \u2014 Real-time broadcast overlays powered by Chromium',
        'Open-source broadcast switcher with HTML5, OGraf, and CasparCG template support',
        'GSAP-powered animations for broadcast-quality motion graphics'
    ];

    var state = {
        headlines: DEFAULT_HEADLINES.slice(),
        label: 'BREAKING',
        speed: 80,         // pixels per second
        bgColor: '#b41414',
        isPlaying: false,
        scrollTween: null,
        headlineIndex: 0
    };

    // ---------------------------------------------------------------
    // DOM References
    // ---------------------------------------------------------------
    var tickerBar   = document.getElementById('ticker-bar');
    var labelBadge  = document.getElementById('label-badge');
    var scrollArea  = document.getElementById('scroll-area');
    var scrollTrack = document.getElementById('scroll-track');

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    function applyBarColor(color) {
        tickerBar.style.background = color;
    }

    /**
     * Build a single continuous text run from headlines, separated by
     * bullets. We duplicate the run so the second copy can seamlessly
     * take over as the first scrolls off-screen.
     */
    function buildScrollContent(headlines) {
        scrollTrack.innerHTML = '';

        // Build one full run of all headlines with separators.
        var runHTML = '';
        for (var i = 0; i < headlines.length; i++) {
            if (i > 0) {
                runHTML += '<span class="scroll-separator">\u25cf</span>';
            }
            runHTML += '<span class="scroll-text" data-headline-index="' + i + '">' +
                       escapeHTML(headlines[i]) + '</span>';
        }
        // Trailing separator before the duplicate
        runHTML += '<span class="scroll-separator">\u25cf</span>';

        // Two copies for seamless looping
        var runA = document.createElement('span');
        runA.className = 'scroll-run';
        runA.innerHTML = runHTML;
        scrollTrack.appendChild(runA);

        var runB = document.createElement('span');
        runB.className = 'scroll-run';
        runB.innerHTML = runHTML;
        scrollTrack.appendChild(runB);
    }

    function escapeHTML(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    /**
     * Measure the width of a single "run" (all headlines + separators).
     */
    function measureRunWidth() {
        var runs = scrollTrack.querySelectorAll('.scroll-run');
        if (runs.length === 0) return 0;
        return runs[0].offsetWidth;
    }

    // ---------------------------------------------------------------
    // Scroll Engine
    // ---------------------------------------------------------------
    function startScroll() {
        stopScroll();

        var runWidth = measureRunWidth();
        if (runWidth === 0) return;

        var areaWidth = scrollArea.offsetWidth;

        // Start with the track at the right edge of the scroll area
        // so text enters from the right on the very first play.
        gsap.set(scrollTrack, { x: areaWidth });

        // Total distance: from areaWidth to -runWidth (one full run scrolls past).
        var totalDistance = areaWidth + runWidth;
        var duration = totalDistance / state.speed;

        function loopScroll() {
            // Reset to 0 for looping (first copy starts at left edge of area).
            gsap.set(scrollTrack, { x: 0 });

            var loopDistance = runWidth;
            var loopDuration = loopDistance / state.speed;

            state.scrollTween = gsap.to(scrollTrack, {
                x: -runWidth,
                duration: loopDuration,
                ease: 'none',
                onComplete: loopScroll
            });
        }

        // Initial scroll from off-screen right
        state.scrollTween = gsap.to(scrollTrack, {
            x: -runWidth,
            duration: duration,
            ease: 'none',
            onComplete: loopScroll
        });
    }

    function stopScroll() {
        if (state.scrollTween) {
            state.scrollTween.kill();
            state.scrollTween = null;
        }
    }

    /**
     * Resume scrolling from the current position (after an update).
     */
    function resumeScrollFromCurrent() {
        stopScroll();

        var runWidth = measureRunWidth();
        if (runWidth === 0) return;

        // Get current x position
        var currentX = gsap.getProperty(scrollTrack, 'x');
        if (typeof currentX !== 'number') currentX = 0;

        // Normalize: if we've scrolled past one full run, wrap around
        while (currentX < -runWidth) {
            currentX += runWidth;
        }
        gsap.set(scrollTrack, { x: currentX });

        var remaining = runWidth + currentX; // distance left until -runWidth
        if (remaining <= 0) remaining = runWidth;
        var duration = remaining / state.speed;

        function loopScroll() {
            gsap.set(scrollTrack, { x: 0 });
            var loopDuration = runWidth / state.speed;

            state.scrollTween = gsap.to(scrollTrack, {
                x: -runWidth,
                duration: loopDuration,
                ease: 'none',
                onComplete: loopScroll
            });
        }

        state.scrollTween = gsap.to(scrollTrack, {
            x: -runWidth,
            duration: duration,
            ease: 'none',
            onComplete: loopScroll
        });
    }

    // ---------------------------------------------------------------
    // Find headline element offsets (for next() jumping)
    // ---------------------------------------------------------------
    function getHeadlineOffsets() {
        var offsets = [];
        var spans = scrollTrack.querySelectorAll('.scroll-run:first-child .scroll-text');
        for (var i = 0; i < spans.length; i++) {
            offsets.push(spans[i].offsetLeft);
        }
        return offsets;
    }

    // ---------------------------------------------------------------
    // CasparCG Global API
    // ---------------------------------------------------------------

    /**
     * play() - Animate the ticker bar on-screen and start scrolling.
     */
    window.play = function() {
        if (state.isPlaying) return;
        state.isPlaying = true;

        applyBarColor(state.bgColor);
        labelBadge.textContent = state.label;
        buildScrollContent(state.headlines);

        // Animate bar up from below
        var tl = gsap.timeline();
        tl.to(tickerBar, {
            y: 0,
            duration: 0.4,
            ease: 'power3.out'
        });
        tl.to(labelBadge, {
            opacity: 1,
            duration: 0.2,
            ease: 'power2.out'
        }, '-=0.15');
        tl.add(function() {
            startScroll();
        }, '-=0.05');
    };

    /**
     * stop() - Stop scrolling and animate the bar off-screen.
     */
    window.stop = function() {
        if (!state.isPlaying) return;
        state.isPlaying = false;

        stopScroll();

        var tl = gsap.timeline();
        tl.to(labelBadge, {
            opacity: 0,
            duration: 0.15,
            ease: 'power2.in'
        });
        tl.to(tickerBar, {
            y: '100%',
            duration: 0.3,
            ease: 'power3.in'
        }, '-=0.05');
        tl.add(function() {
            // Reset transform for next play
            gsap.set(tickerBar, { y: '100%' });
            state.headlineIndex = 0;
        });
    };

    /**
     * update(data) - Update headlines, label, speed, or color.
     *
     * Accepts a JSON string or object:
     * {
     *   "headlines": ["Headline 1", "Headline 2"],
     *   "label": "BREAKING",
     *   "speed": 80,
     *   "bgColor": "#b41414"
     * }
     */
    window.update = function(data) {
        if (!data) return;

        var parsed;
        if (typeof data === 'string') {
            try { parsed = JSON.parse(data); }
            catch (e) { return; }
        } else {
            parsed = data;
        }

        if (parsed.headlines && Array.isArray(parsed.headlines) && parsed.headlines.length > 0) {
            state.headlines = parsed.headlines;
        }
        if (parsed.label !== undefined) {
            state.label = String(parsed.label);
        }
        if (parsed.speed !== undefined && parsed.speed > 0) {
            state.speed = Number(parsed.speed);
        }
        if (parsed.bgColor !== undefined) {
            state.bgColor = String(parsed.bgColor);
        }

        // Apply visual changes immediately
        labelBadge.textContent = state.label;
        applyBarColor(state.bgColor);

        if (state.isPlaying) {
            // Rebuild content and resume from current scroll position
            // so the update feels seamless rather than jarring.
            buildScrollContent(state.headlines);
            resumeScrollFromCurrent();
        }
    };

    /**
     * next() - Jump to the start of the next headline.
     */
    window.next = function() {
        if (!state.isPlaying) return;
        if (state.headlines.length <= 1) return;

        state.headlineIndex = (state.headlineIndex + 1) % state.headlines.length;

        var offsets = getHeadlineOffsets();
        if (offsets.length === 0) return;

        var targetOffset = offsets[state.headlineIndex] || 0;
        var runWidth = measureRunWidth();

        // Kill current scroll and animate to the next headline position
        stopScroll();

        gsap.to(scrollTrack, {
            x: -targetOffset,
            duration: 0.3,
            ease: 'power2.out',
            onComplete: function() {
                // Resume continuous scrolling from new position
                var remaining = runWidth - targetOffset;
                if (remaining <= 0) remaining = runWidth;
                var duration = remaining / state.speed;

                function loopScroll() {
                    gsap.set(scrollTrack, { x: 0 });
                    var loopDuration = runWidth / state.speed;
                    state.scrollTween = gsap.to(scrollTrack, {
                        x: -runWidth,
                        duration: loopDuration,
                        ease: 'none',
                        onComplete: loopScroll
                    });
                }

                state.scrollTween = gsap.to(scrollTrack, {
                    x: -runWidth,
                    duration: duration,
                    ease: 'none',
                    onComplete: loopScroll
                });
            }
        });
    };

    // ---------------------------------------------------------------
    // Initialization
    // ---------------------------------------------------------------
    applyBarColor(state.bgColor);
    gsap.set(tickerBar, { y: '100%' });
    gsap.set(labelBadge, { opacity: 0 });

})();
</script>
</body>
</html>
