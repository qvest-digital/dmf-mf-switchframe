<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

#container {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 1400px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* --- Header --- */
#header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(-15px);
}
.header-left {
    display: flex;
    flex-direction: column;
}
#election-title {
    font-size: 56px;
    font-weight: 700;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#election-subtitle {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.reporting-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px 24px;
}
.reporting-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
#reporting-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.reporting-label {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Main panel --- */
#panel {
    background: rgba(10, 12, 20, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 1px rgba(255,255,255,0.1);
    opacity: 0;
    transform: translateY(20px) scaleY(0.95);
    transform-origin: bottom center;
    position: relative;
}

/* Top accent line */
#panel-accent {
    height: 3px;
    background: linear-gradient(90deg,
        var(--c1-color, #3b82f6) 0%,
        var(--c1-color, #3b82f6) var(--c1-pct, 50%),
        var(--c2-color, #ef4444) var(--c1-pct, 50%),
        var(--c2-color, #ef4444) var(--c12-pct, 95%),
        var(--c3-color, #a855f7) var(--c12-pct, 95%),
        var(--c3-color, #a855f7) 100%
    );
    transform: scaleX(0);
    transform-origin: left;
}

/* --- Candidate rows --- */
.candidates {
    padding: 24px 36px 28px;
}

.candidate-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 0;
    opacity: 0;
    transform: translateX(-20px);
}
.candidate-row + .candidate-row {
    border-top: 1px solid rgba(255,255,255,0.06);
}

.candidate-color {
    width: 6px;
    height: 56px;
    border-radius: 3px;
    flex-shrink: 0;
    opacity: 0;
    transform: scaleY(0);
    transform-origin: bottom;
}

.candidate-info {
    width: 380px;
    flex-shrink: 0;
}
.candidate-name {
    font-size: 48px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.candidate-party {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* Percentage bar area */
.bar-area {
    flex: 1;
    min-width: 0;
}
.bar-track {
    height: 40px;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
}
.bar-fill {
    height: 100%;
    border-radius: 6px;
    width: 0;
    position: relative;
    transition: none;
}
.bar-fill::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 40px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15));
    border-radius: 0 6px 6px 0;
}

/* Vote count + percentage */
.candidate-numbers {
    width: 200px;
    text-align: right;
    flex-shrink: 0;
}
.candidate-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.candidate-votes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* Leading indicator */
.leading-check {
    width: 36px;
    flex-shrink: 0;
    text-align: center;
    opacity: 0;
}
.check-icon {
    display: inline-block;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    line-height: 36px;
    font-size: 32px;
    color: #ffffff;
    text-align: center;
    font-weight: 700;
}

/* --- Footer --- */
#footer {
    padding: 0 36px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 16px;
    opacity: 0;
}
.total-votes {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.05em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.total-votes span {
    color: rgba(255,255,255,0.9);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
}
.live-badge {
    font-size: 36px;
    font-weight: 700;
    color: #ef4444;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.live-dot {
    width: 10px;
    height: 10px;
    background: #ef4444;
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
}

/* --- Winner overlay (step 2) --- */
#winner-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10, 12, 20, 0.97);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 12px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px;
    z-index: 10;
}
#winner-overlay.active {
    display: flex;
}
#winner-projected {
    font-size: 36px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(10px);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#winner-name {
    font-size: 76px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    opacity: 0;
    transform: scale(0.8);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#winner-party-label {
    font-size: 44px;
    font-weight: 600;
    margin-top: 12px;
    opacity: 0;
    transform: translateY(10px);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#winner-pct-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(10px);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#winner-check-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #ffffff;
    margin-bottom: 20px;
    opacity: 0;
    transform: scale(0.5);
}
#winner-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0;
    z-index: -1;
}
</style>
</head>
<body>

<div id="container">
    <!-- Header -->
    <div id="header">
        <div class="header-left">
            <div id="election-title"></div>
            <div id="election-subtitle"></div>
        </div>
        <div class="reporting-badge">
            <div class="reporting-dot"></div>
            <span id="reporting-text">0%</span>
            <span class="reporting-label">Reporting</span>
        </div>
    </div>

    <!-- Panel -->
    <div id="panel">
        <div id="panel-accent"></div>

        <div class="candidates" id="candidates">
            <!-- Candidate 1 -->
            <div class="candidate-row" id="row-1">
                <div class="candidate-color" id="color-1"></div>
                <div class="candidate-info">
                    <div class="candidate-name" id="name-1"></div>
                    <div class="candidate-party" id="party-1"></div>
                </div>
                <div class="bar-area">
                    <div class="bar-track">
                        <div class="bar-fill" id="bar-1"></div>
                    </div>
                </div>
                <div class="candidate-numbers">
                    <div class="candidate-pct" id="pct-1">0%</div>
                    <div class="candidate-votes" id="votes-1"></div>
                </div>
                <div class="leading-check" id="check-1">
                    <span class="check-icon" id="check-icon-1"></span>
                </div>
            </div>

            <!-- Candidate 2 -->
            <div class="candidate-row" id="row-2">
                <div class="candidate-color" id="color-2"></div>
                <div class="candidate-info">
                    <div class="candidate-name" id="name-2"></div>
                    <div class="candidate-party" id="party-2"></div>
                </div>
                <div class="bar-area">
                    <div class="bar-track">
                        <div class="bar-fill" id="bar-2"></div>
                    </div>
                </div>
                <div class="candidate-numbers">
                    <div class="candidate-pct" id="pct-2">0%</div>
                    <div class="candidate-votes" id="votes-2"></div>
                </div>
                <div class="leading-check" id="check-2">
                    <span class="check-icon" id="check-icon-2"></span>
                </div>
            </div>

            <!-- Candidate 3 -->
            <div class="candidate-row" id="row-3">
                <div class="candidate-color" id="color-3"></div>
                <div class="candidate-info">
                    <div class="candidate-name" id="name-3"></div>
                    <div class="candidate-party" id="party-3"></div>
                </div>
                <div class="bar-area">
                    <div class="bar-track">
                        <div class="bar-fill" id="bar-3"></div>
                    </div>
                </div>
                <div class="candidate-numbers">
                    <div class="candidate-pct" id="pct-3">0%</div>
                    <div class="candidate-votes" id="votes-3"></div>
                </div>
                <div class="leading-check" id="check-3">
                    <span class="check-icon" id="check-icon-3"></span>
                </div>
            </div>
        </div>

        <div id="footer">
            <div class="total-votes">Total Votes: <span id="total-votes"></span></div>
            <div class="live-badge"><div class="live-dot"></div>LIVE</div>
        </div>

        <!-- Winner overlay -->
        <div id="winner-overlay">
            <div id="winner-glow"></div>
            <div id="winner-check-ring">&#10003;</div>
            <div id="winner-projected">Projected Winner</div>
            <div id="winner-name"></div>
            <div id="winner-party-label"></div>
            <div id="winner-pct-label"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var isVisible = false;
    var currentStep = 0;
    var playTL = null;
    var stopTL = null;

    var data = {
        title: 'Presidential Election 2026',
        subtitle: 'National Results',
        reporting: 67,
        totalVotes: '48,291,037',
        candidate1Name: 'Alexandra Torres', candidate1Party: 'Democratic',
        candidate1Votes: '24,892,411', candidate1Pct: 51.5, candidate1Color: '#3b82f6',
        candidate2Name: 'Robert Chen', candidate2Party: 'Republican',
        candidate2Votes: '22,104,218', candidate2Pct: 45.8, candidate2Color: '#ef4444',
        candidate3Name: 'Jordan Mills', candidate3Party: 'Independent',
        candidate3Votes: '1,294,408', candidate3Pct: 2.7, candidate3Color: '#a855f7',
        calledFor: ''
    };

    // Cache element references
    var e = {};
    var ids = [
        'container','header','election-title','election-subtitle','reporting-text',
        'panel','panel-accent','candidates',
        'row-1','color-1','name-1','party-1','bar-1','pct-1','votes-1','check-1','check-icon-1',
        'row-2','color-2','name-2','party-2','bar-2','pct-2','votes-2','check-2','check-icon-2',
        'row-3','color-3','name-3','party-3','bar-3','pct-3','votes-3','check-3','check-icon-3',
        'footer','total-votes',
        'winner-overlay','winner-glow','winner-check-ring','winner-projected',
        'winner-name','winner-party-label','winner-pct-label'
    ];
    ids.forEach(function(id) {
        e[id] = document.getElementById(id);
    });

    gsap.defaults({ overwrite: 'auto' });

    function getCandidates() {
        var d = data;
        var candidates = [
            { name: d.candidate1Name, party: d.candidate1Party, votes: d.candidate1Votes, pct: d.candidate1Pct, color: d.candidate1Color },
            { name: d.candidate2Name, party: d.candidate2Party, votes: d.candidate2Votes, pct: d.candidate2Pct, color: d.candidate2Color }
        ];
        if (d.candidate3Name) {
            candidates.push({ name: d.candidate3Name, party: d.candidate3Party, votes: d.candidate3Votes, pct: d.candidate3Pct, color: d.candidate3Color });
        }
        return candidates;
    }

    function populateData() {
        var d = data;
        e['election-title'].textContent = d.title;
        e['election-subtitle'].textContent = d.subtitle || '';
        e['total-votes'].textContent = d.totalVotes;

        var cands = getCandidates();
        var maxPct = Math.max.apply(null, cands.map(function(c) { return c.pct; }));

        // Set CSS variables for accent bar
        var c = e['container'];
        c.style.setProperty('--c1-color', cands[0].color);
        c.style.setProperty('--c2-color', cands[1].color);
        c.style.setProperty('--c3-color', cands[2] ? cands[2].color : cands[1].color);
        c.style.setProperty('--c1-pct', cands[0].pct + '%');
        c.style.setProperty('--c12-pct', (cands[0].pct + cands[1].pct) + '%');

        cands.forEach(function(cand, i) {
            var idx = i + 1;
            e['name-' + idx].textContent = cand.name;
            e['party-' + idx].textContent = cand.party;
            e['votes-' + idx].textContent = cand.votes;
            e['color-' + idx].style.background = cand.color;
            e['bar-' + idx].style.background = 'linear-gradient(90deg, ' + cand.color + ', ' + cand.color + 'dd)';

            var isLeading = cand.pct === maxPct;
            if (isLeading) {
                e['check-icon-' + idx].textContent = '\u25B2';
                e['check-icon-' + idx].style.background = cand.color;
            } else {
                e['check-icon-' + idx].textContent = '';
                e['check-icon-' + idx].style.background = 'transparent';
            }
        });

        // Hide candidate 3 if not present
        if (!d.candidate3Name) {
            e['row-3'].style.display = 'none';
        } else {
            e['row-3'].style.display = '';
        }
    }

    function resetToHidden() {
        gsap.set(e['header'], { opacity: 0, y: -15 });
        gsap.set(e['panel'], { opacity: 0, y: 20, scaleY: 0.95 });
        gsap.set(e['panel-accent'], { scaleX: 0 });
        gsap.set(e['footer'], { opacity: 0 });
        e['reporting-text'].textContent = '0%';

        for (var i = 1; i <= 3; i++) {
            gsap.set(e['row-' + i], { opacity: 0, x: -20 });
            gsap.set(e['color-' + i], { opacity: 0, scaleY: 0 });
            gsap.set(e['bar-' + i], { width: 0 });
            gsap.set(e['check-' + i], { opacity: 0 });
            e['pct-' + i].textContent = '0%';
        }

        e['winner-overlay'].classList.remove('active');
        gsap.set(e['winner-check-ring'], { opacity: 0, scale: 0.5 });
        gsap.set(e['winner-projected'], { opacity: 0, y: 10 });
        gsap.set(e['winner-name'], { opacity: 0, scale: 0.8 });
        gsap.set(e['winner-party-label'], { opacity: 0, y: 10 });
        gsap.set(e['winner-pct-label'], { opacity: 0, y: 10 });
        gsap.set(e['winner-glow'], { opacity: 0 });
    }

    // Initialize
    populateData();
    resetToHidden();

    // --- CasparCG interface ---

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;
        currentStep = 0;
        var cands = getCandidates();

        playTL = gsap.timeline({
            onComplete: function() { playTL = null; }
        });

        // Header slides down
        playTL.to(e['header'], { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0);

        // Panel scales up
        playTL.to(e['panel'], { opacity: 1, y: 0, scaleY: 1, duration: 0.4, ease: 'power3.out' }, 0.1);

        // Accent bar wipes
        playTL.to(e['panel-accent'], { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 0.2);

        // Reporting count-up
        var reportProxy = { v: 0 };
        playTL.to(reportProxy, {
            v: data.reporting, duration: 0.8, ease: 'power1.out',
            onUpdate: function() {
                e['reporting-text'].textContent = Math.round(reportProxy.v) + '%';
            }
        }, 0.3);

        // Candidate rows stagger in
        cands.forEach(function(cand, i) {
            var idx = i + 1;
            var delay = 0.3 + i * 0.12;

            playTL.to(e['row-' + idx], { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, delay);
            playTL.to(e['color-' + idx], { opacity: 1, scaleY: 1, duration: 0.3, ease: 'power2.out' }, delay + 0.05);
            playTL.to(e['bar-' + idx], { width: cand.pct + '%', duration: 0.7, ease: 'power2.out' }, delay + 0.15);

            var pctProxy = { v: 0 };
            playTL.to(pctProxy, {
                v: cand.pct, duration: 0.7, ease: 'power1.out',
                onUpdate: function() {
                    e['pct-' + idx].textContent = pctProxy.v.toFixed(1) + '%';
                }
            }, delay + 0.15);

            var maxPct = Math.max.apply(null, cands.map(function(c) { return c.pct; }));
            if (cand.pct === maxPct) {
                playTL.to(e['check-' + idx], { opacity: 1, duration: 0.2 }, delay + 0.5);
            }
        });

        // Footer
        playTL.to(e['footer'], { opacity: 1, duration: 0.3 }, 0.7);
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetToHidden();
            }
        });

        // Footer
        stopTL.to(e['footer'], { opacity: 0, duration: 0.15 }, 0);

        // Winner overlay if visible
        if (currentStep === 1) {
            stopTL.to([
                e['winner-pct-label'], e['winner-party-label'],
                e['winner-name'], e['winner-projected'], e['winner-check-ring'], e['winner-glow']
            ], { opacity: 0, duration: 0.2 }, 0);
        }

        // Bars retract
        for (var i = 3; i >= 1; i--) {
            stopTL.to(e['bar-' + i], { width: 0, duration: 0.25, ease: 'power2.in' }, 0.05);
            stopTL.to(e['check-' + i], { opacity: 0, duration: 0.1 }, 0);
            stopTL.to(e['row-' + i], { opacity: 0, x: -15, duration: 0.2, ease: 'power2.in' }, 0.1 + (3 - i) * 0.04);
            stopTL.to(e['color-' + i], { scaleY: 0, opacity: 0, duration: 0.15 }, 0.1);
        }

        // Panel
        stopTL.to(e['panel-accent'], { scaleX: 0, duration: 0.2 }, 0.2);
        stopTL.to(e['panel'], { opacity: 0, y: 15, scaleY: 0.97, duration: 0.3, ease: 'power2.in' }, 0.25);

        // Header
        stopTL.to(e['header'], { opacity: 0, y: -10, duration: 0.2, ease: 'power2.in' }, 0.25);
    };

    window.update = function(dataStr) {
        var incoming = (typeof dataStr === 'string') ? JSON.parse(dataStr) : dataStr;
        if (!incoming) return;

        var changed = false;
        for (var key in incoming) {
            if (incoming[key] != null && incoming[key] !== data[key]) {
                data[key] = incoming[key];
                changed = true;
            }
        }
        if (!changed) return;

        populateData();

        if (isVisible && currentStep === 0) {
            var cands = getCandidates();
            var tl = gsap.timeline();

            // Animate reporting
            var reportProxy = { v: parseFloat(e['reporting-text'].textContent) || 0 };
            tl.to(reportProxy, {
                v: data.reporting, duration: 0.5, ease: 'power1.out',
                onUpdate: function() {
                    e['reporting-text'].textContent = Math.round(reportProxy.v) + '%';
                }
            }, 0);

            // Animate bars and percentages
            cands.forEach(function(cand, i) {
                var idx = i + 1;
                tl.to(e['bar-' + idx], { width: cand.pct + '%', duration: 0.5, ease: 'power2.out' }, 0);

                var curPct = parseFloat(e['pct-' + idx].textContent) || 0;
                var pctProxy = { v: curPct };
                tl.to(pctProxy, {
                    v: cand.pct, duration: 0.5, ease: 'power1.out',
                    onUpdate: function() {
                        e['pct-' + idx].textContent = pctProxy.v.toFixed(1) + '%';
                    }
                }, 0);
            });

            // Flash panel border
            tl.to(e['panel'], {
                boxShadow: '0 8px 40px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.08)',
                duration: 0.15
            }, 0);
            tl.to(e['panel'], {
                boxShadow: '0 8px 40px rgba(0,0,0,0.6), 0 0 1px rgba(255,255,255,0.1)',
                duration: 0.4
            }, 0.15);
        }
    };

    window.next = function() {
        if (!isVisible) return;

        if (currentStep === 0) {
            // Switch to winner / called view
            currentStep = 1;
            var cands = getCandidates();
            var calledName = data.calledFor;
            var winner = null;
            for (var ci = 0; ci < cands.length; ci++) {
                if (cands[ci].name === calledName) { winner = cands[ci]; break; }
            }
            if (!winner) {
                winner = cands.reduce(function(a, b) { return a.pct > b.pct ? a : b; });
            }

            e['winner-name'].textContent = winner.name;
            e['winner-party-label'].textContent = winner.party;
            e['winner-party-label'].style.color = winner.color;
            e['winner-pct-label'].textContent = winner.pct.toFixed(1) + '%';
            e['winner-check-ring'].style.background = winner.color;
            e['winner-glow'].style.background = winner.color;
            e['winner-projected'].textContent = calledName ? 'Projected Winner' : 'Currently Leading';

            var tl = gsap.timeline();
            e['winner-overlay'].classList.add('active');

            tl.to(e['winner-glow'], { opacity: 0.2, duration: 0.5, ease: 'power1.out' }, 0);
            tl.to(e['winner-check-ring'], { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.4)' }, 0.1);
            tl.to(e['winner-projected'], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.2);
            tl.to(e['winner-name'], { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, 0.25);
            tl.to(e['winner-party-label'], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.35);
            tl.to(e['winner-pct-label'], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.4);
        } else {
            // Back to bar view
            currentStep = 0;
            var tl = gsap.timeline();

            tl.to([
                e['winner-pct-label'], e['winner-party-label'],
                e['winner-name'], e['winner-projected']
            ], { opacity: 0, y: 10, duration: 0.2 }, 0);
            tl.to(e['winner-check-ring'], { opacity: 0, scale: 0.5, duration: 0.2 }, 0);
            tl.to(e['winner-glow'], { opacity: 0, duration: 0.2 }, 0);

            tl.call(function() {
                e['winner-overlay'].classList.remove('active');
                gsap.set(e['winner-check-ring'], { opacity: 0, scale: 0.5 });
                gsap.set(e['winner-projected'], { opacity: 0, y: 10 });
                gsap.set(e['winner-name'], { opacity: 0, scale: 0.8 });
                gsap.set(e['winner-party-label'], { opacity: 0, y: 10 });
                gsap.set(e['winner-pct-label'], { opacity: 0, y: 10 });
                gsap.set(e['winner-glow'], { opacity: 0 });
            });
        }
    };
})();
</script>
</body>
</html>
