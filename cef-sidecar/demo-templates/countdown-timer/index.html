<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Countdown Timer (OGraf)</title>
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

#container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
}

#bg-overlay {
    position: absolute;
    inset: 0;
    opacity: 0.85;
}

/* Subtle animated grid pattern */
#grid-pattern {
    position: absolute;
    inset: 0;
    opacity: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* Radial glow behind the timer */
#radial-glow {
    position: absolute;
    width: 700px;
    height: 700px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0;
    filter: blur(80px);
}

/* Progress ring SVG */
#ring-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 520px;
    opacity: 0;
}

#ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

#ring-track {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 3;
}

#ring-progress {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 1508;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 8px currentColor);
}

/* Tick marks around the ring */
#ring-ticks {
    position: absolute;
    inset: 0;
}

.tick {
    position: absolute;
    width: 2px;
    height: 12px;
    top: 0;
    left: 50%;
    transform-origin: 0 260px;
    background: rgba(255,255,255,0.15);
    border-radius: 1px;
}

.tick.major {
    height: 20px;
    background: rgba(255,255,255,0.35);
    width: 2px;
}

/* Timer digits */
#timer-display {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transform: scale(0.8);
}

.digit-group {
    display: flex;
    align-items: center;
    gap: 2px;
}

.digit {
    position: relative;
    width: 110px;
    height: 150px;
    overflow: hidden;
}

.digit-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 140px;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255,255,255,0.2);
    letter-spacing: -2px;
}

.digit-bg {
    position: absolute;
    inset: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
}

.colon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 120px;
    color: rgba(255,255,255,0.5);
    margin: 0 6px;
    line-height: 1;
    transform: translateY(-8px);
}

/* Font style: mono */
.font-mono .digit-inner {
    font-family: 'JetBrains Mono', monospace;
    font-size: 110px;
    font-weight: 700;
}
.font-mono .colon {
    font-family: 'JetBrains Mono', monospace;
    font-size: 90px;
    font-weight: 700;
}

/* Title + subtitle */
#title-area {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 60px;
    opacity: 0;
    transform: translateY(30px);
}

#title {
    font-family: 'Outfit', sans-serif;
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    margin-bottom: 12px;
}

#subtitle {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* Decorative line under title */
#title-line {
    width: 0;
    height: 2px;
    margin: 20px auto 0;
    border-radius: 1px;
    opacity: 0;
}

/* Particle dots */
.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    opacity: 0;
}

/* Flash overlay */
#flash-overlay {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
}

/* Completed state */
#completed-title {
    position: relative;
    z-index: 2;
    font-family: 'Outfit', sans-serif;
    font-size: 90px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 12px;
    text-transform: uppercase;
    text-shadow: 0 0 60px rgba(0,212,255,0.4);
    opacity: 0;
    transform: scale(0.5);
    display: none;
}

#completed-subtitle {
    position: relative;
    z-index: 2;
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
    letter-spacing: 4px;
    opacity: 0;
    transform: translateY(20px);
    display: none;
}
</style>
</head>
<body>

<div id="container">
    <div id="bg-overlay"></div>
    <div id="grid-pattern"></div>
    <div id="radial-glow"></div>

    <div id="title-area">
        <div id="title">STARTING SOON</div>
        <div id="subtitle">Please stand by</div>
        <div id="title-line"></div>
    </div>

    <div id="ring-wrap">
        <svg id="ring-svg" viewBox="0 0 520 520">
            <circle id="ring-track" cx="260" cy="260" r="240"/>
            <circle id="ring-progress" cx="260" cy="260" r="240"/>
        </svg>
        <div id="ring-ticks"></div>
    </div>

    <div id="timer-display">
        <div class="digit-group" id="minutes-group">
            <div class="digit"><div class="digit-bg"></div><div class="digit-inner" id="d-m0">0</div></div>
            <div class="digit"><div class="digit-bg"></div><div class="digit-inner" id="d-m1">0</div></div>
        </div>
        <div class="colon" id="colon1">:</div>
        <div class="digit-group" id="seconds-group">
            <div class="digit"><div class="digit-bg"></div><div class="digit-inner" id="d-s0">0</div></div>
            <div class="digit"><div class="digit-bg"></div><div class="digit-inner" id="d-s1">0</div></div>
        </div>
    </div>

    <div id="completed-title">WE'RE LIVE</div>
    <div id="completed-subtitle"></div>
    <div id="flash-overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var CIRCUMFERENCE = 2 * Math.PI * 240; // ~1508

    var els = {
        container:    document.getElementById('container'),
        bgOverlay:    document.getElementById('bg-overlay'),
        gridPattern:  document.getElementById('grid-pattern'),
        radialGlow:   document.getElementById('radial-glow'),
        title:        document.getElementById('title'),
        subtitle:     document.getElementById('subtitle'),
        titleArea:    document.getElementById('title-area'),
        titleLine:    document.getElementById('title-line'),
        ringWrap:     document.getElementById('ring-wrap'),
        ringProgress: document.getElementById('ring-progress'),
        timerDisplay: document.getElementById('timer-display'),
        colon1:       document.getElementById('colon1'),
        flash:        document.getElementById('flash-overlay'),
        completedTitle:    document.getElementById('completed-title'),
        completedSubtitle: document.getElementById('completed-subtitle'),
        dm0: document.getElementById('d-m0'),
        dm1: document.getElementById('d-m1'),
        ds0: document.getElementById('d-s0'),
        ds1: document.getElementById('d-s1'),
        ringTicks:    document.getElementById('ring-ticks')
    };

    var isVisible = false;
    var playTL = null;
    var stopTL = null;
    var countdownInterval = null;
    var colonBlink = null;
    var remainingSeconds = 300;
    var totalSeconds = 300;
    var isCompleted = false;

    var config = {
        title: 'STARTING SOON',
        subtitle: 'Please stand by',
        seconds: 300,
        accentColor: '#00d4ff',
        bgGradientStart: '#0a0a1a',
        bgGradientEnd: '#1a0a2e',
        completedTitle: "WE'RE LIVE",
        completedSubtitle: '',
        showProgressRing: true,
        fontStyle: 'display'
    };

    gsap.defaults({ overwrite: 'auto' });

    // Generate tick marks around the ring
    function buildTicks() {
        els.ringTicks.innerHTML = '';
        for (var i = 0; i < 60; i++) {
            var tick = document.createElement('div');
            tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
            tick.style.transform = 'rotate(' + (i * 6) + 'deg)';
            els.ringTicks.appendChild(tick);
        }
    }

    // Generate floating particles
    function buildParticles() {
        for (var i = 0; i < 20; i++) {
            var p = document.createElement('div');
            p.className = 'particle';
            p.style.left = (Math.random() * 100) + '%';
            p.style.top = (Math.random() * 100) + '%';
            els.container.appendChild(p);

            gsap.to(p, {
                y: -200 - Math.random() * 300,
                x: (Math.random() - 0.5) * 200,
                opacity: 0.3,
                duration: 8 + Math.random() * 12,
                repeat: -1,
                ease: 'none',
                delay: Math.random() * 10
            });
        }
    }

    function applyConfig() {
        els.title.textContent = config.title;
        els.subtitle.textContent = config.subtitle;
        els.bgOverlay.style.background = 'linear-gradient(135deg, ' + config.bgGradientStart + ', ' + config.bgGradientEnd + ')';
        els.radialGlow.style.background = 'radial-gradient(circle, ' + config.accentColor + '22, transparent 70%)';
        els.ringProgress.style.stroke = config.accentColor;
        els.titleLine.style.background = config.accentColor;
        els.completedTitle.textContent = config.completedTitle;
        els.completedSubtitle.textContent = config.completedSubtitle;

        if (config.fontStyle === 'mono') {
            els.timerDisplay.classList.add('font-mono');
        } else {
            els.timerDisplay.classList.remove('font-mono');
        }

        totalSeconds = config.seconds;
        remainingSeconds = config.seconds;
    }

    function updateDigits(secs) {
        var m = Math.floor(secs / 60);
        var s = secs % 60;
        var m0 = Math.floor(m / 10);
        var m1 = m % 10;
        var s0 = Math.floor(s / 10);
        var s1 = s % 10;

        animateDigit(els.dm0, m0);
        animateDigit(els.dm1, m1);
        animateDigit(els.ds0, s0);
        animateDigit(els.ds1, s1);
    }

    function animateDigit(el, newVal) {
        var newStr = String(newVal);
        if (el.textContent === newStr) return;

        // Morph transition: slide old out, new in
        gsap.to(el, {
            y: -20,
            opacity: 0,
            duration: 0.15,
            ease: 'power2.in',
            onComplete: function() {
                el.textContent = newStr;
                gsap.fromTo(el,
                    { y: 20, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.2, ease: 'power2.out' }
                );
            }
        });
    }

    function updateProgressRing(secs) {
        if (!config.showProgressRing) return;
        var progress = 1 - (secs / totalSeconds);
        var offset = CIRCUMFERENCE * (1 - progress);
        gsap.to(els.ringProgress, {
            strokeDashoffset: offset,
            duration: 0.5,
            ease: 'power1.out'
        });
    }

    function startCountdown() {
        stopCountdown();
        isCompleted = false;
        updateDigits(remainingSeconds);
        updateProgressRing(remainingSeconds);

        // Colon blink
        colonBlink = gsap.to(els.colon1, {
            opacity: 0.2,
            duration: 0.5,
            repeat: -1,
            yoyo: true,
            ease: 'power1.inOut'
        });

        countdownInterval = setInterval(function() {
            remainingSeconds--;
            if (remainingSeconds < 0) remainingSeconds = 0;

            updateDigits(remainingSeconds);
            updateProgressRing(remainingSeconds);

            // Urgency: last 10 seconds — pulse the digits red
            if (remainingSeconds <= 10 && remainingSeconds > 0) {
                gsap.to(els.timerDisplay, {
                    color: '#ff4444',
                    textShadow: '0 0 40px rgba(255,68,68,0.5)',
                    duration: 0.15,
                    yoyo: true,
                    repeat: 1
                });
                gsap.to(els.radialGlow, {
                    opacity: 0.6 + (10 - remainingSeconds) * 0.04,
                    duration: 0.3
                });
            }

            if (remainingSeconds <= 0) {
                stopCountdown();
                triggerComplete();
            }
        }, 1000);
    }

    function stopCountdown() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        if (colonBlink) {
            colonBlink.kill();
            colonBlink = null;
        }
    }

    function triggerComplete() {
        isCompleted = true;

        var tl = gsap.timeline();

        // Flash
        tl.to(els.flash, { opacity: 0.8, duration: 0.08 });
        tl.to(els.flash, { opacity: 0, duration: 0.6, ease: 'power2.out' });

        // Hide timer
        tl.to(els.timerDisplay, { opacity: 0, scale: 1.2, duration: 0.3, ease: 'power2.in' }, 0.05);
        tl.to(els.ringWrap, { opacity: 0, scale: 1.1, duration: 0.4, ease: 'power2.in' }, 0.05);
        tl.to(els.titleArea, { opacity: 0, y: -30, duration: 0.3, ease: 'power2.in' }, 0);

        // Show completed state
        tl.set(els.completedTitle, { display: 'block' }, 0.4);
        tl.to(els.completedTitle, {
            opacity: 1, scale: 1,
            duration: 0.6,
            ease: 'back.out(1.4)'
        }, 0.4);

        if (config.completedSubtitle) {
            tl.set(els.completedSubtitle, { display: 'block' }, 0.6);
            tl.to(els.completedSubtitle, {
                opacity: 1, y: 0,
                duration: 0.4,
                ease: 'power2.out'
            }, 0.6);
        }

        // Pulse glow
        tl.to(els.radialGlow, {
            opacity: 0.8,
            scale: 1.3,
            duration: 0.5,
            ease: 'power2.out'
        }, 0.3);
        tl.to(els.radialGlow, {
            opacity: 0.3,
            scale: 1,
            duration: 1.5,
            ease: 'power1.inOut'
        });
    }

    function resetState() {
        stopCountdown();
        isCompleted = false;
        gsap.set(els.container, { opacity: 0 });
        gsap.set(els.bgOverlay, { opacity: 0.85 });
        gsap.set(els.gridPattern, { opacity: 0 });
        gsap.set(els.radialGlow, { opacity: 0, scale: 1 });
        gsap.set(els.titleArea, { opacity: 0, y: 30 });
        gsap.set(els.titleLine, { width: 0, opacity: 0 });
        gsap.set(els.ringWrap, { opacity: 0, scale: 0.8, rotation: 0 });
        gsap.set(els.timerDisplay, { opacity: 0, scale: 0.8, color: '#ffffff', textShadow: '0 0 40px rgba(255,255,255,0.2)' });
        gsap.set(els.colon1, { opacity: 0.5 });
        gsap.set(els.flash, { opacity: 0 });
        gsap.set(els.completedTitle, { opacity: 0, scale: 0.5, display: 'none' });
        gsap.set(els.completedSubtitle, { opacity: 0, y: 20, display: 'none' });

        els.ringProgress.style.strokeDasharray = CIRCUMFERENCE;
        els.ringProgress.style.strokeDashoffset = '0';
    }

    buildTicks();
    buildParticles();
    applyConfig();
    resetState();

    // ── CasparCG lifecycle ──

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyConfig();
        remainingSeconds = config.seconds;
        totalSeconds = config.seconds;

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Container fades in
        playTL.to(els.container, { opacity: 1, duration: 0.4, ease: 'power2.out' });

        // 2. Grid pattern fades in
        playTL.to(els.gridPattern, { opacity: 1, duration: 0.8, ease: 'power1.out' }, '-=0.2');

        // 3. Radial glow blooms
        playTL.to(els.radialGlow, { opacity: 0.4, duration: 0.8, ease: 'power2.out' }, '-=0.6');

        // 4. Title area slides up
        playTL.to(els.titleArea, {
            opacity: 1, y: 0,
            duration: 0.5,
            ease: 'power3.out'
        }, '-=0.5');

        // 5. Title underline draws
        playTL.to(els.titleLine, {
            width: 120, opacity: 0.6,
            duration: 0.4,
            ease: 'power2.out'
        }, '-=0.2');

        // 6. Ring appears with rotation
        if (config.showProgressRing) {
            playTL.to(els.ringWrap, {
                opacity: 1, scale: 1, rotation: 0,
                duration: 0.6,
                ease: 'back.out(1.2)'
            }, '-=0.3');
        }

        // 7. Timer digits scale in
        playTL.to(els.timerDisplay, {
            opacity: 1, scale: 1,
            duration: 0.5,
            ease: 'back.out(1.5)'
        }, '-=0.3');

        // 8. Start the countdown
        playTL.call(function() {
            startCountdown();
        });
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }
        stopCountdown();

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetState();
            }
        });

        // Completed title out (if showing)
        stopTL.to(els.completedTitle, { opacity: 0, scale: 0.8, duration: 0.3, ease: 'power2.in' });
        stopTL.to(els.completedSubtitle, { opacity: 0, y: 20, duration: 0.2, ease: 'power2.in' }, '-=0.2');

        // Timer + ring out
        stopTL.to(els.timerDisplay, { opacity: 0, scale: 0.8, duration: 0.3, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.ringWrap, { opacity: 0, scale: 0.8, duration: 0.35, ease: 'power2.in' }, '-=0.2');

        // Title out
        stopTL.to(els.titleArea, { opacity: 0, y: -30, duration: 0.3, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.titleLine, { width: 0, opacity: 0, duration: 0.2, ease: 'power2.in' }, '-=0.2');

        // Glow + grid + container out
        stopTL.to(els.radialGlow, { opacity: 0, duration: 0.4, ease: 'power2.in' }, '-=0.3');
        stopTL.to(els.gridPattern, { opacity: 0, duration: 0.3 }, '-=0.3');
        stopTL.to(els.container, { opacity: 0, duration: 0.3, ease: 'power2.in' }, '-=0.1');
    };

    window.update = function(data) {
        var d = (typeof data === 'string') ? JSON.parse(data) : data;
        if (!d) return;

        var needsRestart = false;

        if (d.title != null) {
            config.title = d.title;
            if (isVisible && !isCompleted) {
                gsap.to(els.title, {
                    opacity: 0, y: -10, duration: 0.15,
                    onComplete: function() {
                        els.title.textContent = config.title;
                        gsap.to(els.title, { opacity: 1, y: 0, duration: 0.2 });
                    }
                });
            }
        }

        if (d.subtitle != null) {
            config.subtitle = d.subtitle;
            if (isVisible && !isCompleted) {
                gsap.to(els.subtitle, {
                    opacity: 0, duration: 0.15,
                    onComplete: function() {
                        els.subtitle.textContent = config.subtitle;
                        gsap.to(els.subtitle, { opacity: 1, duration: 0.2 });
                    }
                });
            }
        }

        if (d.seconds != null) {
            config.seconds = d.seconds;
            remainingSeconds = d.seconds;
            totalSeconds = d.seconds;
            if (isVisible && !isCompleted) {
                updateDigits(remainingSeconds);
                updateProgressRing(remainingSeconds);
            }
        }

        if (d.accentColor != null) {
            config.accentColor = d.accentColor;
            gsap.to(els.ringProgress, { stroke: d.accentColor, duration: 0.4 });
            gsap.to(els.titleLine, { background: d.accentColor, duration: 0.4 });
            els.radialGlow.style.background = 'radial-gradient(circle, ' + d.accentColor + '22, transparent 70%)';
        }

        if (d.bgGradientStart != null) config.bgGradientStart = d.bgGradientStart;
        if (d.bgGradientEnd != null) config.bgGradientEnd = d.bgGradientEnd;
        if (d.bgGradientStart != null || d.bgGradientEnd != null) {
            gsap.to(els.bgOverlay, {
                background: 'linear-gradient(135deg, ' + config.bgGradientStart + ', ' + config.bgGradientEnd + ')',
                duration: 0.6
            });
        }

        if (d.completedTitle != null) config.completedTitle = d.completedTitle;
        if (d.completedSubtitle != null) config.completedSubtitle = d.completedSubtitle;
        if (d.showProgressRing != null) config.showProgressRing = d.showProgressRing;
        if (d.fontStyle != null) {
            config.fontStyle = d.fontStyle;
            if (d.fontStyle === 'mono') {
                els.timerDisplay.classList.add('font-mono');
            } else {
                els.timerDisplay.classList.remove('font-mono');
            }
        }
    };

    window.next = function() {
        // If counting down, jump to zero
        if (!isCompleted && isVisible) {
            remainingSeconds = 0;
            stopCountdown();
            updateDigits(0);
            updateProgressRing(0);
            triggerComplete();
        }
    };
})();
</script>
</body>
</html>
