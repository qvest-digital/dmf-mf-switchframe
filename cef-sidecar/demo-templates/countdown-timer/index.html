<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Countdown Timer (OGraf)</title>
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@200;300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

#container {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
}

/* Background layers */
#bg-overlay {
    position: absolute;
    inset: 0;
}

#noise-layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    mix-blend-mode: overlay;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

/* Radial glow behind the timer — the "hero light" */
#radial-glow {
    position: absolute;
    width: 900px;
    height: 900px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0;
    filter: blur(120px);
}

/* Secondary glow for depth */
#secondary-glow {
    position: absolute;
    width: 500px;
    height: 300px;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.02);
    filter: blur(60px);
    opacity: 0;
}

/* Progress ring SVG */
#ring-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 560px;
    height: 560px;
    opacity: 0;
}

#ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

#ring-track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.04);
    stroke-width: 2;
}

#ring-progress {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 1634;
    stroke-dashoffset: 0;
}

#ring-glow {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 1634;
    stroke-dashoffset: 0;
    opacity: 0.3;
    filter: blur(6px);
}

/* Minimal tick marks — only major ones */
#ring-ticks {
    position: absolute;
    inset: 0;
}

.tick {
    position: absolute;
    width: 1px;
    height: 8px;
    top: 6px;
    left: 50%;
    transform-origin: 0 274px;
    background: rgba(255, 255, 255, 0.08);
}

.tick.major {
    height: 14px;
    width: 1.5px;
    background: rgba(255, 255, 255, 0.2);
}

/* Title + subtitle — above the timer */
#title-area {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 80px;
    opacity: 0;
    transform: translateY(20px);
}

#title {
    font-family: 'Sora', sans-serif;
    font-size: 64px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 12px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    margin-bottom: 0;
}

#subtitle {
    font-family: 'Sora', sans-serif;
    font-size: 44px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    margin-top: 16px;
}

/* Accent line under title */
#title-line {
    width: 0;
    height: 1px;
    margin: 24px auto 0;
    opacity: 0;
}

/* Timer digits — the hero */
#timer-display {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 0;
    opacity: 0;
    transform: scale(0.9);
}

.digit-group {
    display: flex;
    align-items: center;
    gap: 0;
}

.digit {
    position: relative;
    width: 120px;
    height: 180px;
    overflow: hidden;
}

.digit-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -3px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

.colon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 100px;
    color: rgba(255, 255, 255, 0.3);
    margin: 0 2px;
    line-height: 1;
    transform: translateY(-10px);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* Font style: mono */
.font-mono .digit-inner {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 120px;
    font-weight: 600;
    letter-spacing: -4px;
}
.font-mono .colon {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 80px;
    font-weight: 400;
}

/* Digit glow — shadow layer behind each digit */
.digit-glow {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 160px;
    line-height: 1;
    letter-spacing: -3px;
    filter: blur(20px);
    opacity: 0.15;
    pointer-events: none;
}

.font-mono .digit-glow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 120px;
    font-weight: 600;
    letter-spacing: -4px;
}

/* Flash overlay */
#flash-overlay {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
}

/* Completed state */
#completed-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
    display: none;
}

#completed-title {
    font-family: 'Sora', sans-serif;
    font-size: 96px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 16px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    opacity: 0;
    transform: scale(0.6);
}

#completed-subtitle {
    font-family: 'Sora', sans-serif;
    font-size: 44px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 6px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    margin-top: 28px;
    opacity: 0;
    transform: translateY(16px);
}

/* Urgency state — last 10 seconds */
#timer-display.urgent .digit-inner {
    transition: color 0.2s;
}
</style>
</head>
<body>

<div id="container">
    <div id="bg-overlay"></div>
    <div id="noise-layer"></div>
    <div id="radial-glow"></div>
    <div id="secondary-glow"></div>

    <div id="title-area">
        <div id="title">STARTING SOON</div>
        <div id="title-line"></div>
        <div id="subtitle">Please stand by</div>
    </div>

    <div id="ring-wrap">
        <svg id="ring-svg" viewBox="0 0 560 560">
            <circle id="ring-track" cx="280" cy="280" r="260"/>
            <circle id="ring-glow" cx="280" cy="280" r="260"/>
            <circle id="ring-progress" cx="280" cy="280" r="260"/>
        </svg>
        <div id="ring-ticks"></div>
    </div>

    <div id="timer-display">
        <div class="digit-group" id="minutes-group">
            <div class="digit">
                <div class="digit-glow" id="g-m0">0</div>
                <div class="digit-inner" id="d-m0">0</div>
            </div>
            <div class="digit">
                <div class="digit-glow" id="g-m1">0</div>
                <div class="digit-inner" id="d-m1">0</div>
            </div>
        </div>
        <div class="colon" id="colon1">:</div>
        <div class="digit-group" id="seconds-group">
            <div class="digit">
                <div class="digit-glow" id="g-s0">0</div>
                <div class="digit-inner" id="d-s0">0</div>
            </div>
            <div class="digit">
                <div class="digit-glow" id="g-s1">0</div>
                <div class="digit-inner" id="d-s1">0</div>
            </div>
        </div>
    </div>

    <div id="completed-wrap">
        <div id="completed-title">WE'RE LIVE</div>
        <div id="completed-subtitle"></div>
    </div>

    <div id="flash-overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var CIRCUMFERENCE = 2 * Math.PI * 260; // ~1634

    var els = {
        container:    document.getElementById('container'),
        bgOverlay:    document.getElementById('bg-overlay'),
        noiseLayer:   document.getElementById('noise-layer'),
        radialGlow:   document.getElementById('radial-glow'),
        secondaryGlow:document.getElementById('secondary-glow'),
        title:        document.getElementById('title'),
        subtitle:     document.getElementById('subtitle'),
        titleArea:    document.getElementById('title-area'),
        titleLine:    document.getElementById('title-line'),
        ringWrap:     document.getElementById('ring-wrap'),
        ringProgress: document.getElementById('ring-progress'),
        ringGlow:     document.getElementById('ring-glow'),
        timerDisplay: document.getElementById('timer-display'),
        colon1:       document.getElementById('colon1'),
        flash:        document.getElementById('flash-overlay'),
        completedWrap:     document.getElementById('completed-wrap'),
        completedTitle:    document.getElementById('completed-title'),
        completedSubtitle: document.getElementById('completed-subtitle'),
        dm0: document.getElementById('d-m0'),
        dm1: document.getElementById('d-m1'),
        ds0: document.getElementById('d-s0'),
        ds1: document.getElementById('d-s1'),
        gm0: document.getElementById('g-m0'),
        gm1: document.getElementById('g-m1'),
        gs0: document.getElementById('g-s0'),
        gs1: document.getElementById('g-s1'),
        ringTicks: document.getElementById('ring-ticks')
    };

    var isVisible = false;
    var playTL = null;
    var stopTL = null;
    var countdownInterval = null;
    var colonBlink = null;
    var breatheAnim = null;
    var remainingSeconds = 300;
    var totalSeconds = 300;
    var isCompleted = false;

    var config = {
        title: 'STARTING SOON',
        subtitle: 'Please stand by',
        seconds: 300,
        accentColor: '#00d4ff',
        bgGradientStart: '#0a0a1a',
        bgGradientEnd: '#1a0a2e',
        completedTitle: "WE'RE LIVE",
        completedSubtitle: '',
        showProgressRing: true,
        fontStyle: 'display'
    };

    gsap.defaults({ overwrite: 'auto' });

    function buildTicks() {
        els.ringTicks.innerHTML = '';
        for (var i = 0; i < 60; i++) {
            var tick = document.createElement('div');
            tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
            tick.style.transform = 'rotate(' + (i * 6) + 'deg)';
            els.ringTicks.appendChild(tick);
        }
    }

    function applyConfig() {
        els.title.textContent = config.title;
        els.subtitle.textContent = config.subtitle;
        els.bgOverlay.style.background = 'linear-gradient(160deg, ' + config.bgGradientStart + ' 0%, ' + config.bgGradientEnd + ' 100%)';
        els.radialGlow.style.background = 'radial-gradient(circle, ' + config.accentColor + '18, transparent 65%)';
        els.ringProgress.style.stroke = config.accentColor;
        els.ringGlow.style.stroke = config.accentColor;
        els.titleLine.style.background = 'linear-gradient(90deg, transparent, ' + config.accentColor + '66, transparent)';
        els.completedTitle.textContent = config.completedTitle;
        els.completedSubtitle.textContent = config.completedSubtitle;

        // Set digit glow color
        var glows = document.querySelectorAll('.digit-glow');
        for (var i = 0; i < glows.length; i++) {
            glows[i].style.color = config.accentColor;
        }

        if (config.fontStyle === 'mono') {
            els.timerDisplay.classList.add('font-mono');
        } else {
            els.timerDisplay.classList.remove('font-mono');
        }

        totalSeconds = config.seconds;
        remainingSeconds = config.seconds;
    }

    function updateDigits(secs) {
        var m = Math.floor(secs / 60);
        var s = secs % 60;
        var m0 = Math.floor(m / 10);
        var m1 = m % 10;
        var s0 = Math.floor(s / 10);
        var s1 = s % 10;

        animateDigit(els.dm0, els.gm0, m0);
        animateDigit(els.dm1, els.gm1, m1);
        animateDigit(els.ds0, els.gs0, s0);
        animateDigit(els.ds1, els.gs1, s1);
    }

    function animateDigit(el, glowEl, newVal) {
        var newStr = String(newVal);
        if (el.textContent === newStr) return;

        // Flip-down with scale squash
        gsap.to(el, {
            y: -30,
            opacity: 0,
            scaleY: 0.8,
            duration: 0.12,
            ease: 'power3.in',
            onComplete: function() {
                el.textContent = newStr;
                glowEl.textContent = newStr;
                gsap.fromTo(el,
                    { y: 30, opacity: 0, scaleY: 0.8 },
                    { y: 0, opacity: 1, scaleY: 1, duration: 0.22, ease: 'back.out(1.8)' }
                );
            }
        });
    }

    function updateProgressRing(secs) {
        if (!config.showProgressRing) return;
        var progress = 1 - (secs / totalSeconds);
        var offset = CIRCUMFERENCE * (1 - progress);
        gsap.to([els.ringProgress, els.ringGlow], {
            strokeDashoffset: offset,
            duration: 0.6,
            ease: 'power1.out'
        });
    }

    function startCountdown() {
        stopCountdown();
        isCompleted = false;
        updateDigits(remainingSeconds);
        updateProgressRing(remainingSeconds);

        // Colon blink — gentle opacity breathe
        colonBlink = gsap.to(els.colon1, {
            opacity: 0.08,
            duration: 0.6,
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut'
        });

        // Subtle glow breathe
        breatheAnim = gsap.to(els.radialGlow, {
            opacity: 0.35,
            duration: 3,
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut'
        });

        countdownInterval = setInterval(function() {
            remainingSeconds--;
            if (remainingSeconds < 0) remainingSeconds = 0;

            updateDigits(remainingSeconds);
            updateProgressRing(remainingSeconds);

            // Urgency: last 10 seconds
            if (remainingSeconds <= 10 && remainingSeconds > 0) {
                els.timerDisplay.classList.add('urgent');

                // Each second gets a sharp scale pulse
                gsap.fromTo(els.timerDisplay,
                    { scale: 1.03 },
                    { scale: 1, duration: 0.4, ease: 'elastic.out(1, 0.5)' }
                );

                // Ring glow intensifies
                gsap.to(els.ringGlow, {
                    opacity: 0.4 + (10 - remainingSeconds) * 0.06,
                    duration: 0.3
                });

                // Shift accent toward warm white
                if (remainingSeconds <= 5) {
                    gsap.to(els.radialGlow, {
                        opacity: 0.5 + (5 - remainingSeconds) * 0.1,
                        duration: 0.3
                    });
                }
            }

            if (remainingSeconds <= 0) {
                stopCountdown();
                triggerComplete();
            }
        }, 1000);
    }

    function stopCountdown() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        if (colonBlink) { colonBlink.kill(); colonBlink = null; }
        if (breatheAnim) { breatheAnim.kill(); breatheAnim = null; }
    }

    function triggerComplete() {
        isCompleted = true;
        els.timerDisplay.classList.remove('urgent');

        var tl = gsap.timeline();

        // 1. Quick white flash — the signature moment
        tl.to(els.flash, { opacity: 0.9, duration: 0.06 });
        tl.to(els.flash, { opacity: 0, duration: 0.8, ease: 'power3.out' });

        // 2. Hide timer and ring with a scale-up dissolve
        tl.to(els.timerDisplay, { opacity: 0, scale: 1.4, filter: 'blur(8px)', duration: 0.4, ease: 'power2.in' }, 0.04);
        tl.to(els.ringWrap, { opacity: 0, scale: 1.3, duration: 0.5, ease: 'power2.in' }, 0.04);
        tl.to(els.titleArea, { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, 0);

        // 3. Show completed state — elastic pop
        tl.set(els.completedWrap, { display: 'block' }, 0.35);
        tl.to(els.completedTitle, {
            opacity: 1, scale: 1,
            duration: 0.8,
            ease: 'elastic.out(1, 0.6)'
        }, 0.35);

        if (config.completedSubtitle) {
            tl.to(els.completedSubtitle, {
                opacity: 1, y: 0,
                duration: 0.5,
                ease: 'power3.out'
            }, 0.6);
        }

        // 4. Glow blooms then settles
        tl.to(els.radialGlow, {
            opacity: 0.7,
            scale: 1.5,
            duration: 0.4,
            ease: 'power2.out'
        }, 0.3);
        tl.to(els.radialGlow, {
            opacity: 0.25,
            scale: 1,
            duration: 2,
            ease: 'power1.inOut'
        });
    }

    function resetState() {
        stopCountdown();
        isCompleted = false;
        gsap.set(els.container, { opacity: 0 });
        gsap.set(els.noiseLayer, { opacity: 0 });
        gsap.set(els.radialGlow, { opacity: 0, scale: 1 });
        gsap.set(els.secondaryGlow, { opacity: 0 });
        gsap.set(els.titleArea, { opacity: 0, y: 20 });
        gsap.set(els.titleLine, { width: 0, opacity: 0 });
        gsap.set(els.ringWrap, { opacity: 0, scale: 0.85 });
        gsap.set(els.timerDisplay, { opacity: 0, scale: 0.9, filter: 'blur(0px)' });
        gsap.set(els.colon1, { opacity: 0.3 });
        gsap.set(els.flash, { opacity: 0 });
        gsap.set(els.completedWrap, { display: 'none' });
        gsap.set(els.completedTitle, { opacity: 0, scale: 0.6 });
        gsap.set(els.completedSubtitle, { opacity: 0, y: 16 });
        els.timerDisplay.classList.remove('urgent');

        els.ringProgress.style.strokeDasharray = CIRCUMFERENCE;
        els.ringProgress.style.strokeDashoffset = '0';
        els.ringGlow.style.strokeDasharray = CIRCUMFERENCE;
        els.ringGlow.style.strokeDashoffset = '0';
    }

    buildTicks();
    applyConfig();
    resetState();

    // ── CasparCG lifecycle ──

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyConfig();
        remainingSeconds = config.seconds;
        totalSeconds = config.seconds;

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Container fades in with bg
        playTL.to(els.container, { opacity: 1, duration: 0.6, ease: 'power2.out' });

        // 2. Film grain fades in
        playTL.to(els.noiseLayer, { opacity: 0.04, duration: 1 }, '-=0.4');

        // 3. Radial glow blooms from nothing
        playTL.to(els.radialGlow, { opacity: 0.25, duration: 1.2, ease: 'power2.out' }, '-=0.8');
        playTL.to(els.secondaryGlow, { opacity: 1, duration: 1, ease: 'power2.out' }, '-=1');

        // 4. Title materializes — letters first, then line draws beneath
        playTL.to(els.titleArea, {
            opacity: 1, y: 0,
            duration: 0.6,
            ease: 'power3.out'
        }, '-=0.6');

        playTL.to(els.titleLine, {
            width: 80, opacity: 0.5,
            duration: 0.5,
            ease: 'power2.inOut'
        }, '-=0.3');

        // 5. Ring scales in with subtle overshoot
        if (config.showProgressRing) {
            playTL.to(els.ringWrap, {
                opacity: 1, scale: 1,
                duration: 0.7,
                ease: 'back.out(1.1)'
            }, '-=0.4');
        }

        // 6. Timer digits scale in — the hero entrance
        playTL.to(els.timerDisplay, {
            opacity: 1, scale: 1,
            duration: 0.6,
            ease: 'back.out(1.3)'
        }, '-=0.35');

        // 7. Start counting
        playTL.call(function() {
            startCountdown();
        });
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }
        stopCountdown();

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetState();
            }
        });

        // Everything dissolves out with a gentle blur
        stopTL.to(els.completedTitle, { opacity: 0, scale: 0.9, duration: 0.3, ease: 'power2.in' });
        stopTL.to(els.completedSubtitle, { opacity: 0, y: 12, duration: 0.2, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.timerDisplay, { opacity: 0, scale: 0.9, duration: 0.3, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.ringWrap, { opacity: 0, scale: 0.9, duration: 0.35, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.titleArea, { opacity: 0, y: -20, duration: 0.3, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.titleLine, { width: 0, opacity: 0, duration: 0.2, ease: 'power2.in' }, '-=0.2');
        stopTL.to(els.radialGlow, { opacity: 0, duration: 0.5, ease: 'power2.in' }, '-=0.3');
        stopTL.to(els.secondaryGlow, { opacity: 0, duration: 0.3 }, '-=0.4');
        stopTL.to(els.noiseLayer, { opacity: 0, duration: 0.2 }, '-=0.3');
        stopTL.to(els.container, { opacity: 0, duration: 0.4, ease: 'power2.in' }, '-=0.2');
    };

    window.update = function(data) {
        var d = (typeof data === 'string') ? JSON.parse(data) : data;
        if (!d) return;

        if (d.title != null) {
            config.title = d.title;
            if (isVisible && !isCompleted) {
                gsap.to(els.title, {
                    opacity: 0, duration: 0.15,
                    onComplete: function() {
                        els.title.textContent = config.title;
                        gsap.to(els.title, { opacity: 1, duration: 0.25 });
                    }
                });
            }
        }

        if (d.subtitle != null) {
            config.subtitle = d.subtitle;
            if (isVisible && !isCompleted) {
                gsap.to(els.subtitle, {
                    opacity: 0, duration: 0.15,
                    onComplete: function() {
                        els.subtitle.textContent = config.subtitle;
                        gsap.to(els.subtitle, { opacity: 1, duration: 0.25 });
                    }
                });
            }
        }

        if (d.seconds != null) {
            config.seconds = d.seconds;
            remainingSeconds = d.seconds;
            totalSeconds = d.seconds;
            if (isVisible && !isCompleted) {
                updateDigits(remainingSeconds);
                updateProgressRing(remainingSeconds);
            }
        }

        if (d.accentColor != null) {
            config.accentColor = d.accentColor;
            gsap.to(els.ringProgress, { stroke: d.accentColor, duration: 0.5 });
            gsap.to(els.ringGlow, { stroke: d.accentColor, duration: 0.5 });
            els.radialGlow.style.background = 'radial-gradient(circle, ' + d.accentColor + '18, transparent 65%)';
            els.titleLine.style.background = 'linear-gradient(90deg, transparent, ' + d.accentColor + '66, transparent)';
            var glows = document.querySelectorAll('.digit-glow');
            for (var i = 0; i < glows.length; i++) glows[i].style.color = d.accentColor;
        }

        if (d.bgGradientStart != null) config.bgGradientStart = d.bgGradientStart;
        if (d.bgGradientEnd != null) config.bgGradientEnd = d.bgGradientEnd;
        if (d.bgGradientStart != null || d.bgGradientEnd != null) {
            gsap.to(els.bgOverlay, {
                background: 'linear-gradient(160deg, ' + config.bgGradientStart + ' 0%, ' + config.bgGradientEnd + ' 100%)',
                duration: 0.8
            });
        }

        if (d.completedTitle != null) config.completedTitle = d.completedTitle;
        if (d.completedSubtitle != null) config.completedSubtitle = d.completedSubtitle;
        if (d.showProgressRing != null) config.showProgressRing = d.showProgressRing;
        if (d.fontStyle != null) {
            config.fontStyle = d.fontStyle;
            if (d.fontStyle === 'mono') {
                els.timerDisplay.classList.add('font-mono');
            } else {
                els.timerDisplay.classList.remove('font-mono');
            }
        }
    };

    window.next = function() {
        if (!isCompleted && isVisible) {
            remainingSeconds = 0;
            stopCountdown();
            updateDigits(0);
            updateProgressRing(0);
            triggerComplete();
        }
    };
})();
</script>
</body>
</html>
