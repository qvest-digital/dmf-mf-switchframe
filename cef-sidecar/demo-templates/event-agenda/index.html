<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

/* ---------- Main container ---------- */
#agenda {
    position: absolute;
    top: 80px;
    right: 56px;
    width: 420px;
    font-family: 'Space Grotesk', sans-serif;
}

#agenda.pos-left {
    right: auto;
    left: 56px;
}

/* ---------- Card ---------- */
#card {
    background: rgba(8, 8, 16, 0.88);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    overflow: hidden;
    opacity: 0;
    transform: translateX(60px);
}

#agenda.pos-left #card {
    transform: translateX(-60px);
}

/* ---------- Header ---------- */
#header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
}

#event-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
}

#live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-color, #ff4d6a);
    opacity: 0;
    transform: scale(0.8);
}

#live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-color, #ff4d6a);
    box-shadow: 0 0 8px var(--accent-color, #ff4d6a);
}

@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
}

/* ---------- Current session ---------- */
#current-section {
    padding: 22px 24px 20px;
    position: relative;
    opacity: 0;
    transform: translateY(10px);
}

#current-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent-color, #ff4d6a);
    margin-bottom: 10px;
}

#current-title {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.3;
    margin-bottom: 8px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

#current-meta {
    display: flex;
    align-items: center;
    gap: 16px;
}

#current-speaker {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
}

#current-time-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.06);
    padding: 3px 10px;
    border-radius: 4px;
}

/* Progress bar for current session */
#current-progress {
    margin-top: 14px;
    height: 3px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
}

#current-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.8s ease;
}

/* ---------- Upcoming items ---------- */
#upcoming-section {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 4px 0;
}

.agenda-item {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 24px;
    position: relative;
    opacity: 0;
    transform: translateX(20px);
}

.agenda-item + .agenda-item {
    border-top: 1px solid rgba(255, 255, 255, 0.03);
}

.item-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.3);
    min-width: 72px;
    padding-top: 2px;
    flex-shrink: 0;
}

.item-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
}

.item-title {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.3;
}

.item-speaker {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.3);
}

/* ---------- Timeline connector ---------- */
.item-dot {
    position: absolute;
    left: 11px;
    top: 18px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    background: transparent;
}

.item-line {
    position: absolute;
    left: 13px;
    top: 28px;
    bottom: -2px;
    width: 1px;
    background: rgba(255, 255, 255, 0.06);
}

.agenda-item:last-child .item-line {
    display: none;
}

/* ---------- Footer ---------- */
#footer {
    padding: 12px 24px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
}

#duration-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.2);
    letter-spacing: 0.5px;
}

/* ---------- Accent glow ---------- */
#accent-edge {
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    border-radius: 14px 0 0 14px;
    opacity: 0;
}
</style>
</head>
<body>

<div id="agenda">
    <div id="card">
        <div id="accent-edge"></div>
        <div id="header">
            <span id="event-name">DEVELOPER SUMMIT 2026</span>
            <div id="live-badge">
                <div id="live-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
        <div id="current-section">
            <div id="current-label">NOW</div>
            <div id="current-title">Building Real-Time Video at Scale</div>
            <div id="current-meta">
                <span id="current-speaker">Sarah Chen</span>
                <span id="current-time-badge">10:30 AM</span>
            </div>
            <div id="current-progress">
                <div id="current-progress-fill"></div>
            </div>
        </div>
        <div id="upcoming-section"></div>
        <div id="footer">
            <span id="duration-label"></span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    /* ---------- Element cache ---------- */
    var els = {
        agenda:             document.getElementById('agenda'),
        card:               document.getElementById('card'),
        accentEdge:         document.getElementById('accent-edge'),
        header:             document.getElementById('header'),
        eventName:          document.getElementById('event-name'),
        liveBadge:          document.getElementById('live-badge'),
        liveDot:            document.getElementById('live-dot'),
        currentSection:     document.getElementById('current-section'),
        currentLabel:       document.getElementById('current-label'),
        currentTitle:       document.getElementById('current-title'),
        currentSpeaker:     document.getElementById('current-speaker'),
        currentTimeBadge:   document.getElementById('current-time-badge'),
        currentProgress:    document.getElementById('current-progress'),
        currentProgressFill:document.getElementById('current-progress-fill'),
        upcomingSection:    document.getElementById('upcoming-section'),
        footer:             document.getElementById('footer'),
        durationLabel:      document.getElementById('duration-label')
    };

    /* ---------- State ---------- */
    var isVisible    = false;
    var playTL       = null;
    var stopTL       = null;
    var progressAnim = null;
    var livePulse    = null;

    var data = {
        eventName: 'DEVELOPER SUMMIT 2026',
        currentTitle: 'Building Real-Time Video at Scale',
        currentSpeaker: 'Sarah Chen',
        currentTime: '10:30 AM',
        currentDuration: '45 min',
        accentColor: '#ff4d6a',
        showLiveIndicator: true,
        cardPosition: 'right',
        items: [
            { time: '11:30 AM', title: 'Coffee Break & Networking', speaker: '' },
            { time: '12:00 PM', title: 'Zero-Latency Encoding with NVENC', speaker: 'Marcus Webb' },
            { time: '1:00 PM', title: 'Panel: Future of Live Production', speaker: 'Multiple Speakers' }
        ]
    };

    gsap.defaults({ overwrite: 'auto' });

    /* ---------- Helpers ---------- */
    function applyAccent(color) {
        data.accentColor = color;
        els.agenda.style.setProperty('--accent-color', color);
        els.accentEdge.style.background = 'linear-gradient(180deg, ' + color + ' 0%, ' + color + '44 100%)';
        els.currentProgressFill.style.background = 'linear-gradient(90deg, ' + color + ', ' + color + 'aa)';
    }

    function buildUpcomingItems() {
        els.upcomingSection.innerHTML = '';
        var items = data.items || [];
        var maxItems = Math.min(items.length, 3);

        for (var i = 0; i < maxItems; i++) {
            var item = items[i];
            var row = document.createElement('div');
            row.className = 'agenda-item';
            row.innerHTML =
                '<div class="item-dot"></div>' +
                '<div class="item-line"></div>' +
                '<span class="item-time">' + escapeHtml(item.time || '') + '</span>' +
                '<div class="item-content">' +
                    '<div class="item-title">' + escapeHtml(item.title || '') + '</div>' +
                    (item.speaker ? '<div class="item-speaker">' + escapeHtml(item.speaker) + '</div>' : '') +
                '</div>';
            els.upcomingSection.appendChild(row);
        }
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function applyPosition() {
        if (data.cardPosition === 'left') {
            els.agenda.classList.add('pos-left');
        } else {
            els.agenda.classList.remove('pos-left');
        }
    }

    function applyData() {
        els.eventName.textContent = data.eventName || '';
        els.currentTitle.textContent = data.currentTitle || '';
        els.currentSpeaker.textContent = data.currentSpeaker || '';
        els.currentTimeBadge.textContent = data.currentTime || '';
        els.durationLabel.textContent = data.currentDuration ? data.currentDuration : '';
        els.liveBadge.style.display = data.showLiveIndicator ? 'flex' : 'none';
        applyAccent(data.accentColor);
        applyPosition();
        buildUpcomingItems();
    }

    applyData();

    /* ---------- Live pulse ---------- */
    function startLivePulse() {
        if (!data.showLiveIndicator) return;
        els.liveDot.style.animation = 'livePulse 1.5s ease-in-out infinite';
    }

    function stopLivePulse() {
        els.liveDot.style.animation = 'none';
    }

    /* ---------- Progress simulation ---------- */
    function startProgressAnim() {
        // Animate progress bar smoothly from 0 to 100% over ~60s (decorative)
        gsap.set(els.currentProgressFill, { width: '15%' });
        progressAnim = gsap.to(els.currentProgressFill, {
            width: '85%',
            duration: 60,
            ease: 'none',
            repeat: -1,
            yoyo: true
        });
    }

    function stopProgressAnim() {
        if (progressAnim) { progressAnim.kill(); progressAnim = null; }
    }

    /* ---------- Reset ---------- */
    function resetToHidden() {
        var slideDir = data.cardPosition === 'left' ? -60 : 60;
        gsap.set(els.card, { opacity: 0, x: slideDir });
        gsap.set(els.accentEdge, { opacity: 0 });
        gsap.set(els.header, { opacity: 0 });
        gsap.set(els.liveBadge, { opacity: 0, scale: 0.8 });
        gsap.set(els.currentSection, { opacity: 0, y: 10 });
        gsap.set(els.currentProgress, { opacity: 0 });
        gsap.set(els.footer, { opacity: 0 });
        stopLivePulse();
        stopProgressAnim();

        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            var itemSlide = data.cardPosition === 'left' ? -20 : 20;
            gsap.set(items, { opacity: 0, x: itemSlide });
        }
    }

    resetToHidden();

    /* ===================================================================
       CasparCG Lifecycle
       =================================================================== */

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyData();
        resetToHidden();

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Card slides in from right
        playTL.to(els.card, {
            opacity: 1, x: 0,
            duration: 0.55,
            ease: 'power3.out'
        });

        // 2. Accent edge glows in
        playTL.to(els.accentEdge, {
            opacity: 1,
            duration: 0.4,
            ease: 'power2.out'
        }, '-=0.4');

        // 3. Header fades in
        playTL.to(els.header, {
            opacity: 1,
            duration: 0.3,
            ease: 'power2.out'
        }, '-=0.3');

        // 4. Live badge pops
        if (data.showLiveIndicator) {
            playTL.to(els.liveBadge, {
                opacity: 1, scale: 1,
                duration: 0.3,
                ease: 'back.out(2)',
                onComplete: startLivePulse
            }, '-=0.2');
        }

        // 5. Current session section
        playTL.to(els.currentSection, {
            opacity: 1, y: 0,
            duration: 0.4,
            ease: 'power2.out'
        }, '-=0.2');

        // 6. Progress bar
        playTL.to(els.currentProgress, {
            opacity: 1,
            duration: 0.3,
            ease: 'power1.out',
            onComplete: startProgressAnim
        }, '-=0.15');

        // 7. Upcoming items stagger in
        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            playTL.to(items, {
                opacity: 1, x: 0,
                duration: 0.35,
                ease: 'power2.out',
                stagger: 0.12
            }, '-=0.15');
        }

        // 8. Footer
        playTL.to(els.footer, {
            opacity: 1,
            duration: 0.25,
            ease: 'power1.out'
        }, '-=0.1');
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                stopLivePulse();
                stopProgressAnim();
                resetToHidden();
            }
        });

        var slideDir = data.cardPosition === 'left' ? -60 : 60;

        // Footer
        stopTL.to(els.footer, { opacity: 0, duration: 0.15, ease: 'power1.in' });

        // Upcoming items
        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            var itemSlide = data.cardPosition === 'left' ? -20 : 20;
            stopTL.to(items, {
                opacity: 0, x: itemSlide,
                duration: 0.2,
                ease: 'power2.in',
                stagger: 0.06
            }, '-=0.1');
        }

        // Progress
        stopTL.to(els.currentProgress, { opacity: 0, duration: 0.15, ease: 'power1.in' }, '-=0.1');

        // Current section
        stopTL.to(els.currentSection, { opacity: 0, y: 10, duration: 0.25, ease: 'power2.in' }, '-=0.1');

        // Live badge
        stopTL.to(els.liveBadge, { opacity: 0, scale: 0.8, duration: 0.15, ease: 'power2.in' }, '-=0.1');

        // Header
        stopTL.to(els.header, { opacity: 0, duration: 0.2, ease: 'power2.in' }, '-=0.1');

        // Accent edge
        stopTL.to(els.accentEdge, { opacity: 0, duration: 0.2, ease: 'power1.in' }, '-=0.15');

        // Card slides out
        stopTL.to(els.card, { opacity: 0, x: slideDir, duration: 0.4, ease: 'power3.in' }, '-=0.15');
    };

    window.update = function(input) {
        var d = (typeof input === 'string') ? JSON.parse(input) : input;
        if (!d) return;

        var needsItemRebuild = false;

        if (d.eventName != null)      { data.eventName = d.eventName; els.eventName.textContent = d.eventName; }
        if (d.currentTitle != null)   { data.currentTitle = d.currentTitle; els.currentTitle.textContent = d.currentTitle; }
        if (d.currentSpeaker != null) { data.currentSpeaker = d.currentSpeaker; els.currentSpeaker.textContent = d.currentSpeaker; }
        if (d.currentTime != null)    { data.currentTime = d.currentTime; els.currentTimeBadge.textContent = d.currentTime; }
        if (d.currentDuration != null){ data.currentDuration = d.currentDuration; els.durationLabel.textContent = d.currentDuration; }
        if (d.accentColor != null)    { applyAccent(d.accentColor); }
        if (d.cardPosition != null)   { data.cardPosition = d.cardPosition; applyPosition(); }

        if (d.showLiveIndicator != null) {
            data.showLiveIndicator = d.showLiveIndicator;
            els.liveBadge.style.display = d.showLiveIndicator ? 'flex' : 'none';
            if (d.showLiveIndicator && isVisible) startLivePulse();
            else stopLivePulse();
        }

        if (d.items != null) {
            data.items = d.items;
            needsItemRebuild = true;
        }

        if (needsItemRebuild && isVisible) {
            var oldItems = els.upcomingSection.querySelectorAll('.agenda-item');
            var tl = gsap.timeline();

            // Fade old items out
            if (oldItems.length) {
                tl.to(oldItems, { opacity: 0, x: 20, duration: 0.2, ease: 'power2.in', stagger: 0.04 });
            }

            // Rebuild and animate new items in
            tl.call(function() {
                buildUpcomingItems();
                var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
                gsap.set(newItems, { opacity: 0, x: 20 });
                gsap.to(newItems, {
                    opacity: 1, x: 0,
                    duration: 0.3,
                    ease: 'power2.out',
                    stagger: 0.1
                });
            });
        } else if (needsItemRebuild) {
            buildUpcomingItems();
        }

        // Flash current section on update if visible
        if (isVisible && (d.currentTitle != null || d.currentSpeaker != null)) {
            gsap.timeline()
                .to(els.currentSection, {
                    boxShadow: '0 0 20px ' + data.accentColor + '22',
                    duration: 0.15
                })
                .to(els.currentSection, {
                    boxShadow: 'none',
                    duration: 0.4
                });
        }
    };

    window.next = function() {
        if (!isVisible) return;
        if (!data.items || data.items.length === 0) return;

        var tl = gsap.timeline();

        // Animate current session out upward
        tl.to(els.currentSection, {
            opacity: 0, y: -15,
            duration: 0.3,
            ease: 'power2.in'
        });

        // Shift data: first upcoming becomes current
        tl.call(function() {
            var next = data.items.shift();
            data.currentTitle   = next.title || '';
            data.currentSpeaker = next.speaker || '';
            data.currentTime    = next.time || '';

            els.currentTitle.textContent   = data.currentTitle;
            els.currentSpeaker.textContent = data.currentSpeaker;
            els.currentTimeBadge.textContent = data.currentTime;

            // Reset progress
            stopProgressAnim();
            gsap.set(els.currentProgressFill, { width: '0%' });

            // Rebuild upcoming
            buildUpcomingItems();
            var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
            gsap.set(newItems, { opacity: 0, x: 20 });

            gsap.set(els.currentSection, { y: 15 });
        });

        // Animate current section back in
        tl.to(els.currentSection, {
            opacity: 1, y: 0,
            duration: 0.35,
            ease: 'power2.out',
            onComplete: startProgressAnim
        });

        // Stagger new items in
        tl.call(function() {
            var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
            gsap.to(newItems, {
                opacity: 1, x: 0,
                duration: 0.3,
                ease: 'power2.out',
                stagger: 0.1
            });
        }, null, null, '-=0.15');
    };

})();
</script>
</body>
</html>
