<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ---------- Main container ---------- */
#agenda {
    position: absolute;
    top: 48px;
    right: 48px;
    width: 620px;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

#agenda.pos-left {
    right: auto;
    left: 48px;
}

/* ---------- Card ---------- */
#card {
    background: rgba(10, 10, 18, 0.92);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 1px 0 0 rgba(255, 255, 255, 0.06) inset;
    overflow: hidden;
    opacity: 0;
    transform: translateX(60px);
    position: relative;
}

#agenda.pos-left #card {
    transform: translateX(-60px);
}

/* ---------- Accent edge ---------- */
#accent-edge {
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    border-radius: 20px 0 0 20px;
    opacity: 0;
}

/* ---------- Header ---------- */
#header {
    padding: 28px 36px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
}

#event-name {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#live-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-color, #ff4d6a);
    opacity: 0;
    transform: scale(0.8);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#live-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-color, #ff4d6a);
    box-shadow: 0 0 10px var(--accent-color, #ff4d6a),
                0 0 20px var(--accent-glow, rgba(255, 77, 106, 0.3));
}

@keyframes livePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-color, #ff4d6a), 0 0 20px var(--accent-glow, rgba(255, 77, 106, 0.3)); }
    50%      { opacity: 0.4; box-shadow: 0 0 4px var(--accent-color, #ff4d6a); }
}

/* ---------- Current session ---------- */
#current-section {
    padding: 28px 36px 26px;
    position: relative;
    opacity: 0;
    transform: translateY(10px);
}

#current-label {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-color, #ff4d6a);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#current-label::before {
    content: '';
    display: block;
    width: 16px;
    height: 3px;
    background: var(--accent-color, #ff4d6a);
    border-radius: 2px;
}

#current-title {
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#current-meta {
    display: flex;
    align-items: center;
    gap: 18px;
}

#current-speaker {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#current-time-badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 36px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.06);
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* Progress bar */
#current-progress {
    margin-top: 20px;
    height: 3px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
}

#current-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.8s ease;
}

/* ---------- Upcoming section ---------- */
#upcoming-section {
    padding: 0;
}

/* ---------- Timeline ---------- */
.agenda-item {
    display: flex;
    align-items: flex-start;
    gap: 0;
    padding: 0 36px;
    position: relative;
    opacity: 0;
    transform: translateX(20px);
}

.agenda-item + .agenda-item .item-inner {
    border-top: 1px solid rgba(255, 255, 255, 0.04);
}

.item-inner {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding: 20px 0;
    flex: 1;
    margin-left: 28px;
}

/* Timeline track */
.item-timeline {
    position: absolute;
    left: 36px;
    top: 0;
    bottom: 0;
    width: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.item-node {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.12);
    background: rgba(10, 10, 18, 0.9);
    position: relative;
    top: 24px;
    z-index: 2;
    flex-shrink: 0;
}

.item-stem {
    width: 1px;
    flex: 1;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
    margin-top: -1px;
}

.agenda-item:last-child .item-stem {
    display: none;
}

.item-time {
    font-family: 'Source Code Pro', monospace;
    font-size: 36px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    min-width: 130px;
    padding-top: 2px;
    flex-shrink: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.item-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
}

.item-title {
    font-size: 42px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.item-speaker {
    font-size: 36px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* ---------- Footer ---------- */
#footer {
    padding: 18px 36px 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
}

#duration-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 36px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
</style>
</head>
<body>

<div id="agenda">
    <div id="card">
        <div id="accent-edge"></div>
        <div id="header">
            <span id="event-name">DEVELOPER SUMMIT 2026</span>
            <div id="live-badge">
                <div id="live-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
        <div id="current-section">
            <div id="current-label">NOW</div>
            <div id="current-title">Building Real-Time Video at Scale</div>
            <div id="current-meta">
                <span id="current-speaker">Sarah Chen</span>
                <span id="current-time-badge">10:30 AM</span>
            </div>
            <div id="current-progress">
                <div id="current-progress-fill"></div>
            </div>
        </div>
        <div id="upcoming-section"></div>
        <div id="footer">
            <span id="duration-label"></span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    /* ---------- Element cache ---------- */
    var els = {
        agenda:             document.getElementById('agenda'),
        card:               document.getElementById('card'),
        accentEdge:         document.getElementById('accent-edge'),
        header:             document.getElementById('header'),
        eventName:          document.getElementById('event-name'),
        liveBadge:          document.getElementById('live-badge'),
        liveDot:            document.getElementById('live-dot'),
        currentSection:     document.getElementById('current-section'),
        currentLabel:       document.getElementById('current-label'),
        currentTitle:       document.getElementById('current-title'),
        currentSpeaker:     document.getElementById('current-speaker'),
        currentTimeBadge:   document.getElementById('current-time-badge'),
        currentProgress:    document.getElementById('current-progress'),
        currentProgressFill:document.getElementById('current-progress-fill'),
        upcomingSection:    document.getElementById('upcoming-section'),
        footer:             document.getElementById('footer'),
        durationLabel:      document.getElementById('duration-label')
    };

    /* ---------- State ---------- */
    var isVisible    = false;
    var playTL       = null;
    var stopTL       = null;
    var progressAnim = null;

    var data = {
        eventName: 'DEVELOPER SUMMIT 2026',
        currentTitle: 'Building Real-Time Video at Scale',
        currentSpeaker: 'Sarah Chen',
        currentTime: '10:30 AM',
        currentDuration: '45 min',
        accentColor: '#ff4d6a',
        showLiveIndicator: true,
        cardPosition: 'right',
        items: [
            { time: '11:30 AM', title: 'Coffee Break & Networking', speaker: '' },
            { time: '12:00 PM', title: 'Zero-Latency Encoding with NVENC', speaker: 'Marcus Webb' },
            { time: '1:00 PM', title: 'Panel: Future of Live Production', speaker: 'Multiple Speakers' }
        ]
    };

    gsap.defaults({ overwrite: 'auto' });

    /* ---------- Helpers ---------- */
    function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function applyAccent(color) {
        data.accentColor = color;
        els.agenda.style.setProperty('--accent-color', color);
        els.agenda.style.setProperty('--accent-glow', hexToRgba(color, 0.3));
        els.accentEdge.style.background = 'linear-gradient(180deg, ' + color + ' 0%, ' + hexToRgba(color, 0.2) + ' 100%)';
        els.currentProgressFill.style.background = 'linear-gradient(90deg, ' + color + ', ' + hexToRgba(color, 0.6) + ')';
    }

    function buildUpcomingItems() {
        els.upcomingSection.innerHTML = '';
        var items = data.items || [];
        var maxItems = Math.min(items.length, 4);

        for (var i = 0; i < maxItems; i++) {
            var item = items[i];
            var row = document.createElement('div');
            row.className = 'agenda-item';
            row.innerHTML =
                '<div class="item-timeline">' +
                    '<div class="item-node"></div>' +
                    '<div class="item-stem"></div>' +
                '</div>' +
                '<div class="item-inner">' +
                    '<span class="item-time">' + escapeHtml(item.time || '') + '</span>' +
                    '<div class="item-content">' +
                        '<div class="item-title">' + escapeHtml(item.title || '') + '</div>' +
                        (item.speaker ? '<div class="item-speaker">' + escapeHtml(item.speaker) + '</div>' : '') +
                    '</div>' +
                '</div>';
            els.upcomingSection.appendChild(row);
        }
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function applyPosition() {
        if (data.cardPosition === 'left') {
            els.agenda.classList.add('pos-left');
        } else {
            els.agenda.classList.remove('pos-left');
        }
    }

    function applyData() {
        els.eventName.textContent = data.eventName || '';
        els.currentTitle.textContent = data.currentTitle || '';
        els.currentSpeaker.textContent = data.currentSpeaker || '';
        els.currentTimeBadge.textContent = data.currentTime || '';
        els.durationLabel.textContent = data.currentDuration ? data.currentDuration : '';
        els.liveBadge.style.display = data.showLiveIndicator ? 'flex' : 'none';
        applyAccent(data.accentColor);
        applyPosition();
        buildUpcomingItems();
    }

    applyData();

    /* ---------- Live pulse ---------- */
    function startLivePulse() {
        if (!data.showLiveIndicator) return;
        els.liveDot.style.animation = 'livePulse 2s ease-in-out infinite';
    }

    function stopLivePulse() {
        els.liveDot.style.animation = 'none';
    }

    /* ---------- Progress ---------- */
    function startProgressAnim() {
        gsap.set(els.currentProgressFill, { width: '15%' });
        progressAnim = gsap.to(els.currentProgressFill, {
            width: '85%',
            duration: 60,
            ease: 'none',
            repeat: -1,
            yoyo: true
        });
    }

    function stopProgressAnim() {
        if (progressAnim) { progressAnim.kill(); progressAnim = null; }
    }

    /* ---------- Reset ---------- */
    function resetToHidden() {
        var slideDir = data.cardPosition === 'left' ? -60 : 60;
        gsap.set(els.card, { opacity: 0, x: slideDir });
        gsap.set(els.accentEdge, { opacity: 0 });
        gsap.set(els.header, { opacity: 0 });
        gsap.set(els.liveBadge, { opacity: 0, scale: 0.8 });
        gsap.set(els.currentSection, { opacity: 0, y: 10 });
        gsap.set(els.currentProgress, { opacity: 0 });
        gsap.set(els.footer, { opacity: 0 });
        stopLivePulse();
        stopProgressAnim();

        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            var itemSlide = data.cardPosition === 'left' ? -20 : 20;
            gsap.set(items, { opacity: 0, x: itemSlide });
        }
    }

    resetToHidden();

    /* ===================================================================
       CasparCG Lifecycle
       =================================================================== */

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyData();
        resetToHidden();

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Card slides in
        playTL.to(els.card, {
            opacity: 1, x: 0,
            duration: 0.6,
            ease: 'power3.out'
        });

        // 2. Accent edge
        playTL.to(els.accentEdge, {
            opacity: 1,
            duration: 0.5,
            ease: 'power2.out'
        }, '-=0.45');

        // 3. Header
        playTL.to(els.header, {
            opacity: 1,
            duration: 0.35,
            ease: 'power2.out'
        }, '-=0.35');

        // 4. Live badge
        if (data.showLiveIndicator) {
            playTL.to(els.liveBadge, {
                opacity: 1, scale: 1,
                duration: 0.35,
                ease: 'back.out(2)',
                onComplete: startLivePulse
            }, '-=0.25');
        }

        // 5. Current session
        playTL.to(els.currentSection, {
            opacity: 1, y: 0,
            duration: 0.45,
            ease: 'power2.out'
        }, '-=0.2');

        // 6. Progress bar
        playTL.to(els.currentProgress, {
            opacity: 1,
            duration: 0.3,
            ease: 'power1.out',
            onComplete: startProgressAnim
        }, '-=0.15');

        // 7. Upcoming items with stagger
        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            playTL.to(items, {
                opacity: 1, x: 0,
                duration: 0.4,
                ease: 'power2.out',
                stagger: 0.1
            }, '-=0.15');
        }

        // 8. Footer
        playTL.to(els.footer, {
            opacity: 1,
            duration: 0.3,
            ease: 'power1.out'
        }, '-=0.1');
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                stopLivePulse();
                stopProgressAnim();
                resetToHidden();
            }
        });

        var slideDir = data.cardPosition === 'left' ? -60 : 60;

        stopTL.to(els.footer, { opacity: 0, duration: 0.15, ease: 'power1.in' });

        var items = els.upcomingSection.querySelectorAll('.agenda-item');
        if (items.length) {
            var itemSlide = data.cardPosition === 'left' ? -20 : 20;
            stopTL.to(items, {
                opacity: 0, x: itemSlide,
                duration: 0.2,
                ease: 'power2.in',
                stagger: 0.05
            }, '-=0.1');
        }

        stopTL.to(els.currentProgress, { opacity: 0, duration: 0.15, ease: 'power1.in' }, '-=0.1');
        stopTL.to(els.currentSection, { opacity: 0, y: 10, duration: 0.25, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.liveBadge, { opacity: 0, scale: 0.8, duration: 0.15, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.header, { opacity: 0, duration: 0.2, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.accentEdge, { opacity: 0, duration: 0.2, ease: 'power1.in' }, '-=0.15');
        stopTL.to(els.card, { opacity: 0, x: slideDir, duration: 0.45, ease: 'power3.in' }, '-=0.15');
    };

    window.update = function(input) {
        var d = (typeof input === 'string') ? JSON.parse(input) : input;
        if (!d) return;

        var needsItemRebuild = false;

        if (d.eventName != null)      { data.eventName = d.eventName; els.eventName.textContent = d.eventName; }
        if (d.currentTitle != null)   { data.currentTitle = d.currentTitle; els.currentTitle.textContent = d.currentTitle; }
        if (d.currentSpeaker != null) { data.currentSpeaker = d.currentSpeaker; els.currentSpeaker.textContent = d.currentSpeaker; }
        if (d.currentTime != null)    { data.currentTime = d.currentTime; els.currentTimeBadge.textContent = d.currentTime; }
        if (d.currentDuration != null){ data.currentDuration = d.currentDuration; els.durationLabel.textContent = d.currentDuration; }
        if (d.accentColor != null)    { applyAccent(d.accentColor); }
        if (d.cardPosition != null)   { data.cardPosition = d.cardPosition; applyPosition(); }

        if (d.showLiveIndicator != null) {
            data.showLiveIndicator = d.showLiveIndicator;
            els.liveBadge.style.display = d.showLiveIndicator ? 'flex' : 'none';
            if (d.showLiveIndicator && isVisible) startLivePulse();
            else stopLivePulse();
        }

        if (d.items != null) {
            data.items = d.items;
            needsItemRebuild = true;
        }

        if (needsItemRebuild && isVisible) {
            var oldItems = els.upcomingSection.querySelectorAll('.agenda-item');
            var tl = gsap.timeline();

            if (oldItems.length) {
                tl.to(oldItems, { opacity: 0, x: 20, duration: 0.2, ease: 'power2.in', stagger: 0.04 });
            }

            tl.call(function() {
                buildUpcomingItems();
                var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
                gsap.set(newItems, { opacity: 0, x: 20 });
                gsap.to(newItems, {
                    opacity: 1, x: 0,
                    duration: 0.35,
                    ease: 'power2.out',
                    stagger: 0.08
                });
            });
        } else if (needsItemRebuild) {
            buildUpcomingItems();
        }

        if (isVisible && (d.currentTitle != null || d.currentSpeaker != null)) {
            gsap.timeline()
                .to(els.currentSection, {
                    boxShadow: '0 0 24px ' + hexToRgba(data.accentColor, 0.08),
                    duration: 0.15
                })
                .to(els.currentSection, {
                    boxShadow: 'none',
                    duration: 0.5
                });
        }
    };

    window.next = function() {
        if (!isVisible) return;
        if (!data.items || data.items.length === 0) return;

        var tl = gsap.timeline();

        tl.to(els.currentSection, {
            opacity: 0, y: -15,
            duration: 0.3,
            ease: 'power2.in'
        });

        tl.call(function() {
            var next = data.items.shift();
            data.currentTitle   = next.title || '';
            data.currentSpeaker = next.speaker || '';
            data.currentTime    = next.time || '';

            els.currentTitle.textContent   = data.currentTitle;
            els.currentSpeaker.textContent = data.currentSpeaker;
            els.currentTimeBadge.textContent = data.currentTime;

            stopProgressAnim();
            gsap.set(els.currentProgressFill, { width: '0%' });

            buildUpcomingItems();
            var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
            gsap.set(newItems, { opacity: 0, x: 20 });

            gsap.set(els.currentSection, { y: 15 });
        });

        tl.to(els.currentSection, {
            opacity: 1, y: 0,
            duration: 0.4,
            ease: 'power2.out',
            onComplete: startProgressAnim
        });

        tl.call(function() {
            var newItems = els.upcomingSection.querySelectorAll('.agenda-item');
            gsap.to(newItems, {
                opacity: 1, x: 0,
                duration: 0.35,
                ease: 'power2.out',
                stagger: 0.08
            });
        }, null, null, '-=0.15');
    };

})();
</script>
</body>
</html>
