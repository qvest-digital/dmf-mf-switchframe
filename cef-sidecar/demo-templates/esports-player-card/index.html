<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Esports Player Card (OGraf)</title>
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<esports-player-card></esports-player-card>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
class EsportsPlayerCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });

    this._isVisible = false;
    this._currentStep = 0;
    this._playTL = null;
    this._stopTL = null;
    this._glitchInterval = null;
    this._data = {
      playerName: 'Faker', teamTag: 'T1', role: 'Mid Lane',
      kills: 12, deaths: 2, assists: 8,
      winRate: '73%', gamesPlayed: 142,
      teamColor: '#e2012d', accentColor: '#ffd700'
    };

    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
          position: absolute;
          bottom: 80px;
          left: 60px;
          pointer-events: none;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        .card {
          position: relative;
          width: 920px;
          overflow: visible;
        }

        /* --- Angular frame lines --- */
        .frame {
          position: absolute;
          top: -16px;
          left: -16px;
          right: -16px;
          bottom: -16px;
          pointer-events: none;
          opacity: 0;
        }
        .frame-edge {
          position: absolute;
          background: var(--team-color);
        }
        .frame-edge.top { top: 0; left: 0; height: 1px; width: 0; }
        .frame-edge.right { top: 0; right: 0; width: 1px; height: 0; }
        .frame-edge.bottom { bottom: 0; right: 0; height: 1px; width: 0; }
        .frame-edge.left { bottom: 0; left: 0; width: 1px; height: 0; }

        .frame-corner {
          position: absolute;
          width: 14px;
          height: 14px;
          opacity: 0;
        }
        .frame-corner::before, .frame-corner::after {
          content: '';
          position: absolute;
          background: var(--accent-color);
        }
        .frame-corner::before {
          width: 100%;
          height: 2px;
        }
        .frame-corner::after {
          width: 2px;
          height: 100%;
        }
        .frame-corner.tl { top: -1px; left: -1px; }
        .frame-corner.tr { top: -1px; right: -1px; }
        .frame-corner.tr::before { right: 0; }
        .frame-corner.tr::after { right: 0; }
        .frame-corner.bl { bottom: -1px; left: -1px; }
        .frame-corner.bl::before { bottom: 0; }
        .frame-corner.bl::after { bottom: 0; }
        .frame-corner.br { bottom: -1px; right: -1px; }
        .frame-corner.br::before { right: 0; bottom: 0; }
        .frame-corner.br::after { right: 0; bottom: 0; }

        /* --- Main panel with hard-cut angular geometry --- */
        .main-panel {
          position: relative;
          background: rgba(6, 6, 14, 0.94);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 36px 100%, 0 calc(100% - 36px));
          overflow: hidden;
          opacity: 0;
          transform: translateX(-80px);
        }

        /* Inner highlight edge on the panel */
        .panel-inner-edge {
          position: absolute;
          inset: 0;
          clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 36px 100%, 0 calc(100% - 36px));
          border: 1px solid rgba(255,255,255,0.06);
          pointer-events: none;
          z-index: 5;
        }

        /* Team color slash across the top */
        .top-slash {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(90deg, var(--team-color), var(--team-color) 60%, var(--accent-color) 100%);
          transform: scaleX(0);
          transform-origin: left;
          z-index: 2;
        }

        /* Diagonal accent in corner */
        .corner-slash {
          position: absolute;
          top: 0;
          right: 0;
          width: 60px;
          height: 60px;
          overflow: hidden;
          opacity: 0;
          z-index: 2;
        }
        .corner-slash::after {
          content: '';
          position: absolute;
          top: -30px;
          right: -30px;
          width: 60px;
          height: 60px;
          background: var(--team-color);
          transform: rotate(45deg);
        }

        /* Scanline sweep effect */
        .scanline {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(90deg, transparent 0%, var(--team-color) 20%, #ffffff 50%, var(--team-color) 80%, transparent 100%);
          opacity: 0;
          z-index: 20;
          filter: blur(0.5px);
          box-shadow: 0 0 12px var(--team-color), 0 0 4px #ffffff;
        }

        /* Glitch overlay (for micro-glitch effect) */
        .glitch-slice {
          position: absolute;
          left: 0;
          right: 0;
          height: 0;
          background: var(--team-color);
          opacity: 0;
          z-index: 15;
          mix-blend-mode: screen;
          pointer-events: none;
        }

        /* --- Content layout --- */
        .content {
          padding: 40px 44px 36px;
          display: flex;
          gap: 32px;
          align-items: flex-start;
          position: relative;
          z-index: 1;
        }

        /* --- Hexagonal avatar --- */
        .avatar-area {
          flex-shrink: 0;
          width: 130px;
          height: 130px;
          position: relative;
          opacity: 0;
          transform: scale(0.3) rotate(-15deg);
        }
        .avatar-hex {
          width: 130px;
          height: 130px;
          clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
          position: relative;
          background: var(--team-color);
          padding: 3px;
        }
        .avatar-hex-inner {
          width: 124px;
          height: 124px;
          clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
          background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          top: 3px;
          left: 3px;
        }
        .avatar-letter {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 64px;
          color: var(--team-color);
          line-height: 1;
          letter-spacing: 0.02em;
          opacity: 0.85;
          text-shadow: 0 0 20px var(--team-color);
        }
        .avatar-glow {
          position: absolute;
          inset: -10px;
          clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
          background: var(--team-color);
          opacity: 0;
          filter: blur(16px);
          z-index: -1;
        }
        /* Rotating hex ring */
        .avatar-ring {
          position: absolute;
          inset: -8px;
          clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
          border: 1px solid var(--team-color);
          opacity: 0;
          animation: hexRotate 12s linear infinite;
        }
        @keyframes hexRotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* --- Info block --- */
        .info {
          flex: 1;
          min-width: 0;
        }

        .team-tag {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 44px;
          font-weight: 700;
          color: var(--team-color);
          letter-spacing: 0.3em;
          text-transform: uppercase;
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .player-name {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 72px;
          color: #ffffff;
          line-height: 0.92;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          white-space: nowrap;
          position: relative;
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .player-name-glow {
          position: absolute;
          inset: 0;
          font-family: 'Bebas Neue', sans-serif;
          font-size: 72px;
          line-height: 0.92;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--team-color);
          filter: blur(20px);
          opacity: 0;
          pointer-events: none;
          z-index: -1;
        }

        .role-badge {
          display: inline-block;
          font-family: 'Barlow Condensed', sans-serif;
          font-size: 40px;
          font-weight: 600;
          color: rgba(255,255,255,0.95);
          background: var(--team-color);
          padding: 6px 28px 6px 20px;
          clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
          margin-top: 12px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          opacity: 0;
          transform: translateX(-30px);
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        /* --- Stats row (overview) --- */
        .stats-row {
          display: flex;
          gap: 0;
          margin-top: 24px;
          padding-top: 20px;
          border-top: 1px solid rgba(255,255,255,0.06);
        }

        .stat-block {
          flex: 1;
          text-align: center;
          position: relative;
          padding: 12px 0;
          opacity: 0;
          transform: translateY(20px);
        }
        .stat-block + .stat-block::before {
          content: '';
          position: absolute;
          left: 0;
          top: 8px;
          bottom: 8px;
          width: 1px;
          background: rgba(255,255,255,0.06);
        }
        .stat-value {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 56px;
          color: var(--accent-color);
          line-height: 1;
          letter-spacing: 0.02em;
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .stat-value.kills { color: #22c55e; }
        .stat-value.deaths { color: #ef4444; }
        .stat-value.assists { color: #60a5fa; }
        .stat-label {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 36px;
          font-weight: 600;
          color: rgba(255,255,255,0.7);
          text-transform: uppercase;
          letter-spacing: 0.15em;
          margin-top: 6px;
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        /* --- Detailed stats (step 2) --- */
        .detail-stats {
          display: none;
          margin-top: 24px;
          padding-top: 20px;
          border-top: 1px solid rgba(255,255,255,0.06);
        }
        .detail-stats.active {
          display: block;
        }
        .detail-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 12px 0;
          opacity: 0;
          transform: translateX(-20px);
        }
        .detail-row + .detail-row {
          border-top: 1px solid rgba(255,255,255,0.04);
        }
        .detail-label {
          font-family: 'Barlow Condensed', sans-serif;
          font-size: 36px;
          font-weight: 500;
          color: rgba(255,255,255,0.7);
          text-transform: uppercase;
          letter-spacing: 0.15em;
          width: 140px;
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .detail-bar {
          flex: 1;
          margin: 0 24px;
          height: 6px;
          background: rgba(255,255,255,0.04);
          position: relative;
          overflow: hidden;
          clip-path: polygon(0 0, calc(100% - 2px) 0, 100% 100%, 0 100%);
        }
        .detail-bar-fill {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          background: linear-gradient(90deg, var(--team-color), var(--accent-color));
          width: 0;
          box-shadow: 0 0 8px var(--team-color);
        }
        .detail-value {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 40px;
          font-weight: 700;
          color: #ffffff;
          width: 100px;
          text-align: right;
          text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        /* --- Background pattern --- */
        .bg-pattern {
          position: absolute;
          inset: 0;
          opacity: 0;
          background-image:
            repeating-linear-gradient(
              90deg,
              rgba(255,255,255,0.015) 0px,
              rgba(255,255,255,0.015) 1px,
              transparent 1px,
              transparent 40px
            );
          z-index: 0;
          pointer-events: none;
        }

        /* --- Particle dots --- */
        .particles {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          pointer-events: none;
          overflow: hidden;
          z-index: 0;
        }
        .particle {
          position: absolute;
          width: 2px;
          height: 2px;
          background: var(--team-color);
          opacity: 0;
        }
      </style>

      <div class="card" id="card">
        <!-- Angular frame -->
        <div class="frame" id="frame">
          <div class="frame-edge top" id="frame-top"></div>
          <div class="frame-edge right" id="frame-right"></div>
          <div class="frame-edge bottom" id="frame-bottom"></div>
          <div class="frame-edge left" id="frame-left"></div>
          <div class="frame-corner tl" id="fc-tl"></div>
          <div class="frame-corner tr" id="fc-tr"></div>
          <div class="frame-corner bl" id="fc-bl"></div>
          <div class="frame-corner br" id="fc-br"></div>
        </div>

        <!-- Main panel -->
        <div class="main-panel" id="main-panel">
          <div class="panel-inner-edge"></div>
          <div class="bg-pattern" id="bg-pattern"></div>
          <div class="scanline" id="scanline"></div>
          <div class="glitch-slice" id="glitch1"></div>
          <div class="glitch-slice" id="glitch2"></div>
          <div class="particles" id="particles"></div>
          <div class="corner-slash" id="corner-slash"></div>
          <div class="top-slash" id="top-slash"></div>

          <div class="content">
            <!-- Avatar -->
            <div class="avatar-area" id="avatar-area">
              <div class="avatar-glow" id="avatar-glow"></div>
              <div class="avatar-ring" id="avatar-ring"></div>
              <div class="avatar-hex">
                <div class="avatar-hex-inner">
                  <span class="avatar-letter" id="avatar-letter"></span>
                </div>
              </div>
            </div>

            <!-- Info -->
            <div class="info">
              <div class="team-tag" id="team-tag"></div>
              <div class="player-name" id="player-name" style="position:relative">
                <span id="player-name-text"></span>
                <span class="player-name-glow" id="player-name-glow"></span>
              </div>
              <div class="role-badge" id="role-badge"></div>

              <!-- Overview stats (step 1) -->
              <div class="stats-row" id="stats-row">
                <div class="stat-block" id="stat-k">
                  <div class="stat-value kills" id="val-k">0</div>
                  <div class="stat-label">Kills</div>
                </div>
                <div class="stat-block" id="stat-d">
                  <div class="stat-value deaths" id="val-d">0</div>
                  <div class="stat-label">Deaths</div>
                </div>
                <div class="stat-block" id="stat-a">
                  <div class="stat-value assists" id="val-a">0</div>
                  <div class="stat-label">Assists</div>
                </div>
                <div class="stat-block" id="stat-kda">
                  <div class="stat-value" id="val-kda">0.0</div>
                  <div class="stat-label">KDA</div>
                </div>
              </div>

              <!-- Detail stats (step 2) -->
              <div class="detail-stats" id="detail-stats">
                <div class="detail-row" id="dr-kills">
                  <span class="detail-label">Kills</span>
                  <div class="detail-bar"><div class="detail-bar-fill" id="bar-kills"></div></div>
                  <span class="detail-value" id="dv-kills">0</span>
                </div>
                <div class="detail-row" id="dr-deaths">
                  <span class="detail-label">Deaths</span>
                  <div class="detail-bar"><div class="detail-bar-fill" id="bar-deaths"></div></div>
                  <span class="detail-value" id="dv-deaths">0</span>
                </div>
                <div class="detail-row" id="dr-assists">
                  <span class="detail-label">Assists</span>
                  <div class="detail-bar"><div class="detail-bar-fill" id="bar-assists"></div></div>
                  <span class="detail-value" id="dv-assists">0</span>
                </div>
                <div class="detail-row" id="dr-winrate">
                  <span class="detail-label">Win Rate</span>
                  <div class="detail-bar"><div class="detail-bar-fill" id="bar-winrate"></div></div>
                  <span class="detail-value" id="dv-winrate">0%</span>
                </div>
                <div class="detail-row" id="dr-games">
                  <span class="detail-label">Games</span>
                  <div class="detail-bar"><div class="detail-bar-fill" id="bar-games"></div></div>
                  <span class="detail-value" id="dv-games">0</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    this._els = {
      card: this.shadowRoot.getElementById('card'),
      frame: this.shadowRoot.getElementById('frame'),
      frameTop: this.shadowRoot.getElementById('frame-top'),
      frameRight: this.shadowRoot.getElementById('frame-right'),
      frameBottom: this.shadowRoot.getElementById('frame-bottom'),
      frameLeft: this.shadowRoot.getElementById('frame-left'),
      fcTL: this.shadowRoot.getElementById('fc-tl'),
      fcTR: this.shadowRoot.getElementById('fc-tr'),
      fcBL: this.shadowRoot.getElementById('fc-bl'),
      fcBR: this.shadowRoot.getElementById('fc-br'),
      mainPanel: this.shadowRoot.getElementById('main-panel'),
      bgPattern: this.shadowRoot.getElementById('bg-pattern'),
      scanline: this.shadowRoot.getElementById('scanline'),
      glitch1: this.shadowRoot.getElementById('glitch1'),
      glitch2: this.shadowRoot.getElementById('glitch2'),
      particles: this.shadowRoot.getElementById('particles'),
      cornerSlash: this.shadowRoot.getElementById('corner-slash'),
      topSlash: this.shadowRoot.getElementById('top-slash'),
      avatarArea: this.shadowRoot.getElementById('avatar-area'),
      avatarGlow: this.shadowRoot.getElementById('avatar-glow'),
      avatarRing: this.shadowRoot.getElementById('avatar-ring'),
      avatarLetter: this.shadowRoot.getElementById('avatar-letter'),
      teamTag: this.shadowRoot.getElementById('team-tag'),
      playerName: this.shadowRoot.getElementById('player-name'),
      playerNameText: this.shadowRoot.getElementById('player-name-text'),
      playerNameGlow: this.shadowRoot.getElementById('player-name-glow'),
      roleBadge: this.shadowRoot.getElementById('role-badge'),
      statsRow: this.shadowRoot.getElementById('stats-row'),
      detailStats: this.shadowRoot.getElementById('detail-stats'),
      valK: this.shadowRoot.getElementById('val-k'),
      valD: this.shadowRoot.getElementById('val-d'),
      valA: this.shadowRoot.getElementById('val-a'),
      valKda: this.shadowRoot.getElementById('val-kda'),
      statBlocks: this.shadowRoot.querySelectorAll('.stat-block'),
      detailRows: this.shadowRoot.querySelectorAll('.detail-row'),
    };

    // Create particle elements
    this._particleEls = [];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      this._els.particles.appendChild(p);
      this._particleEls.push(p);
    }
  }

  _applyColors() {
    this._els.card.style.setProperty('--team-color', this._data.teamColor);
    this._els.card.style.setProperty('--accent-color', this._data.accentColor);
  }

  _populateData() {
    const d = this._data;
    this._els.teamTag.textContent = d.teamTag;
    this._els.playerNameText.textContent = d.playerName;
    this._els.playerNameGlow.textContent = d.playerName;
    this._els.roleBadge.textContent = d.role;
    this._els.avatarLetter.textContent = d.playerName.charAt(0);
    this._els.valK.textContent = d.kills;
    this._els.valD.textContent = d.deaths;
    this._els.valA.textContent = d.assists;
    const kda = d.deaths > 0 ? ((d.kills + d.assists) / d.deaths).toFixed(1) : (d.kills + d.assists).toFixed(1);
    this._els.valKda.textContent = kda;

    // Detail values
    this.shadowRoot.getElementById('dv-kills').textContent = d.kills;
    this.shadowRoot.getElementById('dv-deaths').textContent = d.deaths;
    this.shadowRoot.getElementById('dv-assists').textContent = d.assists;
    this.shadowRoot.getElementById('dv-winrate').textContent = d.winRate;
    this.shadowRoot.getElementById('dv-games').textContent = d.gamesPlayed;
  }

  _calcKDA() {
    const d = this._data;
    return d.deaths > 0 ? ((d.kills + d.assists) / d.deaths).toFixed(1) : (d.kills + d.assists).toFixed(1);
  }

  _startGlitchLoop() {
    this._stopGlitchLoop();
    const doGlitch = () => {
      if (!this._isVisible) return;
      const el1 = this._els.glitch1;
      const el2 = this._els.glitch2;
      const h = 2 + Math.random() * 6;
      const y1 = Math.random() * 100;
      gsap.set(el1, { top: y1 + '%', height: h, opacity: 0.15 + Math.random() * 0.15, scaleX: 1 + Math.random() * 0.1 });
      gsap.set(el2, { top: (y1 + 10 + Math.random() * 20) + '%', height: h * 0.5, opacity: 0.1 + Math.random() * 0.1 });
      gsap.to([el1, el2], { opacity: 0, duration: 0.05 + Math.random() * 0.05, delay: 0.02 });
      this._glitchInterval = setTimeout(doGlitch, 2000 + Math.random() * 4000);
    };
    this._glitchInterval = setTimeout(doGlitch, 1500);
  }

  _stopGlitchLoop() {
    if (this._glitchInterval) { clearTimeout(this._glitchInterval); this._glitchInterval = null; }
    gsap.set([this._els.glitch1, this._els.glitch2], { opacity: 0 });
  }

  async load(data) {
    if (data) this._data = { ...this._data, ...data };
    this._applyColors();
    this._populateData();
    this._currentStep = 0;
    this._resetToHidden();
    return { status: 200 };
  }

  async playAction(opts) {
    if (this._stopTL) { this._stopTL.kill(); this._stopTL = null; }
    this._isVisible = true;
    this._currentStep = 0;
    const els = this._els;

    return new Promise((resolve) => {
      this._playTL = gsap.timeline({
        defaults: { overwrite: 'auto' },
        onComplete: () => {
          this._playTL = null;
          this._startGlitchLoop();
          resolve({ status: 200 });
        }
      });

      const tl = this._playTL;

      // 1. Scanline sweeps down the full height -- the SIGNATURE opening moment
      tl.set(els.scanline, { opacity: 0.9 }, 0);
      tl.to(els.scanline, {
        top: '100%',
        duration: 0.3,
        ease: 'power2.in',
      }, 0);
      tl.to(els.scanline, { opacity: 0, duration: 0.08 }, 0.25);

      // 2. Panel slams in with elastic overshoot
      tl.to(els.mainPanel, {
        opacity: 1, x: 0,
        duration: 0.5,
        ease: 'back.out(1.2)',
      }, 0.03);

      // 3. Background pattern fades in
      tl.to(els.bgPattern, { opacity: 1, duration: 0.4 }, 0.15);

      // 4. Top slash wipes left-to-right
      tl.to(els.topSlash, {
        scaleX: 1,
        duration: 0.3,
        ease: 'power3.out',
      }, 0.1);

      // 5. Corner slash pops
      tl.to(els.cornerSlash, {
        opacity: 1,
        duration: 0.15,
        ease: 'power1.out',
      }, 0.25);

      // 6. Frame draws on (clockwise) with corners
      tl.to(els.frame, { opacity: 1, duration: 0.01 }, 0.15);
      tl.to(els.frameTop, { width: '100%', duration: 0.25, ease: 'power2.out' }, 0.15);
      tl.to(els.frameRight, { height: '100%', duration: 0.25, ease: 'power2.out' }, 0.25);
      tl.to(els.frameBottom, { width: '100%', duration: 0.25, ease: 'power2.out' }, 0.35);
      tl.to(els.frameLeft, { height: '100%', duration: 0.25, ease: 'power2.out' }, 0.45);
      // Corners pop at each corner completion
      tl.to(els.fcTL, { opacity: 1, duration: 0.1 }, 0.15);
      tl.to(els.fcTR, { opacity: 1, duration: 0.1 }, 0.35);
      tl.to(els.fcBR, { opacity: 1, duration: 0.1 }, 0.55);
      tl.to(els.fcBL, { opacity: 1, duration: 0.1 }, 0.65);

      // 7. Avatar slams in with aggressive overshoot
      tl.to(els.avatarArea, {
        opacity: 1, scale: 1, rotation: 0,
        duration: 0.45,
        ease: 'back.out(2)',
      }, 0.15);
      tl.to(els.avatarGlow, {
        opacity: 0.35,
        duration: 0.25,
        ease: 'power1.out',
      }, 0.35);
      tl.to(els.avatarGlow, {
        opacity: 0.12,
        duration: 0.6,
        ease: 'power1.inOut',
      }, 0.6);
      tl.to(els.avatarRing, {
        opacity: 0.3,
        duration: 0.3,
      }, 0.4);

      // 8. Team tag clip-path wipe
      tl.to(els.teamTag, {
        opacity: 1,
        clipPath: 'inset(0 0% 0 0)',
        duration: 0.3,
        ease: 'power3.out',
      }, 0.2);

      // 9. Player name -- dramatic clip-path wipe reveal
      tl.to(els.playerName, {
        opacity: 1,
        clipPath: 'inset(0 0% 0 0)',
        duration: 0.4,
        ease: 'power3.out',
      }, 0.25);

      // Player name glow pulse
      tl.to(els.playerNameGlow, {
        opacity: 0.15,
        duration: 0.3,
        ease: 'power1.out',
      }, 0.4);
      tl.to(els.playerNameGlow, {
        opacity: 0.06,
        duration: 0.6,
        ease: 'power1.inOut',
      }, 0.7);

      // 10. Role badge slides in with clip
      tl.to(els.roleBadge, {
        opacity: 1, x: 0,
        duration: 0.35,
        ease: 'power3.out',
      }, 0.35);

      // 11. Stat blocks stagger up with count-up
      els.statBlocks.forEach((block, i) => {
        tl.to(block, {
          opacity: 1, y: 0,
          duration: 0.35,
          ease: 'back.out(1.3)',
        }, 0.5 + i * 0.08);
      });

      // Animated stat counting with color flash
      const d = this._data;
      const countTargets = [
        { el: els.valK, val: d.kills, dec: 0 },
        { el: els.valD, val: d.deaths, dec: 0 },
        { el: els.valA, val: d.assists, dec: 0 },
        { el: els.valKda, val: parseFloat(this._calcKDA()), dec: 1 },
      ];
      countTargets.forEach((t, i) => {
        const proxy = { v: 0 };
        tl.to(proxy, {
          v: t.val,
          duration: 0.7,
          ease: 'power2.out',
          onUpdate: () => { t.el.textContent = proxy.v.toFixed(t.dec); },
        }, 0.55 + i * 0.08);
      });

      // 12. Particles drift upward
      this._particleEls.forEach((p, i) => {
        tl.to(p, {
          opacity: 0.15 + Math.random() * 0.2,
          y: -(20 + Math.random() * 50),
          duration: 1 + Math.random() * 0.8,
          ease: 'power1.out',
        }, 0.3 + i * 0.03);
      });
    });
  }

  async stopAction(opts) {
    if (this._playTL) { this._playTL.kill(); this._playTL = null; }
    this._stopGlitchLoop();
    const els = this._els;

    return new Promise((resolve) => {
      this._stopTL = gsap.timeline({
        defaults: { overwrite: 'auto' },
        onComplete: () => {
          this._isVisible = false;
          this._stopTL = null;
          this._resetToHidden();
          resolve({ status: 200 });
        }
      });

      const tl = this._stopTL;

      // Quick scanline flash on exit
      tl.set(els.scanline, { top: '100%', opacity: 0 }, 0);
      tl.set(els.scanline, { top: 0, opacity: 0.7 }, 0.02);
      tl.to(els.scanline, { top: '100%', duration: 0.2, ease: 'power2.in' }, 0.02);
      tl.to(els.scanline, { opacity: 0, duration: 0.05 }, 0.18);

      // Particles fade
      tl.to(this._particleEls, { opacity: 0, duration: 0.15 }, 0);

      // Stats collapse
      tl.to(els.statBlocks, {
        opacity: 0, y: 12,
        duration: 0.15, stagger: 0.02,
      }, 0);
      tl.to(this.shadowRoot.querySelectorAll('.detail-row'), {
        opacity: 0, x: -12,
        duration: 0.15, stagger: 0.02,
      }, 0);

      // Text and badges out with clip-path
      tl.to(els.roleBadge, { opacity: 0, x: -20, duration: 0.15 }, 0.05);
      tl.to(els.playerName, {
        clipPath: 'inset(0 0 0 100%)',
        duration: 0.2,
        ease: 'power3.in',
      }, 0.08);
      tl.to(els.teamTag, {
        clipPath: 'inset(0 0 0 100%)',
        duration: 0.15,
        ease: 'power3.in',
      }, 0.1);

      // Avatar shrinks and rotates out
      tl.to(els.avatarGlow, { opacity: 0, duration: 0.1 }, 0.1);
      tl.to(els.avatarRing, { opacity: 0, duration: 0.1 }, 0.1);
      tl.to(els.avatarArea, {
        opacity: 0, scale: 0.5, rotation: 10,
        duration: 0.2, ease: 'power3.in',
      }, 0.1);

      // Frame dissolves
      const corners = [els.fcTL, els.fcTR, els.fcBR, els.fcBL];
      tl.to(corners, { opacity: 0, duration: 0.1 }, 0.15);
      tl.to([els.frameTop, els.frameRight, els.frameBottom, els.frameLeft], {
        opacity: 0, duration: 0.15,
      }, 0.15);

      // Top slash retracts
      tl.to(els.topSlash, { scaleX: 0, duration: 0.15, ease: 'power2.in' }, 0.15);
      tl.to(els.cornerSlash, { opacity: 0, duration: 0.1 }, 0.15);

      // Panel slides out
      tl.to(els.mainPanel, {
        opacity: 0, x: -60,
        duration: 0.3, ease: 'power3.in',
      }, 0.2);

      tl.to(els.frame, { opacity: 0, duration: 0.1 }, 0.25);
    });
  }

  async updateAction(opts) {
    if (!opts || !opts.data) return { status: 200 };
    const data = opts.data;
    let changed = false;

    for (const key of Object.keys(data)) {
      if (data[key] != null && data[key] !== this._data[key]) {
        this._data[key] = data[key];
        changed = true;
      }
    }

    if (!changed) return { status: 200 };

    this._applyColors();
    this._populateData();

    if (this._isVisible) {
      return new Promise((resolve) => {
        const tl = gsap.timeline({ onComplete: () => resolve({ status: 200 }) });
        // Flash top slash
        tl.to(this._els.topSlash, { opacity: 0.5, duration: 0.08 });
        tl.to(this._els.topSlash, { opacity: 1, duration: 0.3 });

        // Re-count stats if visible
        if (this._currentStep === 0) {
          const d = this._data;
          const countTargets = [
            { el: this._els.valK, val: d.kills, dec: 0 },
            { el: this._els.valD, val: d.deaths, dec: 0 },
            { el: this._els.valA, val: d.assists, dec: 0 },
            { el: this._els.valKda, val: parseFloat(this._calcKDA()), dec: 1 },
          ];
          countTargets.forEach((t) => {
            const cur = parseFloat(t.el.textContent) || 0;
            const proxy = { v: cur };
            tl.to(proxy, {
              v: t.val, duration: 0.4, ease: 'power1.out',
              onUpdate: () => { t.el.textContent = proxy.v.toFixed(t.dec); },
            }, 0);
          });
        }
      });
    }
    return { status: 200 };
  }

  async customAction(opts) {
    if (!opts || !opts.action) return { status: 200 };
    if (opts.action === 'next') return this._toggleStep();
    return { status: 200 };
  }

  async _toggleStep() {
    if (!this._isVisible) return { status: 200 };
    const els = this._els;

    if (this._currentStep === 0) {
      this._currentStep = 1;
      return new Promise((resolve) => {
        const tl = gsap.timeline({ onComplete: () => resolve({ status: 200 }) });

        // Fade out overview stats
        tl.to(els.statBlocks, {
          opacity: 0, y: -12,
          duration: 0.2, stagger: 0.03,
        });
        tl.call(() => {
          els.statsRow.style.display = 'none';
          els.detailStats.classList.add('active');
        });

        const d = this._data;
        const maxStat = Math.max(d.kills, d.deaths, d.assists, 1);
        const wrPct = parseInt(d.winRate) || 0;
        const barData = [
          { id: 'bar-kills', pct: (d.kills / maxStat) * 100 },
          { id: 'bar-deaths', pct: (d.deaths / maxStat) * 100 },
          { id: 'bar-assists', pct: (d.assists / maxStat) * 100 },
          { id: 'bar-winrate', pct: wrPct },
          { id: 'bar-games', pct: Math.min((d.gamesPlayed / 200) * 100, 100) },
        ];

        const rows = this.shadowRoot.querySelectorAll('.detail-row');
        rows.forEach((row, i) => {
          tl.to(row, {
            opacity: 1, x: 0,
            duration: 0.3, ease: 'power2.out',
          }, 0.35 + i * 0.07);
          tl.to(this.shadowRoot.getElementById(barData[i].id), {
            width: barData[i].pct + '%',
            duration: 0.6, ease: 'power2.out',
          }, 0.4 + i * 0.07);
        });
      });
    } else {
      this._currentStep = 0;
      return new Promise((resolve) => {
        const tl = gsap.timeline({ onComplete: () => resolve({ status: 200 }) });

        const rows = this.shadowRoot.querySelectorAll('.detail-row');
        tl.to(rows, {
          opacity: 0, x: -12,
          duration: 0.2, stagger: 0.02,
        });
        tl.call(() => {
          this.shadowRoot.querySelectorAll('.detail-bar-fill').forEach(b => { b.style.width = '0'; });
          els.detailStats.classList.remove('active');
          els.statsRow.style.display = '';
        });

        els.statBlocks.forEach((block, i) => {
          tl.to(block, {
            opacity: 1, y: 0,
            duration: 0.3, ease: 'back.out(1.2)',
          }, 0.3 + i * 0.06);
        });
      });
    }
  }

  dispose() {
    if (this._playTL) { this._playTL.kill(); this._playTL = null; }
    if (this._stopTL) { this._stopTL.kill(); this._stopTL = null; }
    this._stopGlitchLoop();
    gsap.killTweensOf(Object.values(this._els));
    this._isVisible = false;
  }

  _resetToHidden() {
    const els = this._els;
    gsap.set(els.mainPanel, { opacity: 0, x: -80 });
    gsap.set(els.bgPattern, { opacity: 0 });
    gsap.set(els.topSlash, { scaleX: 0 });
    gsap.set(els.cornerSlash, { opacity: 0 });
    gsap.set(els.frame, { opacity: 0 });
    gsap.set(els.frameTop, { width: 0 });
    gsap.set(els.frameRight, { height: 0 });
    gsap.set(els.frameBottom, { width: 0 });
    gsap.set(els.frameLeft, { height: 0 });
    gsap.set([els.fcTL, els.fcTR, els.fcBL, els.fcBR], { opacity: 0 });
    gsap.set(els.avatarArea, { opacity: 0, scale: 0.3, rotation: -15 });
    gsap.set(els.avatarGlow, { opacity: 0 });
    gsap.set(els.avatarRing, { opacity: 0 });
    gsap.set(els.teamTag, { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
    gsap.set(els.playerName, { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
    gsap.set(els.playerNameGlow, { opacity: 0 });
    gsap.set(els.roleBadge, { opacity: 0, x: -30 });
    gsap.set(els.statBlocks, { opacity: 0, y: 20 });
    gsap.set(this.shadowRoot.querySelectorAll('.detail-row'), { opacity: 0, x: -20 });
    gsap.set(this.shadowRoot.querySelectorAll('.detail-bar-fill'), { width: 0 });
    gsap.set(els.scanline, { top: 0, opacity: 0 });
    gsap.set([els.glitch1, els.glitch2], { opacity: 0 });
    gsap.set(this._particleEls, { opacity: 0, y: 0 });
    els.statsRow.style.display = '';
    els.detailStats.classList.remove('active');

    this._els.valK.textContent = '0';
    this._els.valD.textContent = '0';
    this._els.valA.textContent = '0';
    this._els.valKda.textContent = '0.0';
  }
}

customElements.define('esports-player-card', EsportsPlayerCard);
</script>
