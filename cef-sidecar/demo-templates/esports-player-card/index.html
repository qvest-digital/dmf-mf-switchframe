<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

#card {
    position: absolute;
    bottom: 80px;
    left: 60px;
    width: 920px;
    overflow: visible;
}

/* --- Angular frame lines --- */
#frame {
    position: absolute;
    top: -16px;
    left: -16px;
    right: -16px;
    bottom: -16px;
    pointer-events: none;
    opacity: 0;
}
.frame-edge {
    position: absolute;
    background: var(--team-color, #e2012d);
}
.frame-edge.top { top: 0; left: 0; height: 1px; width: 0; }
.frame-edge.right { top: 0; right: 0; width: 1px; height: 0; }
.frame-edge.bottom { bottom: 0; right: 0; height: 1px; width: 0; }
.frame-edge.left { bottom: 0; left: 0; width: 1px; height: 0; }

.frame-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    opacity: 0;
}
.frame-corner::before, .frame-corner::after {
    content: '';
    position: absolute;
    background: var(--accent-color, #ffd700);
}
.frame-corner::before { width: 100%; height: 2px; }
.frame-corner::after { width: 2px; height: 100%; }
.frame-corner.tl { top: -1px; left: -1px; }
.frame-corner.tr { top: -1px; right: -1px; }
.frame-corner.tr::before { right: 0; }
.frame-corner.tr::after { right: 0; }
.frame-corner.bl { bottom: -1px; left: -1px; }
.frame-corner.bl::before { bottom: 0; }
.frame-corner.bl::after { bottom: 0; }
.frame-corner.br { bottom: -1px; right: -1px; }
.frame-corner.br::before { right: 0; bottom: 0; }
.frame-corner.br::after { right: 0; bottom: 0; }

/* --- Main panel with hard-cut angular geometry --- */
#main-panel {
    position: relative;
    background: rgba(6, 6, 14, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 36px 100%, 0 calc(100% - 36px));
    overflow: hidden;
    opacity: 0;
    transform: translateX(-80px);
}

.panel-inner-edge {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, calc(100% - 36px) 0, 100% 36px, 100% 100%, 36px 100%, 0 calc(100% - 36px));
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
    z-index: 5;
}

/* Team color slash across the top */
#top-slash {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--team-color, #e2012d), var(--team-color, #e2012d) 60%, var(--accent-color, #ffd700) 100%);
    transform: scaleX(0);
    transform-origin: left;
    z-index: 2;
}

/* Diagonal accent in corner */
#corner-slash {
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 60px;
    overflow: hidden;
    opacity: 0;
    z-index: 2;
}
#corner-slash::after {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 60px;
    height: 60px;
    background: var(--team-color, #e2012d);
    transform: rotate(45deg);
}

/* Scanline sweep effect */
#scanline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, var(--team-color, #e2012d) 20%, #ffffff 50%, var(--team-color, #e2012d) 80%, transparent 100%);
    opacity: 0;
    z-index: 20;
    filter: blur(0.5px);
    box-shadow: 0 0 12px var(--team-color, #e2012d), 0 0 4px #ffffff;
}

/* Glitch overlay */
.glitch-slice {
    position: absolute;
    left: 0;
    right: 0;
    height: 0;
    background: var(--team-color, #e2012d);
    opacity: 0;
    z-index: 15;
    mix-blend-mode: screen;
    pointer-events: none;
}

/* --- Content layout --- */
.content {
    padding: 40px 44px 36px;
    display: flex;
    gap: 32px;
    align-items: flex-start;
    position: relative;
    z-index: 1;
}

/* --- Hexagonal avatar --- */
#avatar-area {
    flex-shrink: 0;
    width: 130px;
    height: 130px;
    position: relative;
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
}
.avatar-hex {
    width: 130px;
    height: 130px;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    position: relative;
    background: var(--team-color, #e2012d);
    padding: 3px;
}
.avatar-hex-inner {
    width: 124px;
    height: 124px;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 3px;
    left: 3px;
}
#avatar-letter {
    font-family: 'Orbitron', sans-serif;
    font-size: 64px;
    font-weight: 900;
    color: var(--team-color, #e2012d);
    line-height: 1;
    letter-spacing: 0.02em;
    opacity: 0.85;
    text-shadow: 0 0 20px var(--team-color, #e2012d);
}
#avatar-glow {
    position: absolute;
    inset: -10px;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background: var(--team-color, #e2012d);
    opacity: 0;
    filter: blur(16px);
    z-index: -1;
}
#avatar-ring {
    position: absolute;
    inset: -8px;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    border: 1px solid var(--team-color, #e2012d);
    opacity: 0;
    animation: hexRotate 12s linear infinite;
}
@keyframes hexRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* --- Info block --- */
.info {
    flex: 1;
    min-width: 0;
}

#team-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 44px;
    font-weight: 400;
    color: var(--team-color, #e2012d);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#player-name {
    position: relative;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
}
#player-name-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: #ffffff;
    line-height: 0.92;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#player-name-glow {
    position: absolute;
    inset: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: 72px;
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--team-color, #e2012d);
    filter: blur(20px);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
}

#role-badge {
    display: inline-block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    background: var(--team-color, #e2012d);
    padding: 6px 28px 6px 20px;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
    margin-top: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateX(-30px);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Stats row (overview) --- */
#stats-row {
    display: flex;
    gap: 0;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
}

.stat-block {
    flex: 1;
    text-align: center;
    position: relative;
    padding: 12px 0;
    opacity: 0;
    transform: translateY(20px);
}
.stat-block + .stat-block::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: rgba(255,255,255,0.06);
}
.stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--accent-color, #ffd700);
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.stat-value.kills { color: #22c55e; }
.stat-value.deaths { color: #ef4444; }
.stat-value.assists { color: #60a5fa; }
.stat-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 36px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Detailed stats (step 2) --- */
#detail-stats {
    display: none;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
}
#detail-stats.active {
    display: block;
}
.detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    opacity: 0;
    transform: translateX(-20px);
}
.detail-row + .detail-row {
    border-top: 1px solid rgba(255,255,255,0.04);
}
.detail-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 36px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    width: 140px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.detail-bar {
    flex: 1;
    margin: 0 24px;
    height: 6px;
    background: rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
    clip-path: polygon(0 0, calc(100% - 2px) 0, 100% 100%, 0 100%);
}
.detail-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--team-color, #e2012d), var(--accent-color, #ffd700));
    width: 0;
    box-shadow: 0 0 8px var(--team-color, #e2012d);
}
.detail-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 40px;
    color: #ffffff;
    width: 100px;
    text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Background pattern --- */
#bg-pattern {
    position: absolute;
    inset: 0;
    opacity: 0;
    background-image:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 1px,
            transparent 1px,
            transparent 40px
        );
    z-index: 0;
    pointer-events: none;
}

/* --- Particle dots --- */
#particles {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}
.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--team-color, #e2012d);
    opacity: 0;
}
</style>
</head>
<body>

<div id="card">
    <!-- Angular frame -->
    <div id="frame">
        <div class="frame-edge top" id="frame-top"></div>
        <div class="frame-edge right" id="frame-right"></div>
        <div class="frame-edge bottom" id="frame-bottom"></div>
        <div class="frame-edge left" id="frame-left"></div>
        <div class="frame-corner tl" id="fc-tl"></div>
        <div class="frame-corner tr" id="fc-tr"></div>
        <div class="frame-corner bl" id="fc-bl"></div>
        <div class="frame-corner br" id="fc-br"></div>
    </div>

    <!-- Main panel -->
    <div id="main-panel">
        <div class="panel-inner-edge"></div>
        <div id="bg-pattern"></div>
        <div id="scanline"></div>
        <div class="glitch-slice" id="glitch1"></div>
        <div class="glitch-slice" id="glitch2"></div>
        <div id="particles"></div>
        <div id="corner-slash"></div>
        <div id="top-slash"></div>

        <div class="content">
            <!-- Avatar -->
            <div id="avatar-area">
                <div id="avatar-glow"></div>
                <div id="avatar-ring"></div>
                <div class="avatar-hex">
                    <div class="avatar-hex-inner">
                        <span id="avatar-letter"></span>
                    </div>
                </div>
            </div>

            <!-- Info -->
            <div class="info">
                <div id="team-tag"></div>
                <div id="player-name">
                    <span id="player-name-text"></span>
                    <span id="player-name-glow"></span>
                </div>
                <div id="role-badge"></div>

                <!-- Overview stats (step 1) -->
                <div id="stats-row">
                    <div class="stat-block" id="stat-k">
                        <div class="stat-value kills" id="val-k">0</div>
                        <div class="stat-label">Kills</div>
                    </div>
                    <div class="stat-block" id="stat-d">
                        <div class="stat-value deaths" id="val-d">0</div>
                        <div class="stat-label">Deaths</div>
                    </div>
                    <div class="stat-block" id="stat-a">
                        <div class="stat-value assists" id="val-a">0</div>
                        <div class="stat-label">Assists</div>
                    </div>
                    <div class="stat-block" id="stat-kda">
                        <div class="stat-value" id="val-kda">0.0</div>
                        <div class="stat-label">KDA</div>
                    </div>
                </div>

                <!-- Detail stats (step 2) -->
                <div id="detail-stats">
                    <div class="detail-row" id="dr-kills">
                        <span class="detail-label">Kills</span>
                        <div class="detail-bar"><div class="detail-bar-fill" id="bar-kills"></div></div>
                        <span class="detail-value" id="dv-kills">0</span>
                    </div>
                    <div class="detail-row" id="dr-deaths">
                        <span class="detail-label">Deaths</span>
                        <div class="detail-bar"><div class="detail-bar-fill" id="bar-deaths"></div></div>
                        <span class="detail-value" id="dv-deaths">0</span>
                    </div>
                    <div class="detail-row" id="dr-assists">
                        <span class="detail-label">Assists</span>
                        <div class="detail-bar"><div class="detail-bar-fill" id="bar-assists"></div></div>
                        <span class="detail-value" id="dv-assists">0</span>
                    </div>
                    <div class="detail-row" id="dr-winrate">
                        <span class="detail-label">Win Rate</span>
                        <div class="detail-bar"><div class="detail-bar-fill" id="bar-winrate"></div></div>
                        <span class="detail-value" id="dv-winrate">0%</span>
                    </div>
                    <div class="detail-row" id="dr-games">
                        <span class="detail-label">Games</span>
                        <div class="detail-bar"><div class="detail-bar-fill" id="bar-games"></div></div>
                        <span class="detail-value" id="dv-games">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var isVisible = false;
    var currentStep = 0;
    var playTL = null;
    var stopTL = null;
    var glitchTimeout = null;

    var data = {
        playerName: 'Faker', teamTag: 'T1', role: 'Mid Lane',
        kills: 12, deaths: 2, assists: 8,
        winRate: '73%', gamesPlayed: 142,
        teamColor: '#e2012d', accentColor: '#ffd700'
    };

    var els = {
        card: document.getElementById('card'),
        frame: document.getElementById('frame'),
        frameTop: document.getElementById('frame-top'),
        frameRight: document.getElementById('frame-right'),
        frameBottom: document.getElementById('frame-bottom'),
        frameLeft: document.getElementById('frame-left'),
        fcTL: document.getElementById('fc-tl'),
        fcTR: document.getElementById('fc-tr'),
        fcBL: document.getElementById('fc-bl'),
        fcBR: document.getElementById('fc-br'),
        mainPanel: document.getElementById('main-panel'),
        bgPattern: document.getElementById('bg-pattern'),
        scanline: document.getElementById('scanline'),
        glitch1: document.getElementById('glitch1'),
        glitch2: document.getElementById('glitch2'),
        particles: document.getElementById('particles'),
        cornerSlash: document.getElementById('corner-slash'),
        topSlash: document.getElementById('top-slash'),
        avatarArea: document.getElementById('avatar-area'),
        avatarGlow: document.getElementById('avatar-glow'),
        avatarRing: document.getElementById('avatar-ring'),
        avatarLetter: document.getElementById('avatar-letter'),
        teamTag: document.getElementById('team-tag'),
        playerName: document.getElementById('player-name'),
        playerNameText: document.getElementById('player-name-text'),
        playerNameGlow: document.getElementById('player-name-glow'),
        roleBadge: document.getElementById('role-badge'),
        statsRow: document.getElementById('stats-row'),
        detailStats: document.getElementById('detail-stats'),
        valK: document.getElementById('val-k'),
        valD: document.getElementById('val-d'),
        valA: document.getElementById('val-a'),
        valKda: document.getElementById('val-kda')
    };

    var statBlocks = document.querySelectorAll('.stat-block');
    var detailRows = document.querySelectorAll('.detail-row');

    // Create particle elements
    var particleEls = [];
    for (var i = 0; i < 20; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        els.particles.appendChild(p);
        particleEls.push(p);
    }

    gsap.defaults({ overwrite: 'auto' });

    function applyColors() {
        els.card.style.setProperty('--team-color', data.teamColor);
        els.card.style.setProperty('--accent-color', data.accentColor);
    }

    function populateData() {
        var d = data;
        els.teamTag.textContent = d.teamTag;
        els.playerNameText.textContent = d.playerName;
        els.playerNameGlow.textContent = d.playerName;
        els.roleBadge.textContent = d.role;
        els.avatarLetter.textContent = d.playerName.charAt(0);
        els.valK.textContent = d.kills;
        els.valD.textContent = d.deaths;
        els.valA.textContent = d.assists;
        var kda = d.deaths > 0 ? ((d.kills + d.assists) / d.deaths).toFixed(1) : (d.kills + d.assists).toFixed(1);
        els.valKda.textContent = kda;

        document.getElementById('dv-kills').textContent = d.kills;
        document.getElementById('dv-deaths').textContent = d.deaths;
        document.getElementById('dv-assists').textContent = d.assists;
        document.getElementById('dv-winrate').textContent = d.winRate;
        document.getElementById('dv-games').textContent = d.gamesPlayed;
    }

    function calcKDA() {
        return data.deaths > 0 ? ((data.kills + data.assists) / data.deaths).toFixed(1) : (data.kills + data.assists).toFixed(1);
    }

    function startGlitchLoop() {
        stopGlitchLoop();
        function doGlitch() {
            if (!isVisible) return;
            var h = 2 + Math.random() * 6;
            var y1 = Math.random() * 100;
            gsap.set(els.glitch1, { top: y1 + '%', height: h, opacity: 0.15 + Math.random() * 0.15, scaleX: 1 + Math.random() * 0.1 });
            gsap.set(els.glitch2, { top: (y1 + 10 + Math.random() * 20) + '%', height: h * 0.5, opacity: 0.1 + Math.random() * 0.1 });
            gsap.to([els.glitch1, els.glitch2], { opacity: 0, duration: 0.05 + Math.random() * 0.05, delay: 0.02 });
            glitchTimeout = setTimeout(doGlitch, 2000 + Math.random() * 4000);
        }
        glitchTimeout = setTimeout(doGlitch, 1500);
    }

    function stopGlitchLoop() {
        if (glitchTimeout) { clearTimeout(glitchTimeout); glitchTimeout = null; }
        gsap.set([els.glitch1, els.glitch2], { opacity: 0 });
    }

    function resetToHidden() {
        gsap.set(els.mainPanel, { opacity: 0, x: -80 });
        gsap.set(els.bgPattern, { opacity: 0 });
        gsap.set(els.topSlash, { scaleX: 0 });
        gsap.set(els.cornerSlash, { opacity: 0 });
        gsap.set(els.frame, { opacity: 0 });
        gsap.set(els.frameTop, { width: 0 });
        gsap.set(els.frameRight, { height: 0 });
        gsap.set(els.frameBottom, { width: 0 });
        gsap.set(els.frameLeft, { height: 0 });
        gsap.set([els.fcTL, els.fcTR, els.fcBL, els.fcBR], { opacity: 0 });
        gsap.set(els.avatarArea, { opacity: 0, scale: 0.3, rotation: -15 });
        gsap.set(els.avatarGlow, { opacity: 0 });
        gsap.set(els.avatarRing, { opacity: 0 });
        gsap.set(els.teamTag, { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
        gsap.set(els.playerName, { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
        gsap.set(els.playerNameGlow, { opacity: 0 });
        gsap.set(els.roleBadge, { opacity: 0, x: -30 });
        gsap.set(statBlocks, { opacity: 0, y: 20 });
        gsap.set(detailRows, { opacity: 0, x: -20 });
        gsap.set(document.querySelectorAll('.detail-bar-fill'), { width: 0 });
        gsap.set(els.scanline, { top: 0, opacity: 0 });
        gsap.set([els.glitch1, els.glitch2], { opacity: 0 });
        gsap.set(particleEls, { opacity: 0, y: 0 });
        els.statsRow.style.display = '';
        els.detailStats.classList.remove('active');
        els.valK.textContent = '0';
        els.valD.textContent = '0';
        els.valA.textContent = '0';
        els.valKda.textContent = '0.0';
    }

    // Initialize
    applyColors();
    populateData();
    resetToHidden();

    // --- CasparCG interface ---

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;
        currentStep = 0;

        playTL = gsap.timeline({
            onComplete: function() {
                playTL = null;
                startGlitchLoop();
            }
        });

        var tl = playTL;

        // 1. Scanline sweeps down
        tl.set(els.scanline, { opacity: 0.9 }, 0);
        tl.to(els.scanline, { top: '100%', duration: 0.3, ease: 'power2.in' }, 0);
        tl.to(els.scanline, { opacity: 0, duration: 0.08 }, 0.25);

        // 2. Panel slams in
        tl.to(els.mainPanel, { opacity: 1, x: 0, duration: 0.5, ease: 'back.out(1.2)' }, 0.03);

        // 3. Background pattern
        tl.to(els.bgPattern, { opacity: 1, duration: 0.4 }, 0.15);

        // 4. Top slash wipe
        tl.to(els.topSlash, { scaleX: 1, duration: 0.3, ease: 'power3.out' }, 0.1);

        // 5. Corner slash
        tl.to(els.cornerSlash, { opacity: 1, duration: 0.15, ease: 'power1.out' }, 0.25);

        // 6. Frame draws on clockwise
        tl.to(els.frame, { opacity: 1, duration: 0.01 }, 0.15);
        tl.to(els.frameTop, { width: '100%', duration: 0.25, ease: 'power2.out' }, 0.15);
        tl.to(els.frameRight, { height: '100%', duration: 0.25, ease: 'power2.out' }, 0.25);
        tl.to(els.frameBottom, { width: '100%', duration: 0.25, ease: 'power2.out' }, 0.35);
        tl.to(els.frameLeft, { height: '100%', duration: 0.25, ease: 'power2.out' }, 0.45);
        tl.to(els.fcTL, { opacity: 1, duration: 0.1 }, 0.15);
        tl.to(els.fcTR, { opacity: 1, duration: 0.1 }, 0.35);
        tl.to(els.fcBR, { opacity: 1, duration: 0.1 }, 0.55);
        tl.to(els.fcBL, { opacity: 1, duration: 0.1 }, 0.65);

        // 7. Avatar slams in
        tl.to(els.avatarArea, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(2)' }, 0.15);
        tl.to(els.avatarGlow, { opacity: 0.35, duration: 0.25, ease: 'power1.out' }, 0.35);
        tl.to(els.avatarGlow, { opacity: 0.12, duration: 0.6, ease: 'power1.inOut' }, 0.6);
        tl.to(els.avatarRing, { opacity: 0.3, duration: 0.3 }, 0.4);

        // 8. Team tag clip-path wipe
        tl.to(els.teamTag, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'power3.out' }, 0.2);

        // 9. Player name wipe reveal
        tl.to(els.playerName, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power3.out' }, 0.25);
        tl.to(els.playerNameGlow, { opacity: 0.15, duration: 0.3, ease: 'power1.out' }, 0.4);
        tl.to(els.playerNameGlow, { opacity: 0.06, duration: 0.6, ease: 'power1.inOut' }, 0.7);

        // 10. Role badge
        tl.to(els.roleBadge, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, 0.35);

        // 11. Stat blocks stagger
        statBlocks.forEach(function(block, i) {
            tl.to(block, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(1.3)' }, 0.5 + i * 0.08);
        });

        // Animated stat counting
        var countTargets = [
            { el: els.valK, val: data.kills, dec: 0 },
            { el: els.valD, val: data.deaths, dec: 0 },
            { el: els.valA, val: data.assists, dec: 0 },
            { el: els.valKda, val: parseFloat(calcKDA()), dec: 1 }
        ];
        countTargets.forEach(function(t, i) {
            var proxy = { v: 0 };
            tl.to(proxy, {
                v: t.val, duration: 0.7, ease: 'power2.out',
                onUpdate: function() { t.el.textContent = proxy.v.toFixed(t.dec); }
            }, 0.55 + i * 0.08);
        });

        // 12. Particles drift upward
        particleEls.forEach(function(p, i) {
            tl.to(p, {
                opacity: 0.15 + Math.random() * 0.2,
                y: -(20 + Math.random() * 50),
                duration: 1 + Math.random() * 0.8,
                ease: 'power1.out'
            }, 0.3 + i * 0.03);
        });
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }
        stopGlitchLoop();

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetToHidden();
            }
        });

        var tl = stopTL;

        // Quick scanline flash on exit
        tl.set(els.scanline, { top: '100%', opacity: 0 }, 0);
        tl.set(els.scanline, { top: 0, opacity: 0.7 }, 0.02);
        tl.to(els.scanline, { top: '100%', duration: 0.2, ease: 'power2.in' }, 0.02);
        tl.to(els.scanline, { opacity: 0, duration: 0.05 }, 0.18);

        // Particles fade
        tl.to(particleEls, { opacity: 0, duration: 0.15 }, 0);

        // Stats collapse
        tl.to(statBlocks, { opacity: 0, y: 12, duration: 0.15, stagger: 0.02 }, 0);
        tl.to(detailRows, { opacity: 0, x: -12, duration: 0.15, stagger: 0.02 }, 0);

        // Text and badges out
        tl.to(els.roleBadge, { opacity: 0, x: -20, duration: 0.15 }, 0.05);
        tl.to(els.playerName, { clipPath: 'inset(0 0 0 100%)', duration: 0.2, ease: 'power3.in' }, 0.08);
        tl.to(els.teamTag, { clipPath: 'inset(0 0 0 100%)', duration: 0.15, ease: 'power3.in' }, 0.1);

        // Avatar shrinks out
        tl.to(els.avatarGlow, { opacity: 0, duration: 0.1 }, 0.1);
        tl.to(els.avatarRing, { opacity: 0, duration: 0.1 }, 0.1);
        tl.to(els.avatarArea, { opacity: 0, scale: 0.5, rotation: 10, duration: 0.2, ease: 'power3.in' }, 0.1);

        // Frame dissolves
        tl.to([els.fcTL, els.fcTR, els.fcBR, els.fcBL], { opacity: 0, duration: 0.1 }, 0.15);
        tl.to([els.frameTop, els.frameRight, els.frameBottom, els.frameLeft], { opacity: 0, duration: 0.15 }, 0.15);

        // Top slash retracts
        tl.to(els.topSlash, { scaleX: 0, duration: 0.15, ease: 'power2.in' }, 0.15);
        tl.to(els.cornerSlash, { opacity: 0, duration: 0.1 }, 0.15);

        // Panel slides out
        tl.to(els.mainPanel, { opacity: 0, x: -60, duration: 0.3, ease: 'power3.in' }, 0.2);
        tl.to(els.frame, { opacity: 0, duration: 0.1 }, 0.25);
    };

    window.update = function(dataStr) {
        var incoming = (typeof dataStr === 'string') ? JSON.parse(dataStr) : dataStr;
        if (!incoming) return;

        var changed = false;
        for (var key in incoming) {
            if (incoming[key] != null && incoming[key] !== data[key]) {
                data[key] = incoming[key];
                changed = true;
            }
        }
        if (!changed) return;

        applyColors();
        populateData();

        if (isVisible) {
            var tl = gsap.timeline();
            // Flash top slash
            tl.to(els.topSlash, { opacity: 0.5, duration: 0.08 });
            tl.to(els.topSlash, { opacity: 1, duration: 0.3 });

            if (currentStep === 0) {
                var countTargets = [
                    { el: els.valK, val: data.kills, dec: 0 },
                    { el: els.valD, val: data.deaths, dec: 0 },
                    { el: els.valA, val: data.assists, dec: 0 },
                    { el: els.valKda, val: parseFloat(calcKDA()), dec: 1 }
                ];
                countTargets.forEach(function(t) {
                    var cur = parseFloat(t.el.textContent) || 0;
                    var proxy = { v: cur };
                    tl.to(proxy, {
                        v: t.val, duration: 0.4, ease: 'power1.out',
                        onUpdate: function() { t.el.textContent = proxy.v.toFixed(t.dec); }
                    }, 0);
                });
            }
        }
    };

    window.next = function() {
        if (!isVisible) return;

        if (currentStep === 0) {
            currentStep = 1;
            var tl = gsap.timeline();

            // Fade out overview stats
            tl.to(statBlocks, { opacity: 0, y: -12, duration: 0.2, stagger: 0.03 });
            tl.call(function() {
                els.statsRow.style.display = 'none';
                els.detailStats.classList.add('active');
            });

            var maxStat = Math.max(data.kills, data.deaths, data.assists, 1);
            var wrPct = parseInt(data.winRate) || 0;
            var barData = [
                { id: 'bar-kills', pct: (data.kills / maxStat) * 100 },
                { id: 'bar-deaths', pct: (data.deaths / maxStat) * 100 },
                { id: 'bar-assists', pct: (data.assists / maxStat) * 100 },
                { id: 'bar-winrate', pct: wrPct },
                { id: 'bar-games', pct: Math.min((data.gamesPlayed / 200) * 100, 100) }
            ];

            var rows = document.querySelectorAll('.detail-row');
            rows.forEach(function(row, i) {
                tl.to(row, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, 0.35 + i * 0.07);
                tl.to(document.getElementById(barData[i].id), {
                    width: barData[i].pct + '%', duration: 0.6, ease: 'power2.out'
                }, 0.4 + i * 0.07);
            });
        } else {
            currentStep = 0;
            var tl = gsap.timeline();

            tl.to(detailRows, { opacity: 0, x: -12, duration: 0.2, stagger: 0.02 });
            tl.call(function() {
                document.querySelectorAll('.detail-bar-fill').forEach(function(b) { b.style.width = '0'; });
                els.detailStats.classList.remove('active');
                els.statsRow.style.display = '';
            });

            statBlocks.forEach(function(block, i) {
                tl.to(block, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.2)' }, 0.3 + i * 0.06);
            });
        }
    };
})();
</script>
</body>
</html>
