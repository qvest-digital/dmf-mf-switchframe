<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

/* ---------- Main container ---------- */
#now-playing {
    position: absolute;
    bottom: 72px;
    right: 64px;
    width: 460px;
    font-family: 'DM Sans', sans-serif;
}

/* ---------- Card ---------- */
#card {
    background: rgba(10, 10, 18, 0.82);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    opacity: 0;
    transform: translateY(40px);
}

/* ---------- Top row: art + info ---------- */
#top-row {
    display: flex;
    gap: 18px;
    align-items: flex-start;
}

/* ---------- Album art placeholder ---------- */
#art-box {
    width: 88px;
    height: 88px;
    border-radius: 10px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: scale(0.7) rotate(-6deg);
}

#art-gradient {
    width: 100%;
    height: 100%;
    border-radius: 10px;
}

#art-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 32px;
    opacity: 0.5;
}

/* ---------- Track info ---------- */
#info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    min-width: 0;
    flex: 1;
}

#label-now {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent-color, #00e5ff);
    opacity: 0;
    transform: translateX(-10px);
}

#track-title {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transform: translateX(-14px);
}

#track-artist {
    font-size: 17px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateX(-10px);
}

#track-album {
    font-size: 14px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255, 255, 255, 0.35);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateX(-8px);
}

/* ---------- Visualizer ---------- */
#visualizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
    padding: 0 2px;
    opacity: 0;
}

.viz-bar {
    width: 3px;
    border-radius: 1.5px;
    background: var(--accent-color, #00e5ff);
    height: 4px;
    animation: none;
}

@keyframes vizPulse1 { 0%,100%{height:4px} 50%{height:26px} }
@keyframes vizPulse2 { 0%,100%{height:6px} 50%{height:22px} }
@keyframes vizPulse3 { 0%,100%{height:3px} 50%{height:28px} }
@keyframes vizPulse4 { 0%,100%{height:8px} 50%{height:18px} }
@keyframes vizPulse5 { 0%,100%{height:5px} 50%{height:24px} }

/* ---------- Progress section ---------- */
#progress-section {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
}

#time-elapsed, #time-duration {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.45);
    min-width: 36px;
}

#time-duration {
    text-align: right;
}

#progress-track {
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
}

#progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 35%;
    border-radius: 2px;
    transition: width 1s linear;
}

#progress-glow {
    position: absolute;
    top: -2px;
    right: -3px;
    width: 6px;
    height: 7px;
    border-radius: 50%;
    filter: blur(2px);
}

/* ---------- Up Next row ---------- */
#up-next-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
    transform: translateY(8px);
}

#up-next-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.3);
    white-space: nowrap;
}

#up-next-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    flex: 1;
}

#up-next-title {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#up-next-artist {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ---------- Glow edge ---------- */
#card-glow {
    position: absolute;
    bottom: -1px;
    left: 24px;
    right: 24px;
    height: 2px;
    border-radius: 1px;
    opacity: 0;
    filter: blur(3px);
}
</style>
</head>
<body>

<div id="now-playing">
    <div id="card">
        <div id="top-row">
            <div id="art-box">
                <div id="art-gradient"></div>
                <svg id="art-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
                    <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
                </svg>
            </div>
            <div id="info">
                <div id="label-now">NOW PLAYING</div>
                <div id="track-title">Midnight City</div>
                <div id="track-artist">M83</div>
                <div id="track-album">Hurry Up, We're Dreaming</div>
            </div>
        </div>
        <div id="visualizer"></div>
        <div id="progress-section">
            <span id="time-elapsed">1:24</span>
            <div id="progress-track">
                <div id="progress-fill"></div>
                <div id="progress-glow"></div>
            </div>
            <span id="time-duration">4:03</span>
        </div>
        <div id="up-next-row">
            <span id="up-next-label">UP NEXT</span>
            <div id="up-next-info">
                <div id="up-next-title">Intro</div>
                <div id="up-next-artist">The xx</div>
            </div>
        </div>
        <div id="card-glow"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    /* ---------- Element cache ---------- */
    var els = {
        card:         document.getElementById('card'),
        artBox:       document.getElementById('art-box'),
        artGradient:  document.getElementById('art-gradient'),
        labelNow:     document.getElementById('label-now'),
        trackTitle:   document.getElementById('track-title'),
        trackArtist:  document.getElementById('track-artist'),
        trackAlbum:   document.getElementById('track-album'),
        visualizer:   document.getElementById('visualizer'),
        progressSection: document.getElementById('progress-section'),
        progressFill: document.getElementById('progress-fill'),
        progressGlow: document.getElementById('progress-glow'),
        timeElapsed:  document.getElementById('time-elapsed'),
        timeDuration: document.getElementById('time-duration'),
        upNextRow:    document.getElementById('up-next-row'),
        upNextTitle:  document.getElementById('up-next-title'),
        upNextArtist: document.getElementById('up-next-artist'),
        cardGlow:     document.getElementById('card-glow')
    };

    /* ---------- State ---------- */
    var isVisible  = false;
    var playTL     = null;
    var stopTL     = null;
    var currentStep = 0;     // 0 = now-playing, 1 = up-next focus
    var accentColor = '#00e5ff';
    var artColor    = '#6c3ce0';
    var vizBars     = [];

    var data = {
        title: 'Midnight City',
        artist: 'M83',
        album: 'Hurry Up, We\'re Dreaming',
        elapsed: '1:24',
        duration: '4:03',
        artColor: '#6c3ce0',
        accentColor: '#00e5ff',
        nextTitle: 'Intro',
        nextArtist: 'The xx',
        nextAlbum: 'xx'
    };

    gsap.defaults({ overwrite: 'auto' });

    /* ---------- Build visualizer bars ---------- */
    var NUM_BARS = 10;
    var animations = ['vizPulse1','vizPulse2','vizPulse3','vizPulse4','vizPulse5'];
    for (var i = 0; i < NUM_BARS; i++) {
        var bar = document.createElement('div');
        bar.className = 'viz-bar';
        els.visualizer.appendChild(bar);
        vizBars.push(bar);
    }

    function startVizAnimation() {
        vizBars.forEach(function(bar, idx) {
            var anim  = animations[idx % animations.length];
            var dur   = 0.4 + Math.random() * 0.6;
            var delay = Math.random() * 0.5;
            bar.style.animation = anim + ' ' + dur + 's ease-in-out ' + delay + 's infinite';
        });
    }

    function stopVizAnimation() {
        vizBars.forEach(function(bar) {
            bar.style.animation = 'none';
            bar.style.height = '4px';
        });
    }

    /* ---------- Color helpers ---------- */
    function applyAccent(color) {
        accentColor = color;
        document.getElementById('now-playing').style.setProperty('--accent-color', color);
        els.progressFill.style.background = color;
        els.progressGlow.style.background = color;
        els.cardGlow.style.background = color;
        vizBars.forEach(function(bar) {
            bar.style.background = color;
        });
    }

    function applyArtColor(color) {
        artColor = color;
        var lighter = color;
        els.artGradient.style.background = 'linear-gradient(135deg, ' + color + ' 0%, ' + shiftHue(color, 40) + ' 100%)';
    }

    function shiftHue(hex, amount) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        r = Math.min(255, r + amount);
        g = Math.min(255, Math.max(0, g - amount / 2));
        b = Math.min(255, b + amount / 3);
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function computeProgress() {
        var e = parseTime(data.elapsed);
        var d = parseTime(data.duration);
        if (d <= 0) return 0;
        return Math.min(100, Math.max(0, (e / d) * 100));
    }

    function parseTime(str) {
        if (!str) return 0;
        var parts = str.split(':');
        if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        if (parts.length === 3) return parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + parseInt(parts[2], 10);
        return 0;
    }

    /* ---------- Apply initial data ---------- */
    function applyData() {
        els.trackTitle.textContent  = data.title;
        els.trackArtist.textContent = data.artist;
        els.trackAlbum.textContent  = data.album;
        els.timeElapsed.textContent = data.elapsed;
        els.timeDuration.textContent = data.duration;
        els.upNextTitle.textContent  = data.nextTitle;
        els.upNextArtist.textContent = data.nextArtist;
        els.progressFill.style.width = computeProgress() + '%';
        applyAccent(data.accentColor);
        applyArtColor(data.artColor);
    }

    applyData();

    /* ---------- Reset ---------- */
    function resetToHidden() {
        gsap.set(els.card, { opacity: 0, y: 40 });
        gsap.set(els.artBox, { opacity: 0, scale: 0.7, rotation: -6 });
        gsap.set(els.labelNow, { opacity: 0, x: -10 });
        gsap.set(els.trackTitle, { opacity: 0, x: -14 });
        gsap.set(els.trackArtist, { opacity: 0, x: -10 });
        gsap.set(els.trackAlbum, { opacity: 0, x: -8 });
        gsap.set(els.visualizer, { opacity: 0 });
        gsap.set(els.progressSection, { opacity: 0 });
        gsap.set(els.upNextRow, { opacity: 0, y: 8 });
        gsap.set(els.cardGlow, { opacity: 0 });
        stopVizAnimation();
    }

    resetToHidden();

    /* ===================================================================
       CasparCG Lifecycle
       =================================================================== */

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;
        currentStep = 0;

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Card slides up with glass effect
        playTL.to(els.card, {
            opacity: 1, y: 0,
            duration: 0.55,
            ease: 'power3.out'
        });

        // 2. Album art pops in with rotation
        playTL.to(els.artBox, {
            opacity: 1, scale: 1, rotation: 0,
            duration: 0.45,
            ease: 'back.out(1.7)'
        }, '-=0.35');

        // 3. "NOW PLAYING" label
        playTL.to(els.labelNow, {
            opacity: 1, x: 0,
            duration: 0.3,
            ease: 'power2.out'
        }, '-=0.3');

        // 4. Title slides in
        playTL.to(els.trackTitle, {
            opacity: 1, x: 0,
            duration: 0.35,
            ease: 'power2.out'
        }, '-=0.22');

        // 5. Artist
        playTL.to(els.trackArtist, {
            opacity: 1, x: 0,
            duration: 0.3,
            ease: 'power2.out'
        }, '-=0.2');

        // 6. Album
        playTL.to(els.trackAlbum, {
            opacity: 1, x: 0,
            duration: 0.25,
            ease: 'power2.out'
        }, '-=0.18');

        // 7. Visualizer fades in and starts animating
        playTL.to(els.visualizer, {
            opacity: 1,
            duration: 0.3,
            ease: 'power1.out',
            onComplete: startVizAnimation
        }, '-=0.18');

        // 8. Progress section
        playTL.to(els.progressSection, {
            opacity: 1,
            duration: 0.3,
            ease: 'power1.out'
        }, '-=0.2');

        // 9. Up next row
        playTL.to(els.upNextRow, {
            opacity: 1, y: 0,
            duration: 0.3,
            ease: 'power2.out'
        }, '-=0.15');

        // 10. Bottom glow
        playTL.to(els.cardGlow, {
            opacity: 0.6,
            duration: 0.5,
            ease: 'power1.out'
        }, '-=0.3');
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                stopVizAnimation();
                resetToHidden();
            }
        });

        // Reverse order
        stopTL.to(els.cardGlow, { opacity: 0, duration: 0.15 });
        stopTL.to(els.upNextRow, { opacity: 0, y: 8, duration: 0.15, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.progressSection, { opacity: 0, duration: 0.15, ease: 'power1.in' }, '-=0.1');
        stopTL.to(els.visualizer, { opacity: 0, duration: 0.15, ease: 'power1.in' }, '-=0.1');
        stopTL.to(els.trackAlbum, { opacity: 0, x: -8, duration: 0.12, ease: 'power2.in' }, '-=0.08');
        stopTL.to(els.trackArtist, { opacity: 0, x: -10, duration: 0.15, ease: 'power2.in' }, '-=0.08');
        stopTL.to(els.trackTitle, { opacity: 0, x: -14, duration: 0.18, ease: 'power2.in' }, '-=0.08');
        stopTL.to(els.labelNow, { opacity: 0, x: -10, duration: 0.12, ease: 'power2.in' }, '-=0.08');
        stopTL.to(els.artBox, { opacity: 0, scale: 0.7, rotation: -6, duration: 0.25, ease: 'power2.in' }, '-=0.1');
        stopTL.to(els.card, { opacity: 0, y: 40, duration: 0.4, ease: 'power3.in' }, '-=0.15');
    };

    window.update = function(input) {
        var d = (typeof input === 'string') ? JSON.parse(input) : input;
        if (!d) return;

        if (d.title != null)       { data.title = d.title; els.trackTitle.textContent = d.title; }
        if (d.artist != null)      { data.artist = d.artist; els.trackArtist.textContent = d.artist; }
        if (d.album != null)       { data.album = d.album; els.trackAlbum.textContent = d.album; }
        if (d.elapsed != null)     { data.elapsed = d.elapsed; els.timeElapsed.textContent = d.elapsed; }
        if (d.duration != null)    { data.duration = d.duration; els.timeDuration.textContent = d.duration; }
        if (d.nextTitle != null)   { data.nextTitle = d.nextTitle; els.upNextTitle.textContent = d.nextTitle; }
        if (d.nextArtist != null)  { data.nextArtist = d.nextArtist; els.upNextArtist.textContent = d.nextArtist; }
        if (d.accentColor != null) { data.accentColor = d.accentColor; applyAccent(d.accentColor); }
        if (d.artColor != null)    { data.artColor = d.artColor; applyArtColor(d.artColor); }

        // Update progress bar
        els.progressFill.style.width = computeProgress() + '%';

        // Highlight flash if visible
        if (isVisible) {
            gsap.timeline()
                .to(els.card, {
                    boxShadow: '0 8px 40px rgba(0,0,0,0.6), 0 0 20px ' + accentColor + '33',
                    duration: 0.15
                })
                .to(els.card, {
                    boxShadow: '0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset',
                    duration: 0.4
                });
        }
    };

    window.next = function() {
        if (!isVisible) return;

        // Swap current track with up-next data, animate the transition
        var tl = gsap.timeline();

        // Slide current info out
        tl.to([els.trackTitle, els.trackArtist, els.trackAlbum], {
            opacity: 0, x: -20,
            duration: 0.25,
            ease: 'power2.in',
            stagger: 0.04
        });

        // Swap data
        tl.call(function() {
            data.title  = data.nextTitle;
            data.artist = data.nextArtist;
            data.album  = data.nextAlbum || '';
            data.elapsed = '0:00';

            els.trackTitle.textContent  = data.title;
            els.trackArtist.textContent = data.artist;
            els.trackAlbum.textContent  = data.album;
            els.timeElapsed.textContent = '0:00';
            els.progressFill.style.width = '0%';

            gsap.set([els.trackTitle, els.trackArtist, els.trackAlbum], { x: 20 });
        });

        // Slide new info in
        tl.to([els.trackTitle, els.trackArtist, els.trackAlbum], {
            opacity: 1, x: 0,
            duration: 0.3,
            ease: 'power2.out',
            stagger: 0.05
        });

        // Art color pulse
        tl.to(els.artBox, {
            scale: 1.06,
            duration: 0.15,
            ease: 'power2.out'
        }, '-=0.3');
        tl.to(els.artBox, {
            scale: 1,
            duration: 0.3,
            ease: 'elastic.out(1, 0.5)'
        });
    };

})();
</script>
</body>
</html>
