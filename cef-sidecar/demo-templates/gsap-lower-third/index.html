<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GSAP Lower Third</title>
<style>
  /* ---------- Reset & transparent background for CEF compositing ---------- */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- Lower third container ---------- */
  #lower-third {
    position: absolute;
    bottom: 100px;
    left: 80px;
    display: flex;
    align-items: stretch;
    pointer-events: none;
  }

  /* ---------- Accent bar (left edge) ---------- */
  #accent-bar {
    width: 6px;
    background: #00a0ff;
    border-radius: 3px;
    flex-shrink: 0;
    transform-origin: bottom center;
    transform: scaleY(0);
    opacity: 0;
  }

  /* ---------- Background panel ---------- */
  #panel {
    background: rgba(10, 10, 15, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    padding: 30px 48px 28px 36px;
    margin-left: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 600px;
    clip-path: inset(0 100% 0 0);
    opacity: 0;
  }

  /* ---------- Name ---------- */
  #name {
    font-size: 64px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(14px);
  }

  /* ---------- Title ---------- */
  #title {
    font-size: 42px;
    font-weight: 400;
    color: rgba(220, 220, 230, 0.9);
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    white-space: nowrap;
    margin-top: 6px;
    opacity: 0;
    transform: translateY(14px);
  }
</style>
</head>
<body>

<!-- Lower third DOM structure -->
<div id="lower-third">
  <div id="accent-bar"></div>
  <div id="panel">
    <div id="name"></div>
    <div id="title"></div>
  </div>
</div>

<!-- GSAP animation library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
(function() {
  'use strict';

  // -------------------------------------------------------------------------
  // Element references
  // -------------------------------------------------------------------------
  var accentBar = document.getElementById('accent-bar');
  var panel     = document.getElementById('panel');
  var nameEl    = document.getElementById('name');
  var titleEl   = document.getElementById('title');

  // -------------------------------------------------------------------------
  // State
  // -------------------------------------------------------------------------
  var isVisible   = false;
  var playTL      = null;   // play timeline (kept for kill on stop)
  var stopTL      = null;   // stop timeline

  // -------------------------------------------------------------------------
  // GSAP defaults
  // -------------------------------------------------------------------------
  gsap.defaults({ overwrite: 'auto' });

  // -------------------------------------------------------------------------
  // play() -- CasparCG entry point: animate the lower third on screen
  // -------------------------------------------------------------------------
  window.play = function() {
    // Kill any running stop animation so we don't conflict
    if (stopTL) { stopTL.kill(); stopTL = null; }

    isVisible = true;

    playTL = gsap.timeline({
      onComplete: function() { playTL = null; }
    });

    // 1. Accent bar scales in from zero height
    playTL.to(accentBar, {
      scaleY: 1,
      opacity: 1,
      duration: 0.3,
      ease: 'power2.out'
    });

    // 2. Background panel slides in from the left (clip-path reveal)
    playTL.to(panel, {
      clipPath: 'inset(0 0% 0 0)',
      opacity: 1,
      duration: 0.4,
      ease: 'power3.out'
    }, '-=0.15');

    // 3. Name fades in and slides up
    playTL.to(nameEl, {
      opacity: 1,
      y: 0,
      duration: 0.3,
      ease: 'power2.out'
    }, '-=0.2');

    // 4. Title fades in and slides up
    playTL.to(titleEl, {
      opacity: 1,
      y: 0,
      duration: 0.25,
      ease: 'power2.out'
    }, '-=0.15');
  };

  // -------------------------------------------------------------------------
  // stop() -- CasparCG entry point: animate the lower third off screen
  // -------------------------------------------------------------------------
  window.stop = function() {
    // Kill any running play animation
    if (playTL) { playTL.kill(); playTL = null; }

    stopTL = gsap.timeline({
      onComplete: function() {
        isVisible = false;
        stopTL = null;
        // Reset transforms so the next play() starts clean
        gsap.set(nameEl,    { opacity: 0, y: 12 });
        gsap.set(titleEl,   { opacity: 0, y: 12 });
        gsap.set(panel,     { clipPath: 'inset(0 100% 0 0)', opacity: 0 });
        gsap.set(accentBar, { scaleY: 0, opacity: 0 });
      }
    });

    // 1. Title fades and slides down
    stopTL.to(titleEl, {
      opacity: 0,
      y: 12,
      duration: 0.2,
      ease: 'power2.in'
    });

    // 2. Name fades and slides down
    stopTL.to(nameEl, {
      opacity: 0,
      y: 12,
      duration: 0.2,
      ease: 'power2.in'
    }, '-=0.1');

    // 3. Background panel slides out to the left
    stopTL.to(panel, {
      clipPath: 'inset(0 100% 0 0)',
      opacity: 0,
      duration: 0.3,
      ease: 'power3.in'
    }, '-=0.1');

    // 4. Accent bar scales out
    stopTL.to(accentBar, {
      scaleY: 0,
      opacity: 0,
      duration: 0.2,
      ease: 'power2.in'
    }, '-=0.1');
  };

  // -------------------------------------------------------------------------
  // update(data) -- CasparCG entry point: update text fields and accent color
  //
  //   data is a JSON string: {"name":"...","title":"...","color":"#rrggbb"}
  //   All fields are optional; only provided fields are updated.
  // -------------------------------------------------------------------------
  window.update = function(data) {
    var parsed;
    if (typeof data === 'string') {
      try { parsed = JSON.parse(data); } catch (e) { return; }
    } else {
      parsed = data;
    }
    if (!parsed) return;

    // Update text content
    if (parsed.name  != null) nameEl.textContent  = parsed.name;
    if (parsed.title != null) titleEl.textContent  = parsed.title;

    // Update accent bar color
    if (parsed.color != null) {
      gsap.to(accentBar, {
        backgroundColor: parsed.color,
        duration: 0.3,
        ease: 'power1.inOut'
      });
    }

    // If currently on screen, play a brief highlight pulse so the operator
    // sees the data changed.
    if (isVisible) {
      gsap.timeline()
        .to(panel, {
          boxShadow: '0 2px 30px rgba(0, 160, 255, 0.4)',
          duration: 0.15,
          ease: 'power1.in'
        })
        .to(panel, {
          boxShadow: '0 2px 20px rgba(0, 0, 0, 0.5)',
          duration: 0.4,
          ease: 'power1.out'
        });
    }
  };

  // -------------------------------------------------------------------------
  // next() -- CasparCG entry point: no-op for single-step template
  // -------------------------------------------------------------------------
  window.next = function() {
    // Single-step template -- nothing to advance.
  };

})();
</script>
</body>
</html>
