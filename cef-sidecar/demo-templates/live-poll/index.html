<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Live Poll (OGraf)</title>
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

#poll-container {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 960px;
    opacity: 0;
}

/* Glass panel */
#poll-panel {
    background: rgba(10, 10, 20, 0.90);
    backdrop-filter: blur(28px) saturate(1.3);
    -webkit-backdrop-filter: blur(28px) saturate(1.3);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
    transform: translateY(40px) scale(0.95);
    opacity: 0;
}

/* Top accent line */
#top-accent {
    height: 3px;
    width: 0;
    opacity: 0;
}

/* Header */
#poll-header {
    padding: 32px 40px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(-10px);
}

#poll-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 8px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#poll-badge-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    animation: pulse-dot 1.5s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

#vote-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

#vote-count-num {
    color: rgba(255, 255, 255, 0.9);
    font-weight: 700;
}

/* Question */
#question {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.25;
    padding: 16px 40px 28px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    opacity: 0;
    transform: translateX(-20px);
}

/* Options */
#options {
    padding: 0 40px 36px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.option {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-30px);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: border-color 0.3s;
}

.option.winner {
    border-color: rgba(255, 255, 255, 0.15);
}

.option-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0;
    border-radius: 14px;
    opacity: 0.2;
    transition: box-shadow 0.4s;
}

.option.winner .option-fill {
    opacity: 0.35;
    box-shadow: 0 0 30px rgba(255,255,255,0.08) inset;
}

.option-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
}

.option-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.option-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    width: 52px;
    height: 52px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    opacity: 0.9;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.option-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.option-right {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
}

.option-percent {
    font-family: 'JetBrains Mono', monospace;
    font-size: 48px;
    font-weight: 700;
    color: #ffffff;
    min-width: 80px;
    text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.option-percent-sign {
    font-size: 36px;
    opacity: 0.7;
    font-weight: 500;
}

/* Winner crown glow */
.option.winner .option-letter {
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

/* Bottom divider */
#bottom-divider {
    height: 1px;
    margin: 0 40px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    opacity: 0;
}
</style>
</head>
<body>

<div id="poll-container">
    <div id="poll-panel">
        <div id="top-accent"></div>
        <div id="poll-header">
            <div id="poll-badge">
                <div id="poll-badge-dot"></div>
                LIVE POLL
            </div>
            <div id="vote-count"><span id="vote-count-num">0</span> votes</div>
        </div>
        <div id="question">What topic should we cover next?</div>
        <div id="options">
            <div class="option" id="opt-0">
                <div class="option-fill" id="fill-0"></div>
                <div class="option-content">
                    <div class="option-left">
                        <div class="option-letter" id="letter-0">A</div>
                        <div class="option-label" id="label-0">Web Development</div>
                    </div>
                    <div class="option-right" id="right-0">
                        <div class="option-percent"><span id="pct-0">0</span><span class="option-percent-sign">%</span></div>
                    </div>
                </div>
            </div>
            <div class="option" id="opt-1">
                <div class="option-fill" id="fill-1"></div>
                <div class="option-content">
                    <div class="option-left">
                        <div class="option-letter" id="letter-1">B</div>
                        <div class="option-label" id="label-1">Game Design</div>
                    </div>
                    <div class="option-right" id="right-1">
                        <div class="option-percent"><span id="pct-1">0</span><span class="option-percent-sign">%</span></div>
                    </div>
                </div>
            </div>
            <div class="option" id="opt-2">
                <div class="option-fill" id="fill-2"></div>
                <div class="option-content">
                    <div class="option-left">
                        <div class="option-letter" id="letter-2">C</div>
                        <div class="option-label" id="label-2">Machine Learning</div>
                    </div>
                    <div class="option-right" id="right-2">
                        <div class="option-percent"><span id="pct-2">0</span><span class="option-percent-sign">%</span></div>
                    </div>
                </div>
            </div>
            <div class="option" id="opt-3">
                <div class="option-fill" id="fill-3"></div>
                <div class="option-content">
                    <div class="option-left">
                        <div class="option-letter" id="letter-3">D</div>
                        <div class="option-label" id="label-3">DevOps</div>
                    </div>
                    <div class="option-right" id="right-3">
                        <div class="option-percent"><span id="pct-3">0</span><span class="option-percent-sign">%</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var LETTERS = ['A', 'B', 'C', 'D'];

    var els = {
        container: document.getElementById('poll-container'),
        panel:     document.getElementById('poll-panel'),
        topAccent: document.getElementById('top-accent'),
        header:    document.getElementById('poll-header'),
        badge:     document.getElementById('poll-badge'),
        voteCount: document.getElementById('vote-count-num'),
        question:  document.getElementById('question')
    };

    // Per-option elements
    var optEls = [];
    for (var i = 0; i < 4; i++) {
        optEls.push({
            row:    document.getElementById('opt-' + i),
            fill:   document.getElementById('fill-' + i),
            letter: document.getElementById('letter-' + i),
            label:  document.getElementById('label-' + i),
            pct:    document.getElementById('pct-' + i),
            right:  document.getElementById('right-' + i)
        });
    }

    var isVisible = false;
    var showingResults = false;
    var playTL = null;
    var stopTL = null;

    var config = {
        question: 'What topic should we cover next?',
        options: [
            { label: 'Web Development',  percent: 42, color: '#6366f1' },
            { label: 'Game Design',      percent: 28, color: '#ec4899' },
            { label: 'Machine Learning', percent: 18, color: '#10b981' },
            { label: 'DevOps',           percent: 12, color: '#f59e0b' }
        ],
        totalVotes: 1247,
        accentColor: '#6366f1',
        showResults: false
    };

    gsap.defaults({ overwrite: 'auto' });

    function applyConfig() {
        els.question.textContent = config.question;
        els.topAccent.style.background = 'linear-gradient(90deg, ' + config.accentColor + ', ' + config.accentColor + '44)';
        els.badge.style.background = config.accentColor + '33';
        els.badge.style.border = '1px solid ' + config.accentColor + '55';

        for (var i = 0; i < 4; i++) {
            var opt = config.options[i];
            if (!opt) continue;
            optEls[i].label.textContent = opt.label;
            optEls[i].letter.style.background = opt.color + '33';
            optEls[i].letter.style.border = '1px solid ' + opt.color + '55';
            optEls[i].fill.style.background = opt.color;
        }
    }

    function findWinnerIndex() {
        var maxPct = -1;
        var winner = 0;
        for (var i = 0; i < config.options.length; i++) {
            if (config.options[i].percent > maxPct) {
                maxPct = config.options[i].percent;
                winner = i;
            }
        }
        return winner;
    }

    function animateResults() {
        showingResults = true;
        var winnerIdx = findWinnerIndex();
        var tl = gsap.timeline();

        // Animate vote count
        var countObj = { val: 0 };
        tl.to(countObj, {
            val: config.totalVotes,
            duration: 0.8,
            ease: 'power2.out',
            onUpdate: function() {
                els.voteCount.textContent = Math.round(countObj.val).toLocaleString();
            }
        }, 0);

        for (var i = 0; i < 4; i++) {
            (function(idx) {
                var opt = config.options[idx];
                if (!opt) return;
                var oe = optEls[idx];
                var isWinner = idx === winnerIdx;

                // Show percentage text
                tl.to(oe.right, {
                    opacity: 1,
                    duration: 0.25,
                    ease: 'power2.out'
                }, 0.1 + idx * 0.08);

                // Animate fill bar
                tl.to(oe.fill, {
                    width: opt.percent + '%',
                    duration: 0.8,
                    ease: 'power2.out'
                }, 0.15 + idx * 0.1);

                // Count up percentage
                var pctObj = { val: 0 };
                tl.to(pctObj, {
                    val: opt.percent,
                    duration: 0.8,
                    ease: 'power2.out',
                    onUpdate: function() {
                        oe.pct.textContent = Math.round(pctObj.val);
                    }
                }, 0.15 + idx * 0.1);

                // Winner effects
                if (isWinner) {
                    tl.call(function() {
                        oe.row.classList.add('winner');
                    }, null, 0.7);

                    // Winner glow pulse
                    tl.to(oe.row, {
                        boxShadow: '0 0 24px ' + opt.color + '33, inset 0 0 30px ' + opt.color + '11',
                        duration: 0.4,
                        ease: 'power2.out'
                    }, 0.8);

                    // Scale bump on winner letter
                    tl.fromTo(oe.letter, { scale: 1 }, {
                        scale: 1.15,
                        duration: 0.15,
                        ease: 'power2.out',
                        yoyo: true,
                        repeat: 1
                    }, 0.9);
                }
            })(i);
        }

        return tl;
    }

    function hideResults() {
        showingResults = false;
        var tl = gsap.timeline();

        for (var i = 0; i < 4; i++) {
            var oe = optEls[i];
            oe.row.classList.remove('winner');

            tl.to(oe.right, { opacity: 0, duration: 0.15 }, 0);
            tl.to(oe.fill, { width: 0, duration: 0.3, ease: 'power2.in' }, 0);
            tl.to(oe.row, { boxShadow: 'none', duration: 0.2 }, 0);
        }

        // Reset vote count
        tl.call(function() {
            els.voteCount.textContent = '0';
        }, null, 0.2);

        return tl;
    }

    function resetState() {
        showingResults = false;
        gsap.set(els.container, { opacity: 0 });
        gsap.set(els.panel, { opacity: 0, y: 40, scale: 0.95 });
        gsap.set(els.topAccent, { width: 0, opacity: 0 });
        gsap.set(els.header, { opacity: 0, y: -10 });
        gsap.set(els.question, { opacity: 0, x: -20 });
        els.voteCount.textContent = '0';

        for (var i = 0; i < 4; i++) {
            var oe = optEls[i];
            gsap.set(oe.row, { opacity: 0, x: -30, boxShadow: 'none' });
            gsap.set(oe.fill, { width: 0 });
            gsap.set(oe.right, { opacity: 0 });
            gsap.set(oe.pct, { textContent: '0' });
            oe.row.classList.remove('winner');
        }
    }

    applyConfig();
    resetState();

    // -- CasparCG lifecycle --

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;

        applyConfig();

        playTL = gsap.timeline({ onComplete: function() { playTL = null; } });

        // 1. Container + panel entrance
        playTL.to(els.container, { opacity: 1, duration: 0.01 });
        playTL.to(els.panel, {
            opacity: 1, y: 0, scale: 1,
            duration: 0.5,
            ease: 'back.out(1.3)'
        });

        // 2. Top accent line draws
        playTL.to(els.topAccent, {
            width: '100%', opacity: 1,
            duration: 0.35,
            ease: 'power3.out'
        }, '-=0.3');

        // 3. Header drops in
        playTL.to(els.header, {
            opacity: 1, y: 0,
            duration: 0.3,
            ease: 'power2.out'
        }, '-=0.2');

        // 4. Question slides in
        playTL.to(els.question, {
            opacity: 1, x: 0,
            duration: 0.35,
            ease: 'power2.out'
        }, '-=0.15');

        // 5. Options stagger in from left
        for (var i = 0; i < 4; i++) {
            playTL.to(optEls[i].row, {
                opacity: 1, x: 0,
                duration: 0.3,
                ease: 'power2.out'
            }, '-=' + (i === 0 ? '0.1' : '0.2'));
        }

        // 6. If showResults is true in config, reveal them after entrance
        if (config.showResults) {
            playTL.add(animateResults(), '+=0.15');
        }
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetState();
            }
        });

        // 1. Options stagger out (reverse order)
        for (var i = 3; i >= 0; i--) {
            stopTL.to(optEls[i].row, {
                opacity: 0, x: -20,
                duration: 0.15,
                ease: 'power2.in'
            }, i === 3 ? 0 : '-=0.1');
            stopTL.to(optEls[i].fill, { width: 0, duration: 0.15 }, '<');
            stopTL.to(optEls[i].right, { opacity: 0, duration: 0.1 }, '<');
        }

        // 2. Question out
        stopTL.to(els.question, { opacity: 0, x: -15, duration: 0.15, ease: 'power2.in' }, '-=0.1');

        // 3. Header out
        stopTL.to(els.header, { opacity: 0, y: -8, duration: 0.12, ease: 'power2.in' }, '-=0.08');

        // 4. Accent retracts
        stopTL.to(els.topAccent, { width: 0, opacity: 0, duration: 0.2, ease: 'power2.in' }, '-=0.08');

        // 5. Panel drops out
        stopTL.to(els.panel, {
            opacity: 0, y: 30, scale: 0.96,
            duration: 0.3,
            ease: 'power3.in'
        }, '-=0.1');

        stopTL.to(els.container, { opacity: 0, duration: 0.01 });
    };

    window.update = function(data) {
        var d = (typeof data === 'string') ? JSON.parse(data) : data;
        if (!d) return;

        if (d.question != null) {
            config.question = d.question;
            if (isVisible) {
                gsap.to(els.question, {
                    opacity: 0, x: -10, duration: 0.12,
                    onComplete: function() {
                        els.question.textContent = config.question;
                        gsap.to(els.question, { opacity: 1, x: 0, duration: 0.2 });
                    }
                });
            } else {
                els.question.textContent = config.question;
            }
        }

        if (d.totalVotes != null) config.totalVotes = d.totalVotes;
        if (d.accentColor != null) {
            config.accentColor = d.accentColor;
            els.topAccent.style.background = 'linear-gradient(90deg, ' + d.accentColor + ', ' + d.accentColor + '44)';
            els.badge.style.background = d.accentColor + '33';
            els.badge.style.border = '1px solid ' + d.accentColor + '55';
        }

        // Update individual options from flat schema
        var optionUpdated = false;
        for (var i = 0; i < 4; i++) {
            var n = i + 1;
            var labelKey = 'option' + n + 'Label';
            var pctKey   = 'option' + n + 'Percent';
            var colorKey = 'option' + n + 'Color';

            if (d[labelKey] != null) {
                config.options[i].label = d[labelKey];
                optEls[i].label.textContent = d[labelKey];
                optionUpdated = true;
            }
            if (d[pctKey] != null) {
                config.options[i].percent = d[pctKey];
                optionUpdated = true;
            }
            if (d[colorKey] != null) {
                config.options[i].color = d[colorKey];
                optEls[i].letter.style.background = d[colorKey] + '33';
                optEls[i].letter.style.border = '1px solid ' + d[colorKey] + '55';
                optEls[i].fill.style.background = d[colorKey];
            }
        }

        // If results are showing and percentages changed, re-animate
        if (isVisible && showingResults && optionUpdated) {
            var winnerIdx = findWinnerIndex();
            for (var j = 0; j < 4; j++) {
                (function(idx) {
                    var opt = config.options[idx];
                    var oe = optEls[idx];

                    // Animate bar fill
                    gsap.to(oe.fill, {
                        width: opt.percent + '%',
                        duration: 0.6,
                        ease: 'power2.out'
                    });

                    // Count up
                    var pctObj = { val: parseFloat(oe.pct.textContent) || 0 };
                    gsap.to(pctObj, {
                        val: opt.percent,
                        duration: 0.6,
                        ease: 'power2.out',
                        onUpdate: function() {
                            oe.pct.textContent = Math.round(pctObj.val);
                        }
                    });

                    // Winner class
                    if (idx === winnerIdx) {
                        oe.row.classList.add('winner');
                        gsap.to(oe.row, {
                            boxShadow: '0 0 24px ' + opt.color + '33, inset 0 0 30px ' + opt.color + '11',
                            duration: 0.4
                        });
                    } else {
                        oe.row.classList.remove('winner');
                        gsap.to(oe.row, { boxShadow: 'none', duration: 0.3 });
                    }
                })(j);
            }

            // Update total vote count
            var countObj = { val: parseFloat(els.voteCount.textContent.replace(/,/g, '')) || 0 };
            gsap.to(countObj, {
                val: config.totalVotes,
                duration: 0.6,
                ease: 'power2.out',
                onUpdate: function() {
                    els.voteCount.textContent = Math.round(countObj.val).toLocaleString();
                }
            });
        }

        if (d.showResults != null) {
            config.showResults = d.showResults;
            if (isVisible) {
                if (d.showResults && !showingResults) {
                    animateResults();
                } else if (!d.showResults && showingResults) {
                    hideResults();
                }
            }
        }
    };

    window.next = function() {
        if (!isVisible) return;

        // Toggle between showing options and showing results
        if (showingResults) {
            hideResults();
        } else {
            animateResults();
        }
    };
})();
</script>
</body>
</html>
