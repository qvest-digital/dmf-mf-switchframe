<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Donation Goal (OGraf)</title>
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<donation-goal></donation-goal>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
class DonationGoal extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });

    this._isVisible = false;
    this._currentStep = 0;
    this._playTL = null;
    this._stopTL = null;
    this._celebrationTimer = null;
    this._displayedAmount = 0;
    this._data = {
      title: 'Building Hope Foundation',
      subtitle: '2026 Annual Fundraiser',
      current: 34750, goal: 50000,
      currency: '$',
      recentDonor: 'Sarah M.', recentAmount: 250,
      accentColor: '#10b981',
      milestone1: 10000, milestone2: 25000, milestone3: 50000,
    };

    this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
          position: absolute;
          bottom: 70px;
          left: 50%;
          transform: translateX(-50%);
          pointer-events: none;
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        .widget {
          width: 820px;
          position: relative;
        }

        /* --- Main panel --- */
        .panel {
          background: rgba(8, 10, 18, 0.93);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.06);
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 8px 40px rgba(0,0,0,0.5),
                      inset 0 1px 0 rgba(255,255,255,0.04);
          opacity: 0;
          transform: translateY(30px);
        }

        /* Accent top glow */
        .panel-glow {
          position: absolute;
          top: -1px;
          left: 20%;
          right: 20%;
          height: 2px;
          background: var(--accent, #10b981);
          border-radius: 1px;
          filter: blur(4px);
          opacity: 0;
        }
        .panel-top-line {
          height: 2px;
          background: linear-gradient(90deg, transparent, var(--accent, #10b981), transparent);
          transform: scaleX(0);
        }

        /* --- Header area --- */
        .header {
          padding: 22px 28px 0;
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
        }
        .header-left {
          opacity: 0;
          transform: translateX(-15px);
        }
        .campaign-title {
          font-size: 20px;
          font-weight: 800;
          color: #ffffff;
          line-height: 1.2;
        }
        .campaign-subtitle {
          font-size: 12px;
          font-weight: 500;
          color: rgba(255,255,255,0.4);
          margin-top: 3px;
          letter-spacing: 0.05em;
        }
        .amount-display {
          text-align: right;
          opacity: 0;
          transform: translateX(15px);
        }
        .amount-current {
          font-family: 'JetBrains Mono', monospace;
          font-size: 32px;
          font-weight: 700;
          color: var(--accent, #10b981);
          line-height: 1;
        }
        .amount-goal {
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          font-weight: 500;
          color: rgba(255,255,255,0.35);
          margin-top: 4px;
        }

        /* --- Progress bar area --- */
        .progress-area {
          padding: 18px 28px 6px;
          position: relative;
        }
        .bar-track {
          height: 24px;
          background: rgba(255,255,255,0.04);
          border-radius: 12px;
          overflow: visible;
          position: relative;
          border: 1px solid rgba(255,255,255,0.04);
        }
        .bar-fill-container {
          position: absolute;
          top: 0;
          left: 0;
          bottom: 0;
          width: 0;
          overflow: hidden;
          border-radius: 12px;
        }
        .bar-fill {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(90deg, var(--accent, #10b981), var(--accent-light, #34d399));
          border-radius: 12px;
        }
        .bar-fill-shimmer {
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
          animation: shimmer 2.5s ease-in-out infinite;
        }
        @keyframes shimmer {
          0% { transform: translateX(0); }
          100% { transform: translateX(200%); }
        }
        .bar-glow {
          position: absolute;
          top: -4px;
          bottom: -4px;
          left: 0;
          width: 0;
          background: var(--accent, #10b981);
          border-radius: 16px;
          filter: blur(10px);
          opacity: 0;
        }
        .bar-tip {
          position: absolute;
          top: -2px;
          bottom: -2px;
          width: 4px;
          background: #ffffff;
          border-radius: 2px;
          right: -2px;
          box-shadow: 0 0 12px var(--accent, #10b981), 0 0 4px #ffffff;
          opacity: 0;
        }
        .bar-pct {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          right: 10px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          color: rgba(255,255,255,0.9);
          text-shadow: 0 1px 3px rgba(0,0,0,0.5);
          opacity: 0;
          z-index: 5;
        }

        /* --- Milestone markers --- */
        .milestones {
          position: relative;
          height: 22px;
          margin-top: 4px;
        }
        .milestone {
          position: absolute;
          top: 0;
          transform: translateX(-50%);
          display: flex;
          flex-direction: column;
          align-items: center;
          opacity: 0;
        }
        .milestone-tick {
          width: 1px;
          height: 8px;
          background: rgba(255,255,255,0.15);
        }
        .milestone-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 9px;
          font-weight: 500;
          color: rgba(255,255,255,0.25);
          margin-top: 2px;
          white-space: nowrap;
        }
        .milestone.reached .milestone-tick {
          background: var(--accent, #10b981);
        }
        .milestone.reached .milestone-label {
          color: var(--accent, #10b981);
          opacity: 0.7;
        }

        /* --- Recent donor --- */
        .donor-area {
          padding: 12px 28px 18px;
          display: flex;
          align-items: center;
          gap: 12px;
          border-top: 1px solid rgba(255,255,255,0.04);
          margin-top: 8px;
        }
        .donor-badge {
          display: flex;
          align-items: center;
          gap: 10px;
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.05);
          border-radius: 8px;
          padding: 8px 16px;
          opacity: 0;
          transform: translateY(10px);
        }
        .donor-heart {
          font-size: 18px;
          color: var(--accent, #10b981);
          animation: heart-pulse 1.5s ease-in-out infinite;
        }
        @keyframes heart-pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.15); }
        }
        .donor-info {
          display: flex;
          flex-direction: column;
        }
        .donor-label {
          font-size: 10px;
          font-weight: 600;
          color: rgba(255,255,255,0.35);
          text-transform: uppercase;
          letter-spacing: 0.1em;
        }
        .donor-text {
          font-size: 14px;
          font-weight: 700;
          color: #ffffff;
          margin-top: 1px;
        }
        .donor-amount {
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          font-weight: 700;
          color: var(--accent, #10b981);
          margin-left: auto;
        }

        /* --- Celebration particles --- */
        .celebration {
          position: absolute;
          inset: -40px;
          pointer-events: none;
          overflow: hidden;
          z-index: 20;
        }
        .confetti {
          position: absolute;
          width: 8px;
          height: 8px;
          border-radius: 1px;
          opacity: 0;
        }
        .spark {
          position: absolute;
          width: 3px;
          height: 3px;
          border-radius: 50%;
          opacity: 0;
        }

        /* --- Burst ring --- */
        .burst-ring {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 20px;
          height: 20px;
          border: 2px solid var(--accent, #10b981);
          border-radius: 50%;
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
          z-index: 15;
        }
      </style>

      <div class="widget" id="widget">
        <div class="panel" id="panel">
          <div class="panel-glow" id="panel-glow"></div>
          <div class="panel-top-line" id="panel-top-line"></div>

          <!-- Header -->
          <div class="header">
            <div class="header-left" id="header-left">
              <div class="campaign-title" id="campaign-title"></div>
              <div class="campaign-subtitle" id="campaign-subtitle"></div>
            </div>
            <div class="amount-display" id="amount-display">
              <div class="amount-current" id="amount-current"></div>
              <div class="amount-goal" id="amount-goal"></div>
            </div>
          </div>

          <!-- Progress bar -->
          <div class="progress-area">
            <div class="bar-track" id="bar-track">
              <div class="bar-glow" id="bar-glow"></div>
              <div class="bar-fill-container" id="bar-fill-container">
                <div class="bar-fill"></div>
                <div class="bar-fill-shimmer"></div>
                <div class="bar-tip" id="bar-tip"></div>
              </div>
              <div class="bar-pct" id="bar-pct">0%</div>
            </div>
            <div class="milestones" id="milestones">
              <div class="milestone" id="ms-1">
                <div class="milestone-tick"></div>
                <div class="milestone-label" id="ms-label-1"></div>
              </div>
              <div class="milestone" id="ms-2">
                <div class="milestone-tick"></div>
                <div class="milestone-label" id="ms-label-2"></div>
              </div>
              <div class="milestone" id="ms-3">
                <div class="milestone-tick"></div>
                <div class="milestone-label" id="ms-label-3"></div>
              </div>
            </div>
          </div>

          <!-- Recent donor -->
          <div class="donor-area">
            <div class="donor-badge" id="donor-badge">
              <div class="donor-heart" id="donor-heart">&#9829;</div>
              <div class="donor-info">
                <div class="donor-label">Latest Donation</div>
                <div class="donor-text" id="donor-text"></div>
              </div>
              <div class="donor-amount" id="donor-amount"></div>
            </div>
          </div>
        </div>

        <!-- Celebration container -->
        <div class="celebration" id="celebration"></div>
        <div class="burst-ring" id="burst-ring"></div>
      </div>
    `;

    this._els = {};
    const ids = [
      'widget', 'panel', 'panel-glow', 'panel-top-line',
      'header-left', 'campaign-title', 'campaign-subtitle',
      'amount-display', 'amount-current', 'amount-goal',
      'bar-track', 'bar-fill-container', 'bar-glow', 'bar-tip', 'bar-pct',
      'milestones', 'ms-1', 'ms-2', 'ms-3', 'ms-label-1', 'ms-label-2', 'ms-label-3',
      'donor-badge', 'donor-heart', 'donor-text', 'donor-amount',
      'celebration', 'burst-ring',
    ];
    ids.forEach(id => {
      this._els[id] = this.shadowRoot.getElementById(id);
    });

    // Create confetti elements
    this._confettiEls = [];
    const confettiColors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#a855f7', '#ec4899', '#ffffff'];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.background = confettiColors[i % confettiColors.length];
      el.style.left = (20 + Math.random() * 60) + '%';
      el.style.top = '60%';
      el.style.width = (4 + Math.random() * 6) + 'px';
      el.style.height = (4 + Math.random() * 6) + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
      this._els['celebration'].appendChild(el);
      this._confettiEls.push(el);
    }

    // Spark elements
    this._sparkEls = [];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'spark';
      el.style.background = '#ffffff';
      el.style.left = '50%';
      el.style.top = '50%';
      this._els['celebration'].appendChild(el);
      this._sparkEls.push(el);
    }
  }

  _formatAmount(val) {
    const d = this._data;
    return d.currency + val.toLocaleString('en-US');
  }

  _formatShort(val) {
    const d = this._data;
    if (val >= 1000000) return d.currency + (val / 1000000).toFixed(1) + 'M';
    if (val >= 1000) return d.currency + (val / 1000).toFixed(0) + 'K';
    return d.currency + val;
  }

  _pct() {
    return Math.min((this._data.current / this._data.goal) * 100, 100);
  }

  _applyColors() {
    const w = this._els['widget'];
    const accent = this._data.accentColor;
    w.style.setProperty('--accent', accent);
    // Compute lighter variant
    const r = parseInt(accent.slice(1, 3), 16);
    const g = parseInt(accent.slice(3, 5), 16);
    const b = parseInt(accent.slice(5, 7), 16);
    const lighter = `rgb(${Math.min(r + 60, 255)}, ${Math.min(g + 60, 255)}, ${Math.min(b + 60, 255)})`;
    w.style.setProperty('--accent-light', lighter);
  }

  _populateData() {
    const d = this._data;
    const e = this._els;
    e['campaign-title'].textContent = d.title;
    e['campaign-subtitle'].textContent = d.subtitle || '';
    e['amount-goal'].textContent = 'of ' + this._formatAmount(d.goal);
    e['donor-text'].textContent = d.recentDonor || '';
    e['donor-amount'].textContent = d.recentAmount ? ('+' + this._formatAmount(d.recentAmount)) : '';

    // Milestones
    const milestones = [d.milestone1, d.milestone2, d.milestone3].filter(m => m > 0);
    milestones.forEach((m, i) => {
      const pctPos = Math.min((m / d.goal) * 100, 100);
      e[`ms-${i + 1}`].style.left = pctPos + '%';
      e[`ms-label-${i + 1}`].textContent = this._formatShort(m);
      if (d.current >= m) {
        e[`ms-${i + 1}`].classList.add('reached');
      } else {
        e[`ms-${i + 1}`].classList.remove('reached');
      }
    });
    // Hide unused milestones
    for (let i = milestones.length; i < 3; i++) {
      e[`ms-${i + 1}`].style.display = 'none';
    }
  }

  async load(data) {
    if (data) this._data = { ...this._data, ...data };
    this._applyColors();
    this._populateData();
    this._displayedAmount = 0;
    this._currentStep = 0;
    this._resetToHidden();
    return { status: 200 };
  }

  async playAction(opts) {
    if (this._stopTL) { this._stopTL.kill(); this._stopTL = null; }
    this._isVisible = true;
    this._currentStep = 0;
    const e = this._els;
    const d = this._data;

    return new Promise((resolve) => {
      this._playTL = gsap.timeline({
        defaults: { overwrite: 'auto' },
        onComplete: () => { this._playTL = null; resolve({ status: 200 }); }
      });

      // Panel rises up
      this._playTL.to(e['panel'], {
        opacity: 1, y: 0,
        duration: 0.45, ease: 'power3.out',
      }, 0);

      // Top line wipe
      this._playTL.to(e['panel-top-line'], {
        scaleX: 1,
        duration: 0.4, ease: 'power2.out',
      }, 0.1);

      // Panel glow
      this._playTL.to(e['panel-glow'], {
        opacity: 0.5,
        duration: 0.3, ease: 'power1.out',
      }, 0.2);
      this._playTL.to(e['panel-glow'], {
        opacity: 0.2,
        duration: 0.5, ease: 'power1.inOut',
      }, 0.5);

      // Header left
      this._playTL.to(e['header-left'], {
        opacity: 1, x: 0,
        duration: 0.35, ease: 'power2.out',
      }, 0.15);

      // Amount display
      this._playTL.to(e['amount-display'], {
        opacity: 1, x: 0,
        duration: 0.35, ease: 'power2.out',
      }, 0.2);

      // Amount count-up
      const amtProxy = { v: 0 };
      this._playTL.to(amtProxy, {
        v: d.current,
        duration: 1.2, ease: 'power2.out',
        onUpdate: () => {
          this._displayedAmount = Math.round(amtProxy.v);
          e['amount-current'].textContent = this._formatAmount(this._displayedAmount);
        },
      }, 0.3);

      // Bar fill
      const pct = this._pct();
      this._playTL.to(e['bar-fill-container'], {
        width: pct + '%',
        duration: 1.0, ease: 'power2.out',
      }, 0.35);

      // Bar glow follows fill
      this._playTL.to(e['bar-glow'], {
        width: pct + '%', opacity: 0.3,
        duration: 1.0, ease: 'power2.out',
      }, 0.35);

      // Bar tip appears
      this._playTL.to(e['bar-tip'], {
        opacity: 1,
        duration: 0.2,
      }, 0.5);

      // Percentage label
      const pctProxy = { v: 0 };
      this._playTL.to(pctProxy, {
        v: pct,
        duration: 1.0, ease: 'power2.out',
        onUpdate: () => {
          e['bar-pct'].textContent = Math.round(pctProxy.v) + '%';
        },
      }, 0.35);
      this._playTL.to(e['bar-pct'], {
        opacity: 1, duration: 0.2,
      }, 0.5);

      // Milestones stagger
      const milestones = [d.milestone1, d.milestone2, d.milestone3].filter(m => m > 0);
      milestones.forEach((m, i) => {
        this._playTL.to(e[`ms-${i + 1}`], {
          opacity: 1,
          duration: 0.25, ease: 'power1.out',
        }, 0.6 + i * 0.1);
      });

      // Donor badge
      this._playTL.to(e['donor-badge'], {
        opacity: 1, y: 0,
        duration: 0.3, ease: 'power2.out',
      }, 0.8);
    });
  }

  async stopAction(opts) {
    if (this._playTL) { this._playTL.kill(); this._playTL = null; }
    const e = this._els;

    return new Promise((resolve) => {
      this._stopTL = gsap.timeline({
        defaults: { overwrite: 'auto' },
        onComplete: () => {
          this._isVisible = false;
          this._stopTL = null;
          this._resetToHidden();
          resolve({ status: 200 });
        }
      });

      // Donor badge
      this._stopTL.to(e['donor-badge'], {
        opacity: 0, y: 8, duration: 0.2,
      }, 0);

      // Milestones
      this._stopTL.to(this.shadowRoot.querySelectorAll('.milestone'), {
        opacity: 0, duration: 0.15,
      }, 0);

      // Bar retracts
      this._stopTL.to(e['bar-tip'], { opacity: 0, duration: 0.1 }, 0.05);
      this._stopTL.to(e['bar-pct'], { opacity: 0, duration: 0.1 }, 0.05);
      this._stopTL.to(e['bar-fill-container'], {
        width: 0, duration: 0.35, ease: 'power2.in',
      }, 0.1);
      this._stopTL.to(e['bar-glow'], {
        width: 0, opacity: 0, duration: 0.35, ease: 'power2.in',
      }, 0.1);

      // Header
      this._stopTL.to(e['amount-display'], {
        opacity: 0, x: 10, duration: 0.2,
      }, 0.15);
      this._stopTL.to(e['header-left'], {
        opacity: 0, x: -10, duration: 0.2,
      }, 0.15);

      // Panel glow and top line
      this._stopTL.to(e['panel-glow'], { opacity: 0, duration: 0.15 }, 0.2);
      this._stopTL.to(e['panel-top-line'], { scaleX: 0, duration: 0.2 }, 0.2);

      // Panel drops
      this._stopTL.to(e['panel'], {
        opacity: 0, y: 20,
        duration: 0.3, ease: 'power2.in',
      }, 0.25);
    });
  }

  async updateAction(opts) {
    if (!opts || !opts.data) return { status: 200 };
    const data = opts.data;
    const e = this._els;
    const d = this._data;

    const prevAmount = d.current;
    const prevMilestones = [d.milestone1, d.milestone2, d.milestone3];
    let changed = false;

    for (const key of Object.keys(data)) {
      if (data[key] != null && data[key] !== d[key]) {
        d[key] = data[key];
        changed = true;
      }
    }
    if (!changed) return { status: 200 };

    this._applyColors();
    this._populateData();

    if (!this._isVisible) return { status: 200 };

    return new Promise((resolve) => {
      const tl = gsap.timeline({ onComplete: () => resolve({ status: 200 }) });

      // Animate amount
      const amtProxy = { v: this._displayedAmount };
      tl.to(amtProxy, {
        v: d.current,
        duration: 0.6, ease: 'power2.out',
        onUpdate: () => {
          this._displayedAmount = Math.round(amtProxy.v);
          e['amount-current'].textContent = this._formatAmount(this._displayedAmount);
        },
      }, 0);

      // Animate bar
      const pct = this._pct();
      tl.to(e['bar-fill-container'], {
        width: pct + '%', duration: 0.6, ease: 'power2.out',
      }, 0);
      tl.to(e['bar-glow'], {
        width: pct + '%', duration: 0.6, ease: 'power2.out',
      }, 0);

      const pctProxy = { v: parseFloat(e['bar-pct'].textContent) || 0 };
      tl.to(pctProxy, {
        v: pct, duration: 0.6, ease: 'power2.out',
        onUpdate: () => {
          e['bar-pct'].textContent = Math.round(pctProxy.v) + '%';
        },
      }, 0);

      // If donor changed, pop in the donor badge
      if (data.recentDonor || data.recentAmount) {
        tl.to(e['donor-badge'], {
          opacity: 0, y: 5, duration: 0.15,
        }, 0);
        tl.call(() => {
          e['donor-text'].textContent = d.recentDonor || '';
          e['donor-amount'].textContent = d.recentAmount ? ('+' + this._formatAmount(d.recentAmount)) : '';
        });
        tl.to(e['donor-badge'], {
          opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.3)',
        });
      }

      // Check for newly crossed milestones
      const milestoneVals = [d.milestone1, d.milestone2, d.milestone3];
      milestoneVals.forEach((m) => {
        if (m > 0 && prevAmount < m && d.current >= m) {
          // Milestone crossed -- trigger mini celebration
          tl.call(() => this._miniCelebrate(), [], 0.3);
        }
      });

      // Flash panel border on update
      tl.to(e['panel'], {
        boxShadow: '0 8px 40px rgba(0,0,0,0.5), 0 0 20px ' + d.accentColor + '33',
        duration: 0.15,
      }, 0);
      tl.to(e['panel'], {
        boxShadow: '0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)',
        duration: 0.4,
      }, 0.15);
    });
  }

  async customAction(opts) {
    if (!opts || !opts.action) return { status: 200 };
    if (opts.action === 'next') return this._triggerCelebration();
    return { status: 200 };
  }

  async _triggerCelebration() {
    if (!this._isVisible) return { status: 200 };

    return new Promise((resolve) => {
      const tl = gsap.timeline({ onComplete: () => resolve({ status: 200 }) });
      const e = this._els;

      // Burst ring
      tl.to(e['burst-ring'], {
        scale: 8, opacity: 0.6,
        duration: 0.3, ease: 'power2.out',
      }, 0);
      tl.to(e['burst-ring'], {
        scale: 15, opacity: 0,
        duration: 0.5, ease: 'power1.out',
      }, 0.3);

      // Panel flash
      tl.to(e['panel'], {
        boxShadow: '0 0 60px ' + this._data.accentColor + '66, 0 8px 40px rgba(0,0,0,0.5)',
        duration: 0.15,
      }, 0);
      tl.to(e['panel'], {
        boxShadow: '0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)',
        duration: 0.8,
      }, 0.3);

      // Panel glow pulse
      tl.to(e['panel-glow'], {
        opacity: 0.8, duration: 0.15,
      }, 0);
      tl.to(e['panel-glow'], {
        opacity: 0.2, duration: 0.6,
      }, 0.3);

      // Confetti burst
      this._confettiEls.forEach((el, i) => {
        const angle = (Math.random() * 360) * (Math.PI / 180);
        const dist = 80 + Math.random() * 200;
        const dx = Math.cos(angle) * dist;
        const dy = -(60 + Math.random() * 180);
        const rotation = Math.random() * 720 - 360;

        tl.set(el, {
          x: 0, y: 0, opacity: 0, rotation: 0, scale: 0.5,
        }, 0);
        tl.to(el, {
          opacity: 1, scale: 1,
          duration: 0.1,
        }, 0.05 + i * 0.01);
        tl.to(el, {
          x: dx, y: dy, rotation: rotation,
          duration: 0.8 + Math.random() * 0.4,
          ease: 'power2.out',
        }, 0.05 + i * 0.01);
        tl.to(el, {
          y: '+=' + (150 + Math.random() * 100),
          opacity: 0,
          duration: 0.6,
          ease: 'power1.in',
        }, 0.6 + i * 0.01);
      });

      // Spark burst
      this._sparkEls.forEach((el, i) => {
        const angle = (i / this._sparkEls.length) * 360 * (Math.PI / 180);
        const dist = 100 + Math.random() * 80;
        tl.set(el, { x: 0, y: 0, opacity: 0, scale: 1 }, 0);
        tl.to(el, {
          opacity: 1, duration: 0.05,
        }, 0.02);
        tl.to(el, {
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist,
          scale: 0,
          opacity: 0,
          duration: 0.5,
          ease: 'power2.out',
        }, 0.02);
      });

      // Amount number bounce
      tl.to(e['amount-current'], {
        scale: 1.15, duration: 0.15, ease: 'power2.out',
      }, 0);
      tl.to(e['amount-current'], {
        scale: 1, duration: 0.4, ease: 'elastic.out(1, 0.4)',
      }, 0.15);
    });
  }

  _miniCelebrate() {
    // Smaller version of celebration for milestone crossings
    const e = this._els;
    const tl = gsap.timeline();

    // Just sparks + bar glow pulse
    this._sparkEls.forEach((el, i) => {
      const angle = (i / this._sparkEls.length) * 360 * (Math.PI / 180);
      const dist = 50 + Math.random() * 50;
      tl.set(el, { x: 0, y: 0, opacity: 0, scale: 0.8 }, 0);
      tl.to(el, { opacity: 0.8, duration: 0.05 }, 0);
      tl.to(el, {
        x: Math.cos(angle) * dist,
        y: Math.sin(angle) * dist,
        scale: 0, opacity: 0,
        duration: 0.4, ease: 'power2.out',
      }, 0.05);
    });

    tl.to(e['bar-glow'], { opacity: 0.6, duration: 0.1 }, 0);
    tl.to(e['bar-glow'], { opacity: 0.3, duration: 0.4 }, 0.1);
  }

  dispose() {
    if (this._playTL) { this._playTL.kill(); this._playTL = null; }
    if (this._stopTL) { this._stopTL.kill(); this._stopTL = null; }
    if (this._celebrationTimer) { clearTimeout(this._celebrationTimer); }
    this._isVisible = false;
  }

  _resetToHidden() {
    const e = this._els;
    gsap.set(e['panel'], { opacity: 0, y: 30 });
    gsap.set(e['panel-top-line'], { scaleX: 0 });
    gsap.set(e['panel-glow'], { opacity: 0 });
    gsap.set(e['header-left'], { opacity: 0, x: -15 });
    gsap.set(e['amount-display'], { opacity: 0, x: 15 });
    gsap.set(e['bar-fill-container'], { width: 0 });
    gsap.set(e['bar-glow'], { width: 0, opacity: 0 });
    gsap.set(e['bar-tip'], { opacity: 0 });
    gsap.set(e['bar-pct'], { opacity: 0 });
    gsap.set(this.shadowRoot.querySelectorAll('.milestone'), { opacity: 0 });
    gsap.set(e['donor-badge'], { opacity: 0, y: 10 });
    gsap.set(e['burst-ring'], { scale: 0, opacity: 0 });
    gsap.set(this._confettiEls, { opacity: 0 });
    gsap.set(this._sparkEls, { opacity: 0 });
    this._displayedAmount = 0;
    e['amount-current'].textContent = this._formatAmount(0);
    e['bar-pct'].textContent = '0%';
  }
}

customElements.define('donation-goal', DonationGoal);
</script>
</body>
</html>
