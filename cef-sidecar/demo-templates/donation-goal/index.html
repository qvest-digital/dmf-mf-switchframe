<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="ograf-manifest" href="manifest.ograf.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 1920px; height: 1080px;
    -webkit-font-smoothing: antialiased;
}

#widget {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 1100px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* --- Main panel --- */
#panel {
    background: rgba(8, 10, 18, 0.93);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.04);
    opacity: 0;
    transform: translateY(30px);
    position: relative;
}

/* Accent top glow */
#panel-glow {
    position: absolute;
    top: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--accent, #10b981);
    border-radius: 1px;
    filter: blur(4px);
    opacity: 0;
}
#panel-top-line {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent, #10b981), transparent);
    transform: scaleX(0);
}

/* --- Header area --- */
.header {
    padding: 32px 40px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
#header-left {
    opacity: 0;
    transform: translateX(-15px);
}
#campaign-title {
    font-size: 56px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#campaign-subtitle {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-top: 6px;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#amount-display {
    text-align: right;
    opacity: 0;
    transform: translateX(15px);
}
#amount-current {
    font-family: 'JetBrains Mono', monospace;
    font-size: 72px;
    font-weight: 700;
    color: var(--accent, #10b981);
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#amount-goal {
    font-family: 'JetBrains Mono', monospace;
    font-size: 48px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-top: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Progress bar area --- */
.progress-area {
    padding: 28px 40px 10px;
    position: relative;
}
#bar-track {
    height: 40px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    overflow: visible;
    position: relative;
    border: 1px solid rgba(255,255,255,0.06);
}
#bar-fill-container {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    overflow: hidden;
    border-radius: 20px;
}
.bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, var(--accent, #10b981), var(--accent-light, #34d399));
    border-radius: 20px;
}
.bar-fill-shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
    animation: shimmer 2.5s ease-in-out infinite;
}
@keyframes shimmer {
    0% { transform: translateX(0); }
    100% { transform: translateX(200%); }
}
#bar-glow {
    position: absolute;
    top: -4px;
    bottom: -4px;
    left: 0;
    width: 0;
    background: var(--accent, #10b981);
    border-radius: 24px;
    filter: blur(10px);
    opacity: 0;
}
#bar-tip {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 4px;
    background: #ffffff;
    border-radius: 2px;
    right: -2px;
    box-shadow: 0 0 12px var(--accent, #10b981), 0 0 4px #ffffff;
    opacity: 0;
}
#bar-pct {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    opacity: 0;
    z-index: 5;
}

/* --- Milestone markers --- */
#milestones {
    position: relative;
    height: 40px;
    margin-top: 6px;
}
.milestone {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
}
.milestone-tick {
    width: 1px;
    height: 10px;
    background: rgba(255,255,255,0.15);
}
.milestone-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
    white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
.milestone.reached .milestone-tick {
    background: var(--accent, #10b981);
}
.milestone.reached .milestone-label {
    color: var(--accent, #10b981);
    opacity: 0.9;
}

/* --- Recent donor --- */
.donor-area {
    padding: 20px 40px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 12px;
}
#donor-badge {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 24px;
    opacity: 0;
    transform: translateY(10px);
}
#donor-heart {
    font-size: 36px;
    color: var(--accent, #10b981);
    animation: heart-pulse 1.5s ease-in-out infinite;
}
@keyframes heart-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}
.donor-info {
    display: flex;
    flex-direction: column;
}
.donor-label {
    font-size: 36px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#donor-text {
    font-size: 40px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}
#donor-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px;
    font-weight: 700;
    color: var(--accent, #10b981);
    margin-left: auto;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

/* --- Celebration particles --- */
#celebration {
    position: absolute;
    inset: -40px;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
}
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 1px;
    opacity: 0;
}
.spark {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    opacity: 0;
}

/* --- Burst ring --- */
#burst-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    border: 2px solid var(--accent, #10b981);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    z-index: 15;
}
</style>
</head>
<body>

<div id="widget">
    <div id="panel">
        <div id="panel-glow"></div>
        <div id="panel-top-line"></div>

        <!-- Header -->
        <div class="header">
            <div id="header-left">
                <div id="campaign-title"></div>
                <div id="campaign-subtitle"></div>
            </div>
            <div id="amount-display">
                <div id="amount-current"></div>
                <div id="amount-goal"></div>
            </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-area">
            <div id="bar-track">
                <div id="bar-glow"></div>
                <div id="bar-fill-container">
                    <div class="bar-fill"></div>
                    <div class="bar-fill-shimmer"></div>
                    <div id="bar-tip"></div>
                </div>
                <div id="bar-pct">0%</div>
            </div>
            <div id="milestones">
                <div class="milestone" id="ms-1">
                    <div class="milestone-tick"></div>
                    <div class="milestone-label" id="ms-label-1"></div>
                </div>
                <div class="milestone" id="ms-2">
                    <div class="milestone-tick"></div>
                    <div class="milestone-label" id="ms-label-2"></div>
                </div>
                <div class="milestone" id="ms-3">
                    <div class="milestone-tick"></div>
                    <div class="milestone-label" id="ms-label-3"></div>
                </div>
            </div>
        </div>

        <!-- Recent donor -->
        <div class="donor-area">
            <div id="donor-badge">
                <div id="donor-heart">&#9829;</div>
                <div class="donor-info">
                    <div class="donor-label">Latest Donation</div>
                    <div id="donor-text"></div>
                </div>
                <div id="donor-amount"></div>
            </div>
        </div>
    </div>

    <!-- Celebration container -->
    <div id="celebration"></div>
    <div id="burst-ring"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
    'use strict';

    var isVisible = false;
    var currentStep = 0;
    var playTL = null;
    var stopTL = null;
    var displayedAmount = 0;

    var data = {
        title: 'Building Hope Foundation',
        subtitle: '2026 Annual Fundraiser',
        current: 34750, goal: 50000,
        currency: '$',
        recentDonor: 'Sarah M.', recentAmount: 250,
        accentColor: '#10b981',
        milestone1: 10000, milestone2: 25000, milestone3: 50000
    };

    // Cache element references
    var e = {};
    var elIds = [
        'widget', 'panel', 'panel-glow', 'panel-top-line',
        'header-left', 'campaign-title', 'campaign-subtitle',
        'amount-display', 'amount-current', 'amount-goal',
        'bar-track', 'bar-fill-container', 'bar-glow', 'bar-tip', 'bar-pct',
        'milestones', 'ms-1', 'ms-2', 'ms-3', 'ms-label-1', 'ms-label-2', 'ms-label-3',
        'donor-badge', 'donor-heart', 'donor-text', 'donor-amount',
        'celebration', 'burst-ring'
    ];
    elIds.forEach(function(id) {
        e[id] = document.getElementById(id);
    });

    // Create confetti elements
    var confettiEls = [];
    var confettiColors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#a855f7', '#ec4899', '#ffffff'];
    for (var i = 0; i < 30; i++) {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.style.background = confettiColors[i % confettiColors.length];
        el.style.left = (20 + Math.random() * 60) + '%';
        el.style.top = '60%';
        el.style.width = (4 + Math.random() * 6) + 'px';
        el.style.height = (4 + Math.random() * 6) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
        e['celebration'].appendChild(el);
        confettiEls.push(el);
    }

    // Spark elements
    var sparkEls = [];
    for (var i = 0; i < 12; i++) {
        var el = document.createElement('div');
        el.className = 'spark';
        el.style.background = '#ffffff';
        el.style.left = '50%';
        el.style.top = '50%';
        e['celebration'].appendChild(el);
        sparkEls.push(el);
    }

    gsap.defaults({ overwrite: 'auto' });

    function formatAmount(val) {
        return data.currency + val.toLocaleString('en-US');
    }

    function formatShort(val) {
        if (val >= 1000000) return data.currency + (val / 1000000).toFixed(1) + 'M';
        if (val >= 1000) return data.currency + (val / 1000).toFixed(0) + 'K';
        return data.currency + val;
    }

    function pct() {
        return Math.min((data.current / data.goal) * 100, 100);
    }

    function applyColors() {
        var accent = data.accentColor;
        e['widget'].style.setProperty('--accent', accent);
        var r = parseInt(accent.slice(1, 3), 16);
        var g = parseInt(accent.slice(3, 5), 16);
        var b = parseInt(accent.slice(5, 7), 16);
        var lighter = 'rgb(' + Math.min(r + 60, 255) + ', ' + Math.min(g + 60, 255) + ', ' + Math.min(b + 60, 255) + ')';
        e['widget'].style.setProperty('--accent-light', lighter);
    }

    function populateData() {
        var d = data;
        e['campaign-title'].textContent = d.title;
        e['campaign-subtitle'].textContent = d.subtitle || '';
        e['amount-goal'].textContent = 'of ' + formatAmount(d.goal);
        e['donor-text'].textContent = d.recentDonor || '';
        e['donor-amount'].textContent = d.recentAmount ? ('+' + formatAmount(d.recentAmount)) : '';

        var milestones = [d.milestone1, d.milestone2, d.milestone3].filter(function(m) { return m > 0; });
        milestones.forEach(function(m, i) {
            var pctPos = Math.min((m / d.goal) * 100, 100);
            e['ms-' + (i + 1)].style.left = pctPos + '%';
            e['ms-label-' + (i + 1)].textContent = formatShort(m);
            if (d.current >= m) {
                e['ms-' + (i + 1)].classList.add('reached');
            } else {
                e['ms-' + (i + 1)].classList.remove('reached');
            }
        });
        for (var j = milestones.length; j < 3; j++) {
            e['ms-' + (j + 1)].style.display = 'none';
        }
    }

    function resetToHidden() {
        gsap.set(e['panel'], { opacity: 0, y: 30 });
        gsap.set(e['panel-top-line'], { scaleX: 0 });
        gsap.set(e['panel-glow'], { opacity: 0 });
        gsap.set(e['header-left'], { opacity: 0, x: -15 });
        gsap.set(e['amount-display'], { opacity: 0, x: 15 });
        gsap.set(e['bar-fill-container'], { width: 0 });
        gsap.set(e['bar-glow'], { width: 0, opacity: 0 });
        gsap.set(e['bar-tip'], { opacity: 0 });
        gsap.set(e['bar-pct'], { opacity: 0 });
        gsap.set(document.querySelectorAll('.milestone'), { opacity: 0 });
        gsap.set(e['donor-badge'], { opacity: 0, y: 10 });
        gsap.set(e['burst-ring'], { scale: 0, opacity: 0 });
        gsap.set(confettiEls, { opacity: 0 });
        gsap.set(sparkEls, { opacity: 0 });
        displayedAmount = 0;
        e['amount-current'].textContent = formatAmount(0);
        e['bar-pct'].textContent = '0%';
    }

    function miniCelebrate() {
        var tl = gsap.timeline();
        sparkEls.forEach(function(el, i) {
            var angle = (i / sparkEls.length) * 360 * (Math.PI / 180);
            var dist = 50 + Math.random() * 50;
            tl.set(el, { x: 0, y: 0, opacity: 0, scale: 0.8 }, 0);
            tl.to(el, { opacity: 0.8, duration: 0.05 }, 0);
            tl.to(el, {
                x: Math.cos(angle) * dist,
                y: Math.sin(angle) * dist,
                scale: 0, opacity: 0,
                duration: 0.4, ease: 'power2.out'
            }, 0.05);
        });
        tl.to(e['bar-glow'], { opacity: 0.6, duration: 0.1 }, 0);
        tl.to(e['bar-glow'], { opacity: 0.3, duration: 0.4 }, 0.1);
    }

    function triggerCelebration() {
        if (!isVisible) return;
        var tl = gsap.timeline();

        // Burst ring
        tl.to(e['burst-ring'], { scale: 8, opacity: 0.6, duration: 0.3, ease: 'power2.out' }, 0);
        tl.to(e['burst-ring'], { scale: 15, opacity: 0, duration: 0.5, ease: 'power1.out' }, 0.3);

        // Panel flash
        tl.to(e['panel'], {
            boxShadow: '0 0 60px ' + data.accentColor + '66, 0 8px 40px rgba(0,0,0,0.5)',
            duration: 0.15
        }, 0);
        tl.to(e['panel'], {
            boxShadow: '0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)',
            duration: 0.8
        }, 0.3);

        // Panel glow pulse
        tl.to(e['panel-glow'], { opacity: 0.8, duration: 0.15 }, 0);
        tl.to(e['panel-glow'], { opacity: 0.2, duration: 0.6 }, 0.3);

        // Confetti burst
        confettiEls.forEach(function(el, i) {
            var angle = (Math.random() * 360) * (Math.PI / 180);
            var dist = 80 + Math.random() * 200;
            var dx = Math.cos(angle) * dist;
            var dy = -(60 + Math.random() * 180);
            var rotation = Math.random() * 720 - 360;

            tl.set(el, { x: 0, y: 0, opacity: 0, rotation: 0, scale: 0.5 }, 0);
            tl.to(el, { opacity: 1, scale: 1, duration: 0.1 }, 0.05 + i * 0.01);
            tl.to(el, {
                x: dx, y: dy, rotation: rotation,
                duration: 0.8 + Math.random() * 0.4, ease: 'power2.out'
            }, 0.05 + i * 0.01);
            tl.to(el, {
                y: '+=' + (150 + Math.random() * 100),
                opacity: 0, duration: 0.6, ease: 'power1.in'
            }, 0.6 + i * 0.01);
        });

        // Spark burst
        sparkEls.forEach(function(el, i) {
            var angle = (i / sparkEls.length) * 360 * (Math.PI / 180);
            var dist = 100 + Math.random() * 80;
            tl.set(el, { x: 0, y: 0, opacity: 0, scale: 1 }, 0);
            tl.to(el, { opacity: 1, duration: 0.05 }, 0.02);
            tl.to(el, {
                x: Math.cos(angle) * dist,
                y: Math.sin(angle) * dist,
                scale: 0, opacity: 0,
                duration: 0.5, ease: 'power2.out'
            }, 0.02);
        });

        // Amount number bounce
        tl.to(e['amount-current'], { scale: 1.15, duration: 0.15, ease: 'power2.out' }, 0);
        tl.to(e['amount-current'], { scale: 1, duration: 0.4, ease: 'elastic.out(1, 0.4)' }, 0.15);
    }

    // Initialize
    applyColors();
    populateData();
    resetToHidden();

    // --- CasparCG interface ---

    window.play = function() {
        if (stopTL) { stopTL.kill(); stopTL = null; }
        isVisible = true;
        currentStep = 0;
        var d = data;

        playTL = gsap.timeline({
            onComplete: function() { playTL = null; }
        });

        // Panel rises up
        playTL.to(e['panel'], { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0);

        // Top line wipe
        playTL.to(e['panel-top-line'], { scaleX: 1, duration: 0.4, ease: 'power2.out' }, 0.1);

        // Panel glow
        playTL.to(e['panel-glow'], { opacity: 0.5, duration: 0.3, ease: 'power1.out' }, 0.2);
        playTL.to(e['panel-glow'], { opacity: 0.2, duration: 0.5, ease: 'power1.inOut' }, 0.5);

        // Header left
        playTL.to(e['header-left'], { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.15);

        // Amount display
        playTL.to(e['amount-display'], { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out' }, 0.2);

        // Amount count-up
        var amtProxy = { v: 0 };
        playTL.to(amtProxy, {
            v: d.current, duration: 1.2, ease: 'power2.out',
            onUpdate: function() {
                displayedAmount = Math.round(amtProxy.v);
                e['amount-current'].textContent = formatAmount(displayedAmount);
            }
        }, 0.3);

        // Bar fill
        var p = pct();
        playTL.to(e['bar-fill-container'], { width: p + '%', duration: 1.0, ease: 'power2.out' }, 0.35);

        // Bar glow follows fill
        playTL.to(e['bar-glow'], { width: p + '%', opacity: 0.3, duration: 1.0, ease: 'power2.out' }, 0.35);

        // Bar tip appears
        playTL.to(e['bar-tip'], { opacity: 1, duration: 0.2 }, 0.5);

        // Percentage label
        var pctProxy = { v: 0 };
        playTL.to(pctProxy, {
            v: p, duration: 1.0, ease: 'power2.out',
            onUpdate: function() {
                e['bar-pct'].textContent = Math.round(pctProxy.v) + '%';
            }
        }, 0.35);
        playTL.to(e['bar-pct'], { opacity: 1, duration: 0.2 }, 0.5);

        // Milestones stagger
        var milestones = [d.milestone1, d.milestone2, d.milestone3].filter(function(m) { return m > 0; });
        milestones.forEach(function(m, i) {
            playTL.to(e['ms-' + (i + 1)], { opacity: 1, duration: 0.25, ease: 'power1.out' }, 0.6 + i * 0.1);
        });

        // Donor badge
        playTL.to(e['donor-badge'], { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.8);
    };

    window.stop = function() {
        if (playTL) { playTL.kill(); playTL = null; }

        stopTL = gsap.timeline({
            onComplete: function() {
                isVisible = false;
                stopTL = null;
                resetToHidden();
            }
        });

        // Donor badge
        stopTL.to(e['donor-badge'], { opacity: 0, y: 8, duration: 0.2 }, 0);

        // Milestones
        stopTL.to(document.querySelectorAll('.milestone'), { opacity: 0, duration: 0.15 }, 0);

        // Bar retracts
        stopTL.to(e['bar-tip'], { opacity: 0, duration: 0.1 }, 0.05);
        stopTL.to(e['bar-pct'], { opacity: 0, duration: 0.1 }, 0.05);
        stopTL.to(e['bar-fill-container'], { width: 0, duration: 0.35, ease: 'power2.in' }, 0.1);
        stopTL.to(e['bar-glow'], { width: 0, opacity: 0, duration: 0.35, ease: 'power2.in' }, 0.1);

        // Header
        stopTL.to(e['amount-display'], { opacity: 0, x: 10, duration: 0.2 }, 0.15);
        stopTL.to(e['header-left'], { opacity: 0, x: -10, duration: 0.2 }, 0.15);

        // Panel glow and top line
        stopTL.to(e['panel-glow'], { opacity: 0, duration: 0.15 }, 0.2);
        stopTL.to(e['panel-top-line'], { scaleX: 0, duration: 0.2 }, 0.2);

        // Panel drops
        stopTL.to(e['panel'], { opacity: 0, y: 20, duration: 0.3, ease: 'power2.in' }, 0.25);
    };

    window.update = function(dataStr) {
        var incoming = (typeof dataStr === 'string') ? JSON.parse(dataStr) : dataStr;
        if (!incoming) return;

        var prevAmount = data.current;
        var changed = false;

        for (var key in incoming) {
            if (incoming[key] != null && incoming[key] !== data[key]) {
                data[key] = incoming[key];
                changed = true;
            }
        }
        if (!changed) return;

        applyColors();
        populateData();

        if (!isVisible) return;

        var tl = gsap.timeline();

        // Animate amount
        var amtProxy = { v: displayedAmount };
        tl.to(amtProxy, {
            v: data.current, duration: 0.6, ease: 'power2.out',
            onUpdate: function() {
                displayedAmount = Math.round(amtProxy.v);
                e['amount-current'].textContent = formatAmount(displayedAmount);
            }
        }, 0);

        // Animate bar
        var p = pct();
        tl.to(e['bar-fill-container'], { width: p + '%', duration: 0.6, ease: 'power2.out' }, 0);
        tl.to(e['bar-glow'], { width: p + '%', duration: 0.6, ease: 'power2.out' }, 0);

        var pctProxy = { v: parseFloat(e['bar-pct'].textContent) || 0 };
        tl.to(pctProxy, {
            v: p, duration: 0.6, ease: 'power2.out',
            onUpdate: function() {
                e['bar-pct'].textContent = Math.round(pctProxy.v) + '%';
            }
        }, 0);

        // If donor changed, pop in the donor badge
        if (incoming.recentDonor || incoming.recentAmount) {
            tl.to(e['donor-badge'], { opacity: 0, y: 5, duration: 0.15 }, 0);
            tl.call(function() {
                e['donor-text'].textContent = data.recentDonor || '';
                e['donor-amount'].textContent = data.recentAmount ? ('+' + formatAmount(data.recentAmount)) : '';
            });
            tl.to(e['donor-badge'], { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.3)' });
        }

        // Check for newly crossed milestones
        var milestoneVals = [data.milestone1, data.milestone2, data.milestone3];
        milestoneVals.forEach(function(m) {
            if (m > 0 && prevAmount < m && data.current >= m) {
                tl.call(miniCelebrate, [], 0.3);
            }
        });

        // Flash panel border on update
        tl.to(e['panel'], {
            boxShadow: '0 8px 40px rgba(0,0,0,0.5), 0 0 20px ' + data.accentColor + '33',
            duration: 0.15
        }, 0);
        tl.to(e['panel'], {
            boxShadow: '0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04)',
            duration: 0.4
        }, 0.15);
    };

    window.next = function() {
        triggerCelebration();
    };
})();
</script>
</body>
</html>
